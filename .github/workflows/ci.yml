name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked
      # A breaking schema change between installed contract versions needs a new
      # major version. The check runs on the producer's own contract root.
      - name: Schema-diff check
        run: uv run python -m asago_contracts_core.schema_diff_cli data/contracts
      - run: ./scripts/quality.sh
      - run: env -u ASAGO_SCENARIO_GENERATOR_MODEL_BASE_URL uv run pytest tests/ -q
      # The root run covers tests/ only, and conftest modules shadow each other
      # across packages, so each workspace member runs in its own session.
      - name: Package tests
        run: |
          status=0
          for dir in packages/*/; do
            if [ ! -d "${dir}tests" ]; then
              echo "::error::${dir} has no tests directory"
              status=1
              continue
            fi
            uv run pytest "${dir}tests" -q || status=1
          done
          exit "$status"

