# Model profiles for asago-scenario-generator STPA pipeline.
# Copy this file to config/model-profiles.yaml and fill in your real API keys.
gemma4-openrouter:
  base_url: https://openrouter.ai/api/v1
  model: google/gemma-4-26b-a4b-it
  api_key: YOUR-API-KEY-HERE
  context_window: 262144
  max_completion_tokens: 8192
  timeout: 300
  temperature: 0.4
gemma4-local:
  base_url: https://your-local-endpoint.example.com/v1
  model: gemma-4-26b-a4b-it
  api_key: unused
  context_window: 32768
  max_completion_tokens: 8192
  timeout: 300
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  use_guided_decoding: false
qwen-local:
  base_url: https://your-local-qwen-endpoint.example.com/v1
  model: qwen3.5-27b
  api_key: unused
  context_window: 32768
  max_completion_tokens: 8192
  timeout: 300
  temperature: 1.0
  top_p: 1.0
  enable_thinking: false
  use_guided_decoding: true
# Same endpoint and sampling as `gemma4-oc` except temperature 0.4. The orch
# generate stage uses it for SP1 (Stages 1a-2) and SP2 (realization through ICA
# generation); Stage 5 (SP3) keeps `gemma4-oc` at temperature 1.0.
gemma4-oc-t04:
  base_url: https://your-openshift-gemma-endpoint.example.com/v1
  model: gemma-4-26b-a4b-it
  api_key: unused
  context_window: 32768
  max_completion_tokens: 8192
  temperature: 0.4
  top_p: 0.95
  top_k: 64
gemma4-oc-taxonomy:
  base_url: https://your-openshift-gemma-endpoint.example.com/v1
  model: gemma-4-26b-a4b-it
  api_key: unused
  context_window: 32768
  max_completion_tokens: 8192
  timeout: 300
  temperature: 0.4
sonnet-4:
  base_url: https://openrouter.ai/api/v1
  model: anthropic/claude-sonnet-4
  api_key: YOUR-API-KEY-HERE
  context_window: 200000
  max_completion_tokens: 8192
  timeout: 300
  temperature: 0.3
