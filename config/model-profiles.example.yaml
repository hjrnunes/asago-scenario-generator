# Model profiles for asago-scenario-generator STPA pipeline.
# Copy this file to config/model-profiles.yaml and fill in your real API keys.
gemma4-openrouter:
  base_url: https://openrouter.ai/api/v1
  model: google/gemma-4-26b-a4b-it
  api_key: YOUR-API-KEY-HERE
  context_window: 262144
  max_completion_tokens: 8192
  timeout: 300
  temperature: 0.4
gemma4-local:
  base_url: https://your-local-endpoint.example.com/v1
  model: gemma-4-26b-a4b-it
  api_key: unused
  context_window: 32768
  max_completion_tokens: 8192
  timeout: 300
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  use_guided_decoding: false
qwen-local:
  base_url: https://your-local-qwen-endpoint.example.com/v1
  model: qwen3.5-27b
  api_key: unused
  context_window: 32768
  max_completion_tokens: 8192
  timeout: 300
  temperature: 1.0
  top_p: 1.0
  enable_thinking: false
  use_guided_decoding: true
gemma4-oc-taxonomy:
  base_url: https://your-openshift-gemma-endpoint.example.com/v1
  model: gemma-4-26b-a4b-it
  api_key: unused
  context_window: 32768
  max_completion_tokens: 8192
  timeout: 300
  temperature: 0.4
# GLM 5.3 behind an internal gateway, as the Gemma-versus-GLM comparison used it.
glm53-enmaas-65k-low-rp:
  base_url: https://your-glm-gateway.example.com/v1
  model: rits/zai-org/glm-5-3
  api_key: YOUR-API-KEY-HERE
  # The 65k window is the comparison's choice, not the gateway's (262144).
  context_window: 65536
  # Medium reasoning effort spends the whole 16384 cap on reasoning and returns
  # no content, and the gateway times a request out at about 300 seconds, so
  # the cap stays and the effort drops to low.
  max_completion_tokens: 16384
  reasoning_effort: low
  # Z.ai's recommended sampling for GLM; no top_k or seed.
  temperature: 1.0
  top_p: 0.95
  # Without a penalty, 4 of 34 replies looped to the cap; at 1.05, 1 of 326.
  # The gateway forwards the field in extra_body. Its notes warn that
  # penalties can make GLM drift into Chinese; keep the value small.
  repetition_penalty: 1.05
  timeout: 900
sonnet-4:
  base_url: https://openrouter.ai/api/v1
  model: anthropic/claude-sonnet-4
  api_key: YOUR-API-KEY-HERE
  context_window: 200000
  max_completion_tokens: 8192
  timeout: 300
  temperature: 0.3
luna:
  base_url: https://api.openai.com/v1
  model: gpt-6-luna
  api_key: YOUR-API-KEY-HERE
  context_window: 1050000
  max_completion_tokens: 32000
  reasoning_effort: medium
  service_tier: flex
  service_tier_fallback: default
  sampling_controls: false
  strict_json_schema: false
  json_schema_strict: false
  timeout: 900
