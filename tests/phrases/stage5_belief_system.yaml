template: stage5_belief_system.j2
cases:
  separate-beliefs:
    required:
      - >-
        The scenario is already written: the user prompt gives its account,
        which is a hypothesis about how an AI agent could fail, not an observed
        result.
      - >-
        state one flawed belief for each causal factor the user prompt lists.
      - >-
        `flawed_belief` is what the controller wrongly takes to be true when it
        issues the unsafe action, as one statement in domain words about this
        scenario.
      - "The loan record on screen belongs to the member who asked for it."
      - Name the wrong value the controller holds, not the variable that holds it
      - >-
        a belief that only restates a variable or source description is not a
        flawed belief.
      - Do not put an ID or a local handle in it.
      - >-
        Where the user prompt says code fills a factor's variable, give that
        factor only `flawed_belief`.
      - >-
        Otherwise set `process_model_variable` to the handle of the listed
        variable the belief is about and `missing_variable` to `null`.
      - >-
        set `process_model_variable` to `none` and `missing_variable` to a
        short description, in domain words, of the variable the controller
        would need, for example "which member a loan record belongs to".
      - >-
        Reply with one JSON object that has one key per listed `source_handle`
        and no other key.
      - '{"flawed_belief": "<belief>"}'
      - >-
        {"flawed_belief": "<belief>", "process_model_variable": "<variable
        handle or none>", "missing_variable": "<description or null>"}
    once:
      - Return only the schema-matching JSON object.
    forbidden:
      - set `process_model_variable` and `missing_variable` to `null`
      - attacker_bdi
      - evidence_status
