template: structural_routing_system.j2
cases:
  routing-batch:
    required:
      - >-
        The response schema lists the fields of every disposition; set each
        route field that the selected disposition does not use to `null`, as
        the unresolved example shows, never to an empty list.
      - A `targeted` route requires a `targeting` object
      - >-
        `targeting` holds the route's structural placement: non-empty
        `slot_ids`, `hazard_ids`, and `constraint_ids`
      - each an empty list when the path has none
      - '"disposition":"targeted","targeting":{"slot_ids":["RESP-90:CA-90-1:INCORRECT"]'
      - >-
        The example's IDs only show their form; name the slots from the index's
        `slots` rows whose action and type fit the obligation.
      - Each slot has one UCA type
      - >-
        Choose each slot's type from how the concern's mechanism causes the loss
        on this path. Harm through content, a value, a destination, or an effect
        that the action delivers is INCORRECT. Use NOT_PROVIDED only when the
        harm comes from the action being withheld when it is needed, and
        WRONG_TIMING only when the moment or order of an observable action
        causes it. Name every slot whose type fits. The examples' types are not
        a default.
      - '"disposition":"unresolved","targeting":null'
      - '"missing_concepts":null'
      - whether the system has the surface
      - free-text input, tool calls, or retrieval
      - not whether the system description mentions or describes the
      - Choose `absent_from_system` only when the structure lacks that surface
      - adjacent safeguard is not evidence
      - ingress resource proves only that content can arrive
      - >-
        Every route also requires non-empty `obligation_id`,
        `attack_pattern_id`, `evidence`, and the literal `disposition`.
      - >-
        `attack_pattern_id` binds the route to its own question: copy unchanged
        the `attack_pattern_id` stated on the question whose `obligation_handle`
        the route copies. Questions in one batch can name different, similar
        patterns. Judge each route on its own question's pattern only: its
        rationale, evidence, and both semantic-assessment rationales describe
        that pattern's mechanism and name no other question's
        `attack_pattern_id`. A route whose `attack_pattern_id` is not its own
        question's, or whose text names another question's pattern ID, fails
        local validation.
      - >-
        Complete targeted example (the handle and `attack_pattern_id` are only
        schema-valid fixtures; copy the actual supplied values unchanged):
      - '"attack_pattern_id":"AP-T90-01"'
      - >-
        `risk_alignment`: whether that mechanism would realize the reviewed
        risk's class in this system: its subject, operation, affected object,
        and consequence
      - >-
        Each question's `reviewed_risk` holds the risk's `risk_id` and short
        `name`, its `description`, and, when known, its `threat`,
        `consequence`, and `impact`.
      - >-
        The `description` is the risk class, and it sets what `risk_alignment`
        judges.
      - >-
        The `threat`, `consequence`, and `impact` are the source policy's
        example of that class, written in the policy's own setting with that
        setting's actors and assets. They illustrate the class; they do not
        define it.
      - >-
        A mechanism that realizes the class in this system supports alignment
        even when its actor, data, or setting differs from the policy example,
        and resemblance to the example alone is not alignment evidence.
    forbidden:
      - known_mechanism_refs
      - >-
        whether that mechanism would realize the reviewed risk's subject,
        operation, affected object, and consequence
      - known mechanism glossary
      - unauthenticated access or authentication rejection is not poisoned
      - neither establishes semantic separation
      - Before selecting `targeted` for goal redirection
      - Common empty collections belong only to the inward compiled route
      - '"slot_ids":["RESP-1:CA-1-1:INCORRECT"]'
  routing-batch-known-mechanism:
    required:
      - adjacent safeguard is not evidence
      - ingress resource proves only that content can arrive
      - >-
        A concern in the known concern glossary may list `known_mechanism_refs`:
        the control-loop mechanisms its attack is known to realize, each defined
        once in the known mechanism glossary of the user message.
      - A glossary entry's `id` is the reference
      - "`question` says what the mechanism asks of the system"
      - >-
        `required_evidence` lists conditions that exact supplied descriptions
        must meet before the path carries the mechanism, every one of them, and
        names the kinds of description that count
      - >-
        `counterexamples` lists structures that resemble the mechanism but do
        not carry it
      - >-
        Before selecting `targeted` for a concern that lists known mechanisms,
        identify exact supplied descriptions that meet the required evidence of
        one of them. A description that matches only a counterexample is not
        that evidence.
      - >-
        If no such descriptions exist, the disposition must be `unresolved`, even
        when the mechanism seems generally plausible and the reviewed risk is
        conceptually aligned, and `mechanism_assessment` is
        `insufficient_evidence` for the missing mechanism path.
      - >-
        Similar wording, consequences, capability flags, or integration IDs
        cannot substitute for that path.
    once:
      - known_mechanism_refs
    forbidden:
      - unauthenticated access or authentication rejection is not poisoned
      - Before selecting `targeted` for goal redirection
