template: structural_routing_system.j2
cases:
  routing-batch:
    required:
      - >-
        The response schema lists the fields of every disposition; set each
        route field that the selected disposition does not use to `null`, as
        the unresolved example shows, never to an empty list.
      - A `targeted` route requires a `targeting` object
      - >-
        `targeting` holds the route's structural placement: non-empty
        `slot_ids`, `hazard_ids`, and `constraint_ids`
      - each an empty list when the path has none
      - '"disposition":"targeted","targeting":{"slot_ids":["RESP-90:CA-90-1:INCORRECT"]'
      - >-
        The example's IDs only show their form; name the slots from the index's
        `slots` rows whose action and type fit the obligation.
      - Each slot has one UCA type
      - >-
        Choose each slot's type from how the concern's mechanism causes the loss
        on this path. Harm through content, a value, a destination, or an effect
        that the action delivers is INCORRECT. Use NOT_PROVIDED only when the
        harm comes from the action being withheld when it is needed, and
        WRONG_TIMING only when the moment or order of an observable action
        causes it. Name every slot whose type fits. The examples' types are not
        a default.
      - '"disposition":"unresolved","targeting":null'
      - '"missing_concepts":null'
      - whether the system has the surface
      - free-text input, tool calls, or retrieval
      - not whether the system description mentions or describes the
      - Choose `absent_from_system` only when the structure lacks that surface
      - adjacent safeguard is not evidence
      - unauthenticated access or authentication rejection is not poisoned
      - ingress resource proves only that content can arrive
      - neither establishes semantic separation
      - the disposition must be `unresolved`
      - capability flags, or integration IDs cannot substitute
    forbidden:
      - Common empty collections belong only to the inward compiled route
      - '"slot_ids":["RESP-1:CA-1-1:INCORRECT"]'
