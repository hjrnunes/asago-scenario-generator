template: revision_authority_correction.j2
cases:
  no-variables:
    once:
      - >-
        Correct the `authority_for_update` of every feedback channel listed
        above in this one response; the checks run again on every feedback
        channel the revision adds or restates.
      - >-
        For each listed channel, write a `basis` that cites `Use case: ...` or
        an exact target-evidence `ref` offered in this request and states the
        authority scope in domain words.
      - >-
        When the supplied evidence does not settle that channel's authority,
        omit its `authority_for_update` instead; an omitted assessment means
        `unknown`.
      - Otherwise answer the critic findings as the task asks.
    forbidden:
      - Keep every other record as written.
    ordered:
      - - Correct the `authority_for_update` of every feedback channel
        - write a `basis` that cites
        - omit its `authority_for_update` instead
        - Otherwise answer the critic findings as the task asks.
