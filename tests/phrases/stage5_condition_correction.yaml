    once:
      - >-
        - discriminating_condition_record_kind_mismatch: compare an argument
        only with a value of a type the input schema of its own operation
        declares for it; the tool-call condition never converts a value for
        eq, ne, in, or not_in. In record_selection.argument_values, map an
        argument only to a path whose value has such a type. Keep
        observation_criteria and safe_observable_outcome unchanged.
