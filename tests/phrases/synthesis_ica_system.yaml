template: synthesis_ica_system.j2
cases:
  slot-request:
    required:
      - Standard STPA calls an unsafe action a UCA
      - In this project, an ICA is one concrete security finding
      - real context
      - controller belief
      - A routed obligation is advisory
      - A route never forces an ICA finding
      - NOT_PROVIDED
      - INCORRECT
      - WRONG_TIMING
      - WRONG_DURATION
      - is_na=false
      - at least one structured item in `findings`
      - is_na=true
      - non-empty `na_rationale`
      - matching zero-based positions
      - do not use `unresolved` merely because
      - not proof that the current control already recognizes
      - requires another control path
      - subject, operation, affected object, and effect
      - "`value`, `input`, `parameter`, or `threshold` are not mechanism evidence"
      - taxonomy mechanism is not established evidence
      - "`deviation` and `hazardous_context` must describe the unsafe control"
      - "Bad: `when an adversary uses poisoned persistent memory`"
      - "Good: `the current authorization is not revalidated after stored context"
      - legacy `responsibility`, `control_action`, `uca_type`, or `icas`
      - a non-empty `na_rationale` citing a complete structural property
      - misstates it, contradicts it, or adds details it does not contain
      - the source supplies no applicable answer
      - a pallet on quality hold leaves the warehouse
      - a defective shipment reaches a customer
      - An authorized omission is not automatically unsafe
      - susceptibility claim
      - not a hazardous state
      - asserted consequence
      - cite only the slot owner's process-model parts and feedback channels
      - "a coordination slot cites only its path's `shared_process_model` and no feedback channel"
      - explains context and is not citable
      - "lists every pair it rests on in `governing_pairs`, each pair once"
      - "of the form `\"<constraint_id>/<hazard_id>\"`"
      - "one hazard listed in that constraint's `related_hazards`"
      - "The slot's `consideration_results` is an object with one key for each item"
      - "With no required pair it is the empty object `{}`."
    forbidden:
      - For a NOT_PROVIDED slot marked N/A
      - Mechanism suggestions for this target
      - mechanism_handle
      - authority_for_update
      - absence cannot be hazardous
      - lacks a requirement
      - not established before
      - the supplied hazardous context
      - the supplied loss consequence occurs
  slot-request-feedback-authority:
    required:
      - >-
        A feedback channel may carry `authority_for_update`, the recorded
        assessment of whether it is entitled to establish the value of the
        process-model part it updates, as opposed to only reporting it.
      - a channel without it is unknown. It is separate from `untrusted`.
      - >-
        A controller that takes a non-authoritative report as establishing the
        value, such as a reported approval taken as the approval itself, holds
        a wrong process-model value even when the report is accurate.
    once:
      - "`authority_for_update`"
  slot-request-mechanism-suggestion:
    required:
      - A routed obligation is advisory
      - "The slot's `consideration_results` is an object with one key for each item"
      - >-
        An entry under `Mechanism suggestions for this target` is a known
        control-loop mechanism that code found on a typed path to this slot's
        control action or coordination link, and that a separate check judged
        the path's descriptions to carry.
      - >-
        It is a hypothesis, not established evidence: it names no reviewed risk
        or taxonomy concern and makes no coverage claim.
      - >-
        Its `mechanism_handle` is an opaque handle; `name` and `question` say
        what the mechanism asks of the system; `slot_ids` are the slots it is
        suggested for; `path` lists, with their descriptions, the feedback
        channels on which it was found and the process-model variables they
        update; `instruction` repeats how to treat it.
      - >-
        A path entry explains context: cite it in `process_model_refs` or
        `feedback_refs` only when the rules above already make it citable for
        the slot.
      - >-
        Analyze the slot's own hazards and its routed obligations exactly as
        you would without a suggestion. A suggestion adds a question; it never
        removes or replaces a finding, a hazard, or a routed result.
      - >-
        The slot's `consideration_results` also has one key for each item under
        `Required mechanism consideration pairs`: the item's
        `mechanism_handle`, whose value is that suggestion's one result, with
        the same `disposition`, `finding_indexes`, and `rationale` as a routed
        obligation's result.
      - >-
        Choose `finding` only when a finding in that slot expresses the
        mechanism on the named path through a supplied hazard and governing
        constraint, `proposed_not_applicable` only under the N/A rule above,
        and `unresolved` when the supplied evidence cannot decide.
      - >-
        Keep the mechanism out of the `deviation` and `hazardous_context`, as
        for any routed concern, and state the relationship in the result's
        `rationale`.
    once:
      - Mechanism suggestions for this target
