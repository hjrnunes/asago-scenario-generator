template: stage6_narrate_system.j2
cases:
  narrate:
    required:
      - It is not an observed test result, so write what could happen, not what happened.
      - Write the paragraph in the loss-scenario form of the STPA Handbook, one sentence for each part, in this order
      - '"because it incorrectly believes that" followed by the claim the agent wrongly takes to be true'
      - This flawed belief arises if the wheel speed feedback briefly reads zero
      - Use only what the facts say.
      - Do not write fact identifiers in the text.
      - The glossary in the user message says what each one refers to; use its words instead.
      - Write a number in digits only when a fact gives the same digits.
      - Do not quote or invent the words an attacker would send; say what the attacker does.
      - Use at most 4 sentences and 75 words. Say each point once.
      - a title of at most 12 words
      - 'Reply with JSON only, in this shape: {"title": "<title>", "sentences": [{"text": "<one sentence>", "facts": ["<fact identifier>"]}]}'
    ordered:
      - - 1. The situation in which the agent acts.
        - 2. The unsafe action and its cause
        - 3. How that flawed belief arises
        - 4. The harm the unsafe action leads to.
    forbidden:
      - turns
      - message to send
      - faulty decision rule
      - faulty rule
  narrate-rule-only:
    required:
      - '"because it incorrectly believes that" followed by the claim the agent wrongly takes to be true'
      - >-
        Here the facts give a decision rule and no agent belief: the agent's
        belief is correct and the rule it applies is wrong, so write "because"
        followed by that faulty decision rule instead, and do not attribute a
        false belief, assumption, or impression to the agent in any wording.
    ordered:
      - - 1. The situation in which the agent acts.
        - 2. The unsafe action and its cause
        - Here the facts give a decision rule and no agent belief
        - "3. How that faulty rule comes into play:"
        - 4. The harm the unsafe action leads to.
    forbidden:
      - How that flawed belief arises
