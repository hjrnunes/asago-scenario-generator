template: stage2_call2b_system.j2
cases:
  no-variables:
    required:
      - Each CA is a single discrete action the controller takes
      - Split composite actions into separate CAs
      - approve or reject request
      - CA-X-1 Approve request
      - CA-X-2 Reject request
      - >-
        A CA containing "or", "and", or similar conjunctions is likely
        composite and should be split
      - Security safeguards do not exhaust control actions
      - internal request/prompt payload is not
      - A **controller** is a functional decision maker
      - A **process model part** is decision-relevant information
      - feedback updates the process model
      - the action influences the controlled
      - discrete control action or actions that realize that function
      - controlled process declared in this same response
      - Primary control actions (CA-*) first
      - >-
        An operation allowed only in an authenticated or reviewed state must
        retain that condition
      - Keep distinct source-named functions and operations distinct
      - >-
        Declare a controlled process only when the source establishes the
        external entity or interface
      - control action target
      - at least N feedback channels
      - at least one feedback channel
      - >-
        assess whether the channel is entitled to establish the value of the PM
        it `updates`, as `authority_for_update` with a `status` and a `basis`
      - "`authoritative`: the evidence makes this channel a source that may set the value"
      - >-
        `non_authoritative`: the evidence shows the channel can report the
        value but not establish it
      - >-
        `conditional`: the channel may establish the value only within a scope
        or under conditions the evidence states
      - "`unknown`: the evidence bears on the question but leaves it open"
      - Write it in domain words, without control-structure IDs
      - A `basis` is required unless `status` is `unknown`
      - an omitted assessment means `unknown`
      - "Do not derive authority from `source_kind`"
      - >-
        a trusted source kind does not make a channel authoritative, and an
        untrusted one does not by itself make it non-authoritative
    forbidden:
      - Poh
      - STPA-Sec
