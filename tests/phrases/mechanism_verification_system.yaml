template: mechanism_verification_system.j2
cases:
  mechanism-item:
    required:
      - stays within one conversation
      - needs no tool, retrieval, or memory
      - the selected control action produces the response the attack ends in
      - govern the consequence the mechanism names
      - A constraint on that consequence is not an adjacent concern
      - Do not infer missing architecture
      - "`insufficient_evidence`"
    forbidden:
      - "Accepted example:"
      - "Rejected example:"
      - Authentication establishes identity
      - known_mechanism_refs
      - known mechanism glossary
      - structural suggestion
  mechanism-item-known-mechanism:
    required:
      - stays within one conversation
      - Do not infer missing architecture
      - >-
        An item may list `known_mechanism_refs`: the control-loop mechanisms its
        distinctive mechanism is known to realize, each defined once in the known
        mechanism glossary of the user message.
      - A glossary entry's `id` is the reference
      - "`question` says what the mechanism asks of the system"
      - >-
        `required_evidence` lists conditions that the selected descriptions must
        meet before the path carries the mechanism, every one of them
      - >-
        `counterexamples` lists paths that resemble the mechanism but do not
        carry it
      - >-
        For such an item, `mechanism_specific` requires selected descriptions
        that meet the required evidence of one listed mechanism.
      - >-
        A path that matches only a counterexample governs an adjacent concern,
        so its verdict is `adjacent_control`.
    once:
      - known_mechanism_refs
    forbidden:
      - "Accepted example:"
      - "Rejected example:"
      - structural suggestion
  mechanism-suggestion:
    required:
      - Do not infer missing architecture
      - "For such an item, `mechanism_specific` requires selected descriptions"
      - >-
        Every item in this request is a structural suggestion, not a taxonomy
        concern or a reviewed risk.
      - >-
        Code proposed it because typed fields of the structure fit the listed
        known mechanism: a feedback channel's source kind and recorded
        authority, the variable it updates, and the action or coordination
        link that reads that variable. That fit is not evidence.
      - >-
        A source kind does not show that an adversary can author the
        information, and a channel labelled retrieved content may carry the
        controller's own state or an internal source no adversary can write.
      - >-
        The item's `distinctive_mechanism` gives the known mechanism's `name`,
        its `description` is that mechanism's question, and its
        `known_mechanism_refs` names that one mechanism.
      - >-
        Its `selected_structural_path` lists the controller, the feedback
        channel, the variable, and the action or coordination link the path
        ends at, with what the action targets or the link reaches.
      - A suggestion cites no hazard or constraint of its own.
      - >-
        each has an `id` and a `description`, and its `governing_constraints`
        lists the constraints that govern it, each with an `id` and a
        `description`.
      - >-
        Use `mechanism_specific` only when the selected descriptions meet every
        required-evidence condition of the listed mechanism and a listed hazard
        and one of its governing constraints govern the harm the path's action
        or link leads to.
      - >-
        Use `adjacent_control` when the path matches a counterexample of the
        mechanism or leads to no listed hazard, and `insufficient_evidence`
        when the descriptions cannot decide.
    forbidden:
      - risk_alignment
      - "Accepted example:"
