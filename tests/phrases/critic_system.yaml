template: critic_system.j2
cases:
  no-probes:
    required:
      - An explicit requirement may still justify a proposed missing safeguard
      - >-
        Ask for a process-model part or feedback only when the supplied
        evidence provides its source
      - >-
        an operation, tool result, record, or other supplied channel that
        actually returns or carries that information
      - >-
        When no supplied source provides it, do not request it as if it were
        available
      - Report source/function omissions as structural gaps
      - a recommendation is not an observed installed capability
      - >-
        An attack path requires supplied attacker access and the relevant
        operation or state
      - Do not infer a recipient, mechanism, or misuse from hazard
      - "## False positive guidance"
      - Not every system needs every capability
      - a CriticFindings with gaps, checklist_results, and taxonomy_probe_results
      - the capability IS present but the control structure fails to govern it
      - typed `effect_kind`
      - action-kind consistency gap
      - Never silently relabel
    forbidden:
      - STPA-Sec
