template: revision_system.j2
cases:
  empty-structure:
    required:
      - Do not turn an "only when" condition into an unconditional denial
      - "## Supplied Use-Case Evidence"
      - Test use case
      - >-
        Keep a critic's proposed safeguard in a recommendation's justification
        unless the source establishes the omitted function
      - >-
        give it a `dismissed` gap disposition with a one-sentence justification
      - >-
        takes a `recommendation` gap disposition instead; its justification
        labels it as proposed rather than present.
      - >-
        The gap_dispositions list holds one disposition per critic gap, as the
        task describes: `addressed` gaps name the elements this reply adds or
        changes, and `dismissed` or `recommendation` gaps are ones this reply
        leaves unchanged.
      - '"gap_dispositions": []' 
      - Use the new/modified delta only for a source-established omitted function
      - Treat the Existing Control Structure section as current-state evidence
      - Do not copy a critic's recommendation into that diagram as if it were observed
      - "## ID format rules"
      - Do NOT restate the entire control structure
      - "New controlled processes: CP-{next_cp_num} (next available: CP-1)"
      - "New coordination mechanisms: CM-{next_cm_num} (next available: CM-1)"
      - RevisionDelta with only new and modified elements
      - You may DISMISS a finding if you judge it to be a false positive
      - connect properly
      - modified_responsibilities list must contain ONLY responsibilities you are CHANGING
      - solution-neutrality
      - ElementRef references must be valid
      - feedback channel updates must reference a PM in the same responsibility
      - New responsibilities
      - RESP-{next_resp_num}
      - New PM parts
      - PM-{resp_num}-{next_pm_num}
      - New CAs
      - CA-{resp_num}-{next_ca_num}
      - New FB channels
      - FB-{resp_num}-{next_fb_num}
      - New RCs
      - RC-{resp_num}-{next_rc_num}
      - New coordination links
      - CL-{next_cl_num}
      - effect_kind` is a closed enum
      - do not invent synonyms such as
      - internal_state_update
      - 'MUST use `effect_kind: "agent_message"`'
      - source, source kind, and authority for update shown under existing elements
      - >-
        An existing element's `description` is only the text after its ID on
        the first line. The indented lines under it are its typed fields, each
        named as its JSON field.
      - >-
        copy each one into that field and keep it out of the `description`;
        never append field names or values to the prose
      - >-
        `type` is exactly `responsibility` (with a `RESP-*` ID) or
        `controlled_process` (with a `CP-*` ID)
      - >-
        Write the kind of information only in `source_kind`; a source kind is
        never a reference `type`.
      - "A feedback channel may also carry `authority_for_update`, with a `status` and a `basis`"
      - >-
        Assess it for a new channel, and for a restated channel shown without
        one, where the supplied evidence bears on it; omit it otherwise.
      - >-
        Omitting it leaves a new channel, or a restated channel shown without
        one, `unknown`; a restated channel that still updates the PM shown with
        it keeps the assessment shown.
      - "An assessment covers only the PM shown with it"
      - >-
        when a restated channel updates a different PM, the assessment shown is
        not kept, so assess it again or omit it to leave it `unknown`.
      - >-
        An assessment dropped because its basis fails these requirements leaves
        the channel `unknown`, not with the assessment shown.
      - "Do not derive authority from `source_kind`"
      - >-
        an untrusted user message may be authoritative for that user's own
        request, requested date, answers, or operation arguments
      - a value the system must establish independently
      - cites evidence the request actually supplies
      - "say `Use case: ...` and identify the relevant wording"
      - A bare ref such as `state:records.owner_id`
      - "`user input is unverified`"
      - "`user-provided text`"
      - >-
        Use case: the greenhouse sensor reading establishes the current
        greenhouse temperature.
    forbidden:
      - STPA-Sec
      - An omitted assessment means `unknown`.
      - dismissed_gaps
      - dismissed-gaps
