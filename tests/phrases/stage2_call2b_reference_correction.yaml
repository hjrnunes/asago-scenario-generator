template: stage2_call2b_reference_correction.j2
cases:
  unknown-references:
    once:
      - "Unknown references in the prior response:"
      - "Valid action targets and feedback sources:"
    required:
      - The prior response names references that this structure does not hold.
      - Correct only these references, and keep every other record as written.
      - "(not a process model part of"
      - "(responsibility):"
      - "(controlled process):"
      - >-
        A target or source may also name a controlled process that you add to
        `controlled_processes` in this response.
      - >-
        An action's `process_model_refs` name only process model parts of the
        action's own responsibility.
    forbidden:
      - left out `controlled_processes`
      - "Controlled processes referenced but not declared:"
    ordered:
      - - "Unknown references in the prior response:"
        - "Valid action targets and feedback sources:"
        - "Valid process model parts:"
  undeclared-controlled-processes:
    once:
      - "Controlled processes referenced but not declared:"
      - "Unknown references in the prior response:"
    required:
      - >-
        The prior response left out `controlled_processes` (or sent it empty),
        so it declares no controlled process.
      - >-
        Declare each controlled process listed below in `controlled_processes`
        with its `cp_id` and `description`, or retarget the references that
        name it to a responsibility listed under "Valid action targets and
        feedback sources".
      - >-
        Adding these controlled processes is allowed even though every other
        record stays as written.
    ordered:
      - - Correct only these references, and keep every other record as written.
        - The prior response left out `controlled_processes`
        - "Controlled processes referenced but not declared:"
        - "Unknown references in the prior response:"
