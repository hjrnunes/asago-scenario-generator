template: realize_inventory_correction.j2
cases:
  no-target-variables:
    once:
      - The prior response names operations that are not in the observed operations list.
    required:
      - >-
        Every `resource_id` and `operation_id` in `selected_operation` and
        `candidate_operations` must be copied exactly from one listed
        operation, and both values of a pair must come from the same listed
        operation.
      - >-
        Replace each operation named in the validation error with the exact
        pair it was meant to name.
      - >-
        If no listed operation fits, drop it from the response and set
        `disposition` to `ambiguous` or `unmapped`, as the remaining evidence
        supports.
      - Keep every other field as written.
    forbidden:
      - "mcp:"
      - "resource_id:"
      - "operation_id:"
    ordered:
      - - The prior response names operations that are not in the observed operations list.
        - Replace each operation named in the validation error
        - If no listed operation fits
        - Keep every other field as written.
