template: stage2_call2b_user.j2
cases:
  neutral-status:
    forbidden:
      - These observed operations declare an output
    required:
      - functional outputs
      - internal request/prompt payload is not `model_output`
      - not a substitute for delivering the answer
      - separate safeguard operation explicitly established
      - does not establish an installed safeguard action
      - "## Use-Case Description"
      - >-
        `model_output` is text or structured output returned by the tested
        model or agent invocation
      - "`tool_call` is a structured invocation emitted by the tested agent"
      - "`state_change` changes session or persistent state"
      - "`agent_message` is an internal message to another responsibility"
      - "`environment_action` is an external side effect"
      - advice to a user
      - loan-renewal invocation
      - session record
      - risk flag
      - physical alarm
      - responsibilities
      - >-
        plus `authority_for_update` (`status` and `basis`) where the supplied
        evidence bears on whether the channel may establish the value of the PM
        it updates
      - >-
        An untrusted user message may still be authoritative for the user's own
        request, requested dates, answers, or operation arguments
      - a value the system must establish independently
      - "Every settled basis must cite `Use case: ...` or an exact target-evidence `ref`"
      - state the scope in domain words
      - do more than restate `source_kind`
  one-responsibility:
    required:
      - "Governing security constraints:"
  operation-results:
    once:
      - >-
        These observed operations declare an output, so they return what they
        report to the responsibility that invokes them:
        `operation:cancel_order`, `operation:lookup_order`.
      - >-
        Likewise, an operation that stores, submits, or queues an item for
        another party's later action, such as a review or an approval, reports
        that the item was accepted and the status it was stored with, not the
        outcome of that later action. A variable for that outcome needs feedback
        from where the outcome is recorded, for example an operation that reads
        the record, or it stays unknown.
    required:
      - Decide from the operation's description and the use case what its result tells that responsibility
      - whether a requested change took effect or which record was returned
      - the responsibility needs a process-model variable for that information, kept current by a feedback channel
      - "That channel's `source` is where the reported information originates"
      - "record or state data is `operation_result`; free text from documents or other authors is `retrieved_content`"
      - >-
        A result that only acknowledges that a request was accepted or handed
        off reports that acknowledgement, not the state of whoever handles the
        request
      - When the evidence does not say what a result reports, add no variable or channel for it
      - >-
        An answer, summary, or other text that an operation returns in reply to
        a question is `retrieved_content`, not `operation_result`, even when the
        operation draws it from approved or curated material; so is a refusal or
        hand-off signal it returns in place of that text.
      - >-
        A variable that such a result updates tracks what the text says or
        whether the operation answered, refused, or handed off; it does not
        claim the state of a record, such as whether a record is approved,
        current, or reviewed, because the text does not carry that state.
    forbidden:
      - "`operation:notify_courier`,"
      - "`operation:notify_courier`."
