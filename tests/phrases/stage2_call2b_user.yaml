template: stage2_call2b_user.j2
cases:
  neutral-status:
    required:
      - functional outputs
      - internal request/prompt payload is not `model_output`
      - not a substitute for delivering the answer
      - separate safeguard operation explicitly established
      - does not establish an installed safeguard action
      - "## Use-Case Description"
      - >-
        `model_output` is text or structured output returned by the tested
        model or agent invocation
      - "`tool_call` is a structured invocation emitted by the tested agent"
      - "`state_change` changes session or persistent state"
      - "`agent_message` is an internal message to another responsibility"
      - "`environment_action` is an external side effect"
      - advice to a user
      - loan-renewal invocation
      - session record
      - risk flag
      - physical alarm
      - responsibilities
      - >-
        plus `authority_for_update` (`status` and `basis`) where the supplied
        evidence bears on whether the channel may establish the value of the PM
        it updates
      - >-
        An untrusted user message may still be authoritative for the user's own
        request, requested dates, answers, or operation arguments
      - a value the system must establish independently
      - "Every settled basis must cite `Use case: ...` or an exact target-evidence `ref`"
      - state the scope in domain words
      - do more than restate `source_kind`
  one-responsibility:
    required:
      - "Governing security constraints:"
