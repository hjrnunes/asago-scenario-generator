template: ica_hazard_verification_system.j2
cases:
  verification-request:
    required:
      - '"if A, require B"'
      - supervisor signs OR an automated check passes
      - missing supervisor sign-off alone
      - unspecified specialist
      - "`insufficient_evidence`, not a repaired story"
      - provider (provider input)
      - customer (customer output)
      - different_action
      - "`absence_loss_ids`"
      - "`absence_consequence`"
      - "`performed_without_effect`: that action is issued as required"
      - it does not take effect
      - A correct action without effect is out of scope
      - the alarm is sent to the right recipient but nobody acts on it
      - one of the seven states above
    forbidden:
      - NOT_PROVIDED
