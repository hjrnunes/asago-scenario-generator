template: stage5_belief_user.j2
cases:
  separate-beliefs:
    required:
      - "## Scenario account"
      - "Test hypothesis — not an observed execution result."
      - "## Causal Factors"
      - >-
        The scenario's causal factors, under local `source_handle` values. Each
        one gives its source type, the source's description, the factor's
        description in this scenario, and whether code fills its
        `process_model_variable` or you choose it.
      - >-
        Give each listed factor one entry under its `source_handle`. Do not
        return structural IDs.
      - "process_model_variable: filled by code (variable_1); give only flawed_belief"
      - >-
        your choice: the handle of the listed variable that holds the belief,
        or none with missing_variable
      - "## Process-Model Variables"
      - >-
        A factor whose `process_model_variable` is your choice names one of
        these handles, or `none` when no listed variable holds its flawed
        belief.
    ordered:
      - - "## Scenario account"
        - "## Causal Factors"
        - "## Process-Model Variables"
    forbidden:
      - "## Scenario SCN-"
      - authority_for_update
      - Allowed channels
  feedback-authority-beliefs:
    required:
      - >-
        A feedback factor may carry `authority_for_update`, the recorded
        assessment of whether its source is entitled to establish the value of
        the variable it updates, as opposed to only reporting it
      - with the `basis` that cites the supplied evidence
      - A factor without it is unknown.
      - >-
        When the source is non-authoritative, the flawed belief can be that
        what the source reported establishes the value, such as taking a
        reported approval as the approval itself.
