template: stage1a_risk_user.j2
cases:
  records-service:
    required:
      - No organizational risks provided
      - Do not require an adversary, entry point, or concrete attack path for inclusion
      - adversarial relevance
      - concrete component, data flow, or integration point
      - "grounded in this specific system's architecture and domain"
    forbidden:
      - Focus on adversary-actionable threats
      - Omit operational risks with no adversarial vector
  risk-card-evidence:
    required:
      - Each risk gives its ID and name, then these labelled fields
      - "`class description`: the risk class. Derive the risk's losses from it."
      - >-
        `in-boundary system action` and `in-boundary affected stakeholder`,
        when present: the action of this system through which the class could
        arise and the stakeholder it would affect, as an earlier review of this
        system stated them. A risk without them falls back to its class
        description.
      - >-
        `policy example consequence`, when present: the source policy's example
        of the class, written in the policy's own setting. It illustrates the
        class; it is not the loss to derive.
      - "risk-records — Disclosure of account records; class description:"
      - "; policy example consequence:"
    forbidden:
      - "; consequence:"
      - "; description:"
