  - credo-risk-037
  - credo-risk-038
  - mit-ai-risk-subdomain-2.1
  - mit-ai-risk-subdomain-2.2
- loss_id: L-2
  description: Regulatory non-compliance, legal penalties, or fines resulting from
    incorrect financial advice, policy misrepresentation, or violation of data privacy
    laws (e.g., GDPR).
  provenance: risk_card
  source_risk_cards:
  - ai-risk-taxonomy-unauthorized-distribution---pii-(personal-identifiable-information)
  - ai-risk-taxonomy-unauthorized-processing---financial-records
  - ai-risk-taxonomy-unauthorized-processing---pii-(personal-identifiable-information)
  - atlas-data-privacy-rights
  - credo-risk-023
  - credo-risk-024
  - mit-ai-risk-subdomain-2.1
- loss_id: L-3
  description: Financial loss or fraudulent activity resulting from the manipulation
    of payment schedules, refunds, or transaction data through the AI assistant.
  provenance: risk_card
  source_risk_cards:
  - atlas-dangerous-use
  - credo-risk-026
  - mit-ai-risk-subdomain-2.2
  - mit-ai-risk-subdomain-4.3
- loss_id: L-4
  description: Erosion of customer trust and brand reputation due to the delivery
    of confident-but-wrong answers regarding fees, policies, or payment terms.
  provenance: risk_card
  source_risk_cards:
  - atlas-hallucination
  - atlas-over-or-under-reliance
  - credo-risk-016
  - credo-risk-021
  - mit-ai-risk-subdomain-3.1
  - mit-ai-risk-subdomain-5.1
  - mit-ai-risk-subdomain-7.3
- loss_id: L-5
  description: Legal liability or intellectual property (IP) disputes arising from
    the unauthorized use or reproduction of copyrighted material in AI-generated responses.
  provenance: risk_card
  source_risk_cards:
  - atlas-copyright-infringement
  - atlas-data-usage-rights
  - atlas-generated-content-ownership
  - atlas-model-usage-rights
  - credo-risk-025
  - credo-risk-039
  - mit-ai-risk-subdomain-6.3
- loss_id: L-6
  description: Unfair or discriminatory treatment of customers due to biased or stereotypical
    model outputs.
  provenance: risk_card
  source_risk_cards:
  - atlas-output-bias
  - credo-risk-010
  - mit-ai-risk-subdomain-1.1
- loss_id: L-7
  description: Operational disruption or loss of flexibility due to dependency on
    third-party model availability or service terms.
  provenance: risk_card
  source_risk_cards:
  - credo-risk-048
use_case_losses:
- loss_id: L-8
  description: Loss of merchant revenue or relationship damage due to the assistant
    incorrectly processing or misrepresenting merchant-specific policies or transaction
    statuses.
  provenance: use_case
  source_risk_cards: []
- loss_id: L-9
  description: Financial loss to Klarna or customers due to the assistant's inability
    to handle complex, nuanced, or multi-step financial workflows that fall outside
    simple intents.
  provenance: use_case
  source_risk_cards: []
hazards:
- hazard_id: H-1
  description: The assistant's conversational interface or RAG-style knowledge-grounding
    system leaks sensitive customer data (PII or financial records) in its responses.
  related_losses:
  - L-1
- hazard_id: H-2
  description: The assistant provides inaccurate or non-compliant information regarding
    financial policies, fees, or payment terms via its natural language interface.
  related_losses:
  - L-2
  - L-4
- hazard_id: H-3
  description: The assistant's API integrations to Klarna backend services execute
    unauthorized or manipulated financial transactions (refunds, payment modifications).
  related_losses:
  - L-3
- hazard_id: H-4
  description: The assistant generates content that infringes on third-party intellectual
    property or violates usage rights within the chat flow.
  related_losses:
  - L-5
- hazard_id: H-5
  description: The assistant's outputs exhibit disparate error rates or biased characterizations
    across different customer demographic groups.
  related_losses:
  - L-6
- hazard_id: H-6
  description: The assistant's operational availability is tied to the availability
    and service terms of the OpenAI GPT-4-class foundation model.
  related_losses:
  - L-7
- hazard_id: H-7
  description: The assistant provides incorrect information or executes actions based
    on merchant-specific data or policies that conflict with the actual merchant terms.
  related_losses:
  - L-8
- hazard_id: H-8
  description: The assistant enters an unrecoverable or incorrect state when processing
    complex, non-standard, or multi-intent customer financial requests.
  related_losses:
  - L-9
security_constraints:
- constraint_id: SC-1
  rule: Prevent the inclusion of sensitive customer data in the prompt or output sent
    to the third-party foundation model.
  related_hazards:
  - H-1
  applies_when:
  - during the construction of the authenticated user context
  - when processing natural language queries
  description: 'Prevent the inclusion of sensitive customer data in the prompt or
    output sent to the third-party foundation model. Applies when: during the construction
    of the authenticated user context; when processing natural language queries.'
- constraint_id: SC-2
  rule: Ensure all responses regarding financial terms and policies are strictly grounded
    in the approved RAG knowledge-grounding whitelist.
  related_hazards:
  - H-2
  applies_when:
  - when the assistant answers questions about fees, policies, or payment terms
  description: 'Ensure all responses regarding financial terms and policies are strictly
    grounded in the approved RAG knowledge-grounding whitelist. Applies when: when
    the assistant answers questions about fees, policies, or payment terms.'
- constraint_id: SC-3
  rule: Validate all financial transaction requests (refunds, payment scheduling)
    against the authenticated user's session and backend authorization rules.
  related_hazards:
  - H-3
  applies_when:
  - when the assistant invokes an API integration to Klarna backend services
  description: 'Validate all financial transaction requests (refunds, payment scheduling)
    against the authenticated user''s session and backend authorization rules. Applies
    when: when the assistant invokes an API integration to Klarna backend services.'
- constraint_id: SC-4
  rule: Restrict the assistant's output generation to content that does not violate
    known copyright or intellectual property constraints.
  related_hazards:
  - H-4
  applies_when:
  - when generating conversational responses
  description: 'Restrict the assistant''s output generation to content that does not
    violate known copyright or intellectual property constraints. Applies when: when
    generating conversational responses.'
- constraint_id: SC-5
  rule: Ensure assistant outputs do not exhibit disparate error rates or biased characterizations
    across different customer demographic groups.
  related_hazards:
  - H-5
  applies_when:
  - during ongoing monitoring of customer service interactions
  description: 'Ensure assistant outputs do not exhibit disparate error rates or biased
    characterizations across different customer demographic groups. Applies when:
    during ongoing monitoring of customer service interactions.'
- constraint_id: SC-6
  rule: Maintain an escalation path to human agents when the assistant provides inaccurate
    or non-compliant information regarding financial policies, fees, or payment terms.
  related_hazards:
  - H-2
  applies_when:
  - when the assistant identifies a regulated topic or high ambiguity
  description: 'Maintain an escalation path to human agents when the assistant provides
    inaccurate or non-compliant information regarding financial policies, fees, or
    payment terms. Applies when: when the assistant identifies a regulated topic or
    high ambiguity.'
- constraint_id: SC-7
  rule: Ensure the system can operate or fail gracefully according to Klarna's compliance
    standards if third-party model availability is lost.
  related_hazards:
  - H-6
  applies_when:
  - during third-party service interruptions
  description: 'Ensure the system can operate or fail gracefully according to Klarna''s
    compliance standards if third-party model availability is lost. Applies when:
    during third-party service interruptions.'
- constraint_id: SC-8
  rule: Ensure all merchant-specific policy information provided by the assistant
    is verified against the specific merchant's data in the backend.
  related_hazards:
  - H-7
  applies_when:
  - when the assistant retrieves merchant information
  - when responding to queries regarding specific merchant policies
  description: 'Ensure all merchant-specific policy information provided by the assistant
    is verified against the specific merchant''s data in the backend. Applies when:
    when the assistant retrieves merchant information; when responding to queries
    regarding specific merchant policies.'
- constraint_id: SC-9
  rule: Route the interaction to a human agent when the assistant enters an unrecoverable
    or incorrect state when processing complex, non-standard, or multi-intent customer
    financial requests.
  related_hazards:
  - H-8
  applies_when:
  - when the assistant detects high complexity in the user's natural language query
  - when the assistant cannot map the query to a predefined workflow
  description: 'Route the interaction to a human agent when the assistant enters an
    unrecoverable or incorrect state when processing complex, non-standard, or multi-intent
    customer financial requests. Applies when: when the assistant detects high complexity
    in the user''s natural language query; when the assistant cannot map the query
    to a predefined workflow.'
