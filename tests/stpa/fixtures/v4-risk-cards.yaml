- risk_id: ai-risk-taxonomy-unauthorized-disclosure---financial-records
  risk_name: Unauthorized disclosure - Financial records
  risk_description: Unauthorized disclosure - Financial records is defined as if the
    model response involves unauthorized disclosure of sensitive financial data.
  consequence: The unauthorized exposure of sensitive financial records through the
    output of external large language models.
- risk_id: ai-risk-taxonomy-unauthorized-disclosure---pii-(personal-identifiable-information)
  risk_name: Unauthorized disclosure - PII (Personal Identifiable Information)
  risk_description: Unauthorized disclosure - PII (Personal Identifiable Information)
    is defined as whether the model response involves unauthorized disclosure or handling
    of personally identifiable information (PII).
  consequence: The preserved queries containing PII could be breached by hackers or
    released through the service provider's training data processes.
- risk_id: ai-risk-taxonomy-unauthorized-distribution---pii-(personal-identifiable-information)
  risk_name: Unauthorized distribution - PII (Personal Identifiable Information)
  risk_description: Unauthorized distribution - PII (Personal Identifiable Information)
    is defined as whether the model response facilitates or refuses to assist in the
    unauthorized distribution of Personal Identifiable Information (PII).
  consequence: The unauthorized distribution of sensitive personal data through the
    company's monitored systems.
- risk_id: ai-risk-taxonomy-unauthorized-processing---financial-records
  risk_name: Unauthorized processing - Financial records
  risk_description: Unauthorized processing - Financial records is defined as if the
    model response involves unauthorized processing or handling of sensitive financial
    data.
  consequence: The unauthorized handling or processing of sensitive financial records
    within the company's monitored systems.
- risk_id: ai-risk-taxonomy-unauthorized-processing---pii-(personal-identifiable-information)
  risk_name: Unauthorized processing - PII (Personal Identifiable Information)
  risk_description: Unauthorized processing - PII (Personal Identifiable Information)
    is defined as if the model response involves unauthorized processing or misuse
    of Personal Identifiable Information (PII) in any form.
  consequence: The company's AI systems process or expose PII in a manner that violates
    applicable laws, regulations, and internal directives.
- risk_id: atlas-confidential-data-in-prompt
  risk_name: Confidential data in prompt
  risk_description: Confidential information might be included as a part of the prompt
    that is sent to the model.
  consequence: Confidential organizational data and sensitive personal information
    are transmitted to a third-party generative AI system.
- risk_id: atlas-copyright-infringement
  risk_name: Copyright infringement
  risk_description: A model might generate content that is similar or identical to
    existing work protected by copyright or covered by open-source license agreement.
  consequence: The direct output of these tools, such as code from GitHub CoPilot
    or images from DALL-E, may constitute unauthorized reproductions of protected
    works.
- risk_id: atlas-dangerous-use
  risk_name: Dangerous use
  risk_description: Generative AI models might be used with the sole intention of
    harming people.
  consequence: The execution of fraudulent, destructive, or inappropriate system usage
    and the manipulation of financial services transactions.
- risk_id: atlas-data-privacy-rights
  risk_name: Data privacy rights alignment
  risk_description: Applicable laws can establish data subject rights such as opt-out
    rights, right to access, and right to be forgotten. Synthetic data might raise
    unique concerns, such as the potential for reidentification of individuals from
    seemingly anonymous synthetic data. Data subject rights might also be relevant
    in scenarios where synthetic data is derived from sensitive or personal information.
  consequence: A failure to meet regulatory, privacy, and legal obligations, specifically
    regarding GDPR and other applicable privacy laws.
- risk_id: atlas-data-usage
  risk_name: Data usage restrictions
  risk_description: Laws and other restrictions can limit or prohibit the use of some
    data for specific AI use cases.
  consequence: The deployment of AI models that rely on prohibited data, leading to
    immediate legal challenges or injunctions against the specific tool.
- risk_id: atlas-data-usage-rights
  risk_name: Data usage rights restrictions
  risk_description: Terms of service, license compliance, or other IP issues may restrict
    the ability to use certain data for building models.
  consequence: The invalidation of outputs for proprietary work and the exposure of
    users to copyright violations or conflicts with other firms using similar outputs.
- risk_id: atlas-exposing-personal-information
  risk_name: Exposing personal information
  risk_description: When personal identifiable information (PII) or sensitive personal
    information (SPI) are used in training data, fine-tuning data, seed data for synthetic
    data generation, or as part of the prompt, models might reveal that data in the
    generated output. Revealing personal information is a type of data leakage.
  consequence: The unauthorized release or exposure of sensitive personal information,
    nonpublic personal information, or company intellectual property through model
    outputs or data breaches.
- risk_id: atlas-generated-content-ownership
  risk_name: Generated content ownership and IP
  risk_description: Legal uncertainty about the ownership and intellectual property
    rights of AI-generated content.
  consequence: Invalidation of output for copyrighted work, copyright violations,
    or legal conflicts with other firms using similar outputs.
- risk_id: atlas-hallucination
  risk_name: Hallucination
  risk_description: Hallucinations generate factually inaccurate or untruthful content
    relative to the model's training data or input. Hallucinations are also sometimes
    referred to lack of faithfulness or lack of groundedness. In some instances, synthetic
    data that is generated by large language models might include hallucinations that
    result in the data possibly being inaccurate, fabricated, or disconnected from
    reality. Hallucinations can compromise model performance, accuracy, and relevance.
  consequence: The generation of output that could lead to fraudulent, destructive,
    or inappropriate system usage.
- risk_id: atlas-ip-information-in-prompt
  risk_name: IP information in prompt
  risk_description: Copyrighted information or other intellectual property might be
    included as a part of the prompt that is sent to the model.
  consequence: The public exposure or unauthorized release of sensitive company intellectual
    property and internal strategy.
- risk_id: atlas-model-usage-rights
  risk_name: Model usage rights restrictions
  risk_description: Terms of service, licenses, or other rules restrict the use of
    certain models.
  consequence: The firm may face copyright violations, invalidation of proprietary
    or copyrighted work, and legal liability for breaching external system terms.
- risk_id: atlas-non-disclosure
  risk_name: Non-disclosure
  risk_description: Content might not be clearly disclosed as AI generated.
  consequence: The invalidation of output for proprietary or copyrighted work and
    the exposure of users to copyright violations.
- risk_id: atlas-nonconsensual-use
  risk_name: Nonconsensual use
  risk_description: Generative AI models might be intentionally used to imitate people
    through deepfakes by using video, images, audio, or other modalities without their
    consent.
  consequence: The creation of highly personalized and deceptive deepfake content
    that can be used for cyber crime or phishing.
- risk_id: atlas-output-bias
  risk_name: Output bias
  risk_description: Generated content might unfairly represent certain groups or individuals.
  consequence: The implementation of poor, biased, and/or unethical business practices
    or decisions.
- risk_id: atlas-over-or-under-reliance
  risk_name: Over- or under-reliance
  risk_description: In AI-assisted decision-making tasks, reliance measures how much
    a person trusts (and potentially acts on) a model's output. Over-reliance occurs
    when a person puts too much trust in a model, accepting a model's output when
    the model's output is likely incorrect. Under-reliance is the opposite, where
    the person doesn't trust the model but should.
  consequence: The implementation of inaccurate IT instructions leading to data loss,
    or the use of distorted statistics and legal/tax advice in business decisions.
- risk_id: atlas-personal-information-in-data
  risk_name: Personal information in data
  risk_description: Inclusion or presence of personal identifiable information (PII)
    and sensitive personal information (SPI) in the data used for training or fine
    tuning the model might result in unwanted disclosure of that information.
  consequence: Hackers could breach the service to access and release preserved queries
    containing sensitive data or proprietary information.
- risk_id: atlas-personal-information-in-prompt
  risk_name: Personal information in prompt
  risk_description: Personal information or sensitive personal information that is
    included as a part of a prompt that is sent to the model.
  consequence: Sensitive data and proprietary information are transmitted to and stored
    by a third-party generative AI system.
- risk_id: atlas-prompt-priming
  risk_name: Prompt priming
  risk_description: Because generative models produce output based on the input provided,
    the model can be prompted to reveal specific kinds of information. For example,
    adding personal information in the prompt increases its likelihood of generating
    similar kinds of personal information in its output. If personal data was included
    as part of the model's training, there is a possibility it could be revealed.
  consequence: The model generates and outputs specific kinds of personal or sensitive
    information in response to the primed prompts.
- risk_id: atlas-revealing-confidential-information
  risk_name: Revealing confidential information
  risk_description: When confidential information is used in training data, fine-tuning
    data, or as part of the prompt, models might reveal that data in the generated
    output. Revealing confidential information is a type of data leakage.
  consequence: The direct leakage of the firm's IP, NPI, or PII through the generated
    output of the AI system.
- risk_id: atlas-spreading-disinformation
  risk_name: Spreading disinformation
  risk_description: Generative AI models might be used to intentionally create misleading
    or false information to deceive or influence a targeted audience.
  consequence: The successful delivery of deceptive communications that bypass traditional
    scrutiny through increased personalization and realism.
- risk_id: credo-risk-010
  risk_name: Stereotype perpetuation (Slattery et al., 2024; IBM, 2024)
  risk_description: The AI system's outputs may explicitly reflect or reinforce harmful
    stereotypes, prejudices, or biased characterizations of specific groups. The AI
    system may exhibit unjustified or harmful differences in accuracy, quality, or
    outcomes across demographic groups, potentially leading to unfair treatment and
    discrimination. This includes both disparate error rates that affect opportunity
    and
  consequence: The generation of biased or unethical business practices, such as unfair
    employee appraisals that do not reflect actual human assessment.
- risk_id: credo-risk-016
  risk_name: Over or under-reliance and unsafe use (Slattery et al., 2024; IBM, 2024;
    AI, 2023)
  risk_description: Users may inappropriately rely on the AI system for critical decisions
    or tasks beyond its capabilities, or fail to put trust in AI systems when they
    should, potentially leading to errors or safety issues.
  consequence: Non-compliance with the directives outlined in the acceptable use policy
    and the execution of tasks using unverified AI outputs.
- risk_id: credo-risk-017
  risk_name: Inadequate AI literacy and communication
  risk_description: The AI system's capabilities, limitations, and appropriate use
    cases may be insufficiently understood or communicated within the organization,
    potentially resulting in ineffective implementation or failure to achieve desired
    outcomes.
  consequence: Ineffective implementation of generative AI tools and the potential
    for employees to find workarounds to existing security blocks.
- risk_id: credo-risk-021
  risk_name: False or misleading information
  risk_description: The AI system may unintentionally generate or amplify false or
    misleading information, potentially leading to public misinformation, erosion
    of trust, and poor decision-making.
  consequence: Employees may make public claims, key business decisions, or implement
    IT instructions based on erroneous information.
- risk_id: credo-risk-023
  risk_name: Regulatory compliance
  risk_description: The AI system may fail to comply with existing or emerging regulations
    and standards, potentially leading to legal penalties,fines, or operational restrictions.
  consequence: The firm may face violations of external terms of use, copyright infringement
    claims, or breaches of open-source software licenses.
- risk_id: credo-risk-024
  risk_name: Civil liability
  risk_description: The AI system may cause harm against individuals or organizations
    that results in civil lawsuits, potentially relating to issues like defamation,
    negligence, or privacy violations.
  consequence: The firm may face legal challenges regarding copyright violations,
    breach of terms of use, or invalidation of proprietary claims over work.
- risk_id: credo-risk-025
  risk_name: Corporate liability (IBM, 2024)
  risk_description: The AI system's use may lead to legal action or penalties against
    corporations for intellectual property infringement, AI-related misconduct, violations
    of fiduciary duty, or failure to adequately oversee AI systems.
  consequence: The unauthorized disclosure of sensitive corporate data or intellectual
    property to third-party AI providers.
- risk_id: credo-risk-026
  risk_name: Fraud, scams, and targeted manipulation
  risk_description: The AI system may be exploited to facilitate fraudulent activities,
    scams, or targeted manipulation, including generating deepfakes and enhancing
    phishing attacks.
  consequence: The execution of fraudulent, destructive, or inappropriate system usage
    through enhanced phishing and social engineering attacks.
- risk_id: credo-risk-027
  risk_name: Cyberattacks, weapon development, and mass harm (AI, 2023; IBM, 2024)
  risk_description: The AI system may be misused for developing malicious software,
    lethal autonomous weapons, or planning large-scale harmful activities.
  consequence: The successful execution of more convincing and personalized social
    engineering attacks or the discovery of exploitable vulnerabilities in software.
- risk_id: credo-risk-029
  risk_name: Mass surveillance and privacy attacks (Slattery et al., 2024)
  risk_description: 'Mass surveillance and privacy attacks: Unauthorized monitoring
    and privacy violation at scale'
  consequence: The collection and oversight of user activities and data under the
    guise of verifying adherence to acceptable use directives.
- risk_id: credo-risk-034
  risk_name: ' Oversight and evaluation challenges'
  risk_description: The AI system may present difficulties in overseeing or evaluating
    its models, potentially introducing performance risks in both predeployment assessments
    and ongoing monitoring.
  consequence: Employees may inadvertently violate open-source licenses or fail to
    provide required attribution for commercial generative AI tools.
- risk_id: credo-risk-036
  risk_name: Compromised personally identifiable information (Slattery et al., 2024)
  risk_description: The AI system may expose personally identifiable information (PII),
    either inadvertently or due to adversarial inputs, derived from training data,
    accessible data, or inferences. PII is any data that can be used to directly identify
    or contact a specific individual, either alone or in combination with other information.
  consequence: The exposure of personally identifiable information or nonpublic personal
    information through the AI system's training data or via a data breach of the
    service provider.
- risk_id: credo-risk-037
  risk_name: Compromised sensitive information (Slattery et al., 2024; IBM, 2024;
    AI, 2023)
  risk_description: The AI system may expose personally sensitive information, either
    inadvertently or due to adversarial inputs, derived from training data, accessible
    data, or inferences. Sensitive personal data is information that, while not necessarily
    identifying an individual, could cause harm, discrimination, or distress to a
    person if exposed, including details about their health, finances, beliefs, behaviors,
    relationships, and private life circumstances.
  consequence: The public exposure of company strategy, intellectual property, or
    regulated personal data.
- risk_id: credo-risk-038
  risk_name: Compromised confidential information (Slattery et al., 2024; IBM, 2024;AI,
    2023)
  risk_description: The AI system, including its supporting compute infrastructure,
    may serve as an attack vector for intrusion into cyber-physical or cloud environments,
    or enable exfiltration of secrets.
  consequence: Unauthorized access to confidential information or the bypass of company
    policies through the AI-integrated workflow.
- risk_id: credo-risk-039
  risk_name: AI model and intellectual property theft
  risk_description: AI model and intellectual property theft - Unauthorized copying
    of trained models and associated AI intellectual property
  consequence: The invalidation of proprietary or copyrighted work and potential legal
    liability for violating the terms of use of external generative AI systems or
    open-source licenses.
- risk_id: credo-risk-048
  risk_name: Upstream third-party dependencies (AI, 2023)
  risk_description: The AI system's reliance on third-party developed models, compute,
    or other resources, may potentially limit operational flexibility and introduce
    unforeseen risks or dependencies.
  consequence: A limitation in operational flexibility and the introduction of unforeseen
    dependencies on external model availability and service terms.
- risk_id: mit-ai-risk-subdomain-1.1
  risk_name: Unfair discrimination and misrepresentation
  risk_description: Unequal treatment of individuals or groups by AI, often based
    on race, gender, or other sensitive characteristics, resulting in unfair outcomes
    and representation of those groups.
  consequence: The implementation of poor, biased, or unethical business decisions
    based on unverified AI-generated content.
- risk_id: mit-ai-risk-subdomain-2.1
  risk_name: Compromise of privacy by obtaining, leaking or correctly inferring sensitive
    information
  risk_description: AI systems that memorize and leak sensitive personal data or infer
    private information about individuals without their consent. Unexpected or unauthorized
    sharing of data and information can compromise user expectation of privacy, assist
    identity theft, or loss of confidential intellectual property.
  consequence: The unauthorized disclosure or leakage of the firm's confidential intellectual
    property and sensitive personal data.
- risk_id: mit-ai-risk-subdomain-2.2
  risk_name: AI system security vulnerabilities and attacks
  risk_description: Vulnerabilities in AI systems, software development toolchains,
    and hardware that can be exploited, resulting in unauthorized access, data and
    privacy breaches, or system manipulation causing unsafe outputs or behavior.
  consequence: Unauthorized exposure of proprietary, copyrighted, or related intellectual
    property, as well as PII or NPI.
- risk_id: mit-ai-risk-subdomain-3.1
  risk_name: False or misleading information
  risk_description: AI systems that inadvertently generate or spread incorrect or
    deceptive information, which can lead to inaccurate beliefs in users and undermine
    their autonomy. Humans that make decisions based on false beliefs can experience
    physical, emotional or material harms
  consequence: The implementation of fraudulent, destructive, inappropriate, or unethical
    business practices and decisions.
- risk_id: mit-ai-risk-subdomain-4.3
  risk_name: Fraud, scams, and targeted manipulation
  risk_description: Using AI systems to gain a personal advantage over others such
    as through cheating, fraud, scams, blackmail or targeted manipulation of beliefs
    or behavior. Examples include AI-facilitated plagiarism for research or education,
    impersonating a trusted or fake individual for illegitimate financial benefit,
    or creating humiliating or sexual imagery.
  consequence: The generation of unethical business practices, decisions, or the circumvention
    of company policies and applicable regulations.
- risk_id: mit-ai-risk-subdomain-5.1
  risk_name: Overreliance and unsafe use
  risk_description: Users anthropomorphizing, trusting, or relying on AI systems,
    leading to emotional or material dependence and inappropriate relationships with
    or expectations of AI systems. Trust can be exploited by malicious actors (e.g.,
    to harvest personal information or enable manipulation), or result in harm from
    inappropriate use of AI in critical situations (e.g., medical emergency). Overreliance
    on AI systems can compromise autonomy and weaken social ties.
  consequence: Users may engage in unsafe use or fail to report infringements on policy
    standards to management.
- risk_id: mit-ai-risk-subdomain-6.3
  risk_name: Economic and cultural devaluation of human effort
  risk_description: AI systems capable of creating economic or cultural value, including
    through reproduction of human innovation or creativity (e.g., art, music, writing,
    code, invention), can destabilize economic and social systems that rely on human
    effort. This may lead to reduced appreciation for human skills, disruption of
    creative and knowledge-based industries, and homogenization of cultural experiences
    due to the ubiquity of AI-generated content.
  consequence: Legal liability for copyright violations, invalidation of proprietary
    claims to work, and potential grievances from employees regarding the authenticity
    of management communications.
- risk_id: mit-ai-risk-subdomain-7.3
  risk_name: Lack of capability or robustness
  risk_description: AI systems that fail to perform reliably or effectively under
    varying conditions, exposing them to errors and failures that can have significant
    consequences, especially in critical applications or areas that require moral
    reasoning.
  consequence: The generation of erroneous outputs, such as flawed software code in
    GitHub Copilot or misleading multimedia content via deepfake tools.
