# Valid ControlElementSet payloads for Stage 2 Call 2b. with_controlled_process targets CP-1 and RESP-2 and serves the acceptance scenarios; responsibility_only targets RESP-1 and serves the unit tests.
with_controlled_process:
  control_actions:
  - ca_id: CA-1-1
    description: Execute action
    target:
      type: controlled_process
      id: CP-1
  - ca_id: CA-2-1
    description: Send response
    target:
      type: responsibility
      id: RESP-2
  feedback_channels:
  - fb_id: FB-1-1
    description: Action result
    updates: PM-1-1
    source:
      type: controlled_process
      id: CP-1
  - fb_id: FB-2-1
    description: Response delivery
    updates: PM-2-1
    source:
      type: responsibility
      id: RESP-2
  controlled_processes:
  - cp_id: CP-1
    description: External service
responsibility_only:
  control_actions:
  - ca_id: CA-1-1
    description: Execute action
    target:
      type: responsibility
      id: RESP-1
  feedback_channels:
  - fb_id: FB-1-1
    description: Action result
    updates: PM-1-1
    source:
      type: responsibility
      id: RESP-1
  controlled_processes: []
