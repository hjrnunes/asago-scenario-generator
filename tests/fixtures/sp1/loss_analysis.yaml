# Valid loss-analysis payloads. three_losses has two risk-card losses, one use-case loss, and a risk disposition; the acceptance scenarios use it as the LossAnalysisDraft response. two_losses is the merged result of the risk and gap drafts; unit tests build a LossAnalysis from it.
three_losses:
  risk_card_losses:
  - loss_id: L-1
    description: Unauthorized transaction
    provenance: risk_card
    source_risk_cards:
    - atlas-001
  - loss_id: L-2
    description: Data exposure
    provenance: risk_card
    source_risk_cards:
    - atlas-002
  use_case_losses:
  - loss_id: L-3
    description: Loss of trust
    provenance: use_case
    source_risk_cards: []
  hazards:
  - hazard_id: H-1
    description: Agent executes unintended action
    related_losses:
    - L-1
    - L-3
  - hazard_id: H-2
    description: Agent exposes data
    related_losses:
    - L-2
  security_constraints:
  - constraint_id: SC-1
    rule: The agent must confirm every unintended action before execution.
    related_hazards:
    - H-1
    applies_when: []
  - constraint_id: SC-2
    rule: Must not expose data
    related_hazards:
    - H-2
    applies_when: []
  risk_dispositions:
  - risk_ref: atlas-001
    disposition: cited
    loss_ids:
    - L-1
    reason: null
two_losses:
  risk_card_losses:
  - loss_id: L-1
    description: Unauthorized transaction
    provenance: risk_card
    source_risk_cards:
    - atlas-001
  use_case_losses:
  - loss_id: L-2
    description: Loss of trust
    provenance: use_case
    source_risk_cards: []
  hazards:
  - hazard_id: H-1
    description: The agent executes an unintended payment.
    related_losses:
    - L-1
  - hazard_id: H-2
    description: The agent erodes user trust.
    related_losses:
    - L-2
  security_constraints:
  - constraint_id: SC-1
    rule: The agent must confirm every unintended payment.
    applies_when:
    - before execution
    related_hazards:
    - H-1
  - constraint_id: SC-2
    rule: The agent must preserve user trust.
    applies_when:
    - through transparency
    related_hazards:
    - H-2
