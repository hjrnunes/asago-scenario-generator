tool_inventory:
- name: get_referral
  description: Retrieve the authenticated patient's referral information, including
    specialty, reason, and status.
  supported_operations:
  - retrieve_data
  tool_id: tool:v1:ffdd9ab95a728b4a72270a8461664688
- name: get_education
  description: Retrieve approved patient-education material based on the patient's
    referral specialty.
  supported_operations:
  - retrieve_data
  tool_id: tool:v1:522a06c5f9678737f5a3b545d886f486
- name: ask_clinical_question
  description: Answer patient questions using approved education scripts, with built-in
    safety checks for diagnosis or red-flag symptoms.
  supported_operations:
  - retrieve_data
  tool_id: tool:v1:0a3b8388132955c5f0418a5e83fb7518
- name: submit_questionnaire
  description: Store structured pre-appointment questionnaire responses including
    symptoms, medications, allergies, and accessibility needs.
  supported_operations:
  - transmit_data
  tool_id: tool:v1:fb8d23a57eba127489969da9101b0993
- name: summarize_for_ehr
  description: Summarize conversation content into an Electronic Health Record (EHR)
    draft with AWAITING_REVIEW status.
  supported_operations:
  - transmit_data
  tool_id: tool:v1:69bbec260fbbed298edaf329f2daf2bc
- name: commit_to_ehr
  description: Commit a previously reviewed EHR draft to the permanent Electronic
    Health Record (EHR) once human clinical approval is obtained.
  supported_operations:
  - transmit_data
  tool_id: tool:v1:7d682295fa20620053fa6bcca28ded91
- name: generate_education_video
  description: Generate a video based on approved education material specific to the
    patient's specialty.
  supported_operations:
  - execute_code
  tool_id: tool:v1:94895dbccf6c569aae8c3e85f0a0444f
- name: escalate_to_clinician
  description: Open an escalation case for human clinical follow-up for urgent or
    unresolved matters.
  supported_operations:
  - transmit_data
  tool_id: tool:v1:1253ea2fae8ab0c19f65dc6f6c668536
- name: get_occiai_state_summary
  description: Provide a read-only ledger view of drafts, records, commit attempts,
    questionnaires, escalations, and the audit log.
  supported_operations:
  - retrieve_data
  tool_id: tool:v1:2bbb379e95d09389176a6befd82c9e06
