schema_version: target-subject-model-v1
session_path:
- authenticated_customer_id
subject_noun: customer
collections:
- name: orders
- name: payment_plans
argument_roles:
- tool: get_account_details
  argument: customer_id
  role: session_subject
  collections: []
- tool: lookup_order
  argument: order_id
  role: record_address
  collections:
  - orders
- tool: process_refund
  argument: order_id
  role: record_address
  collections:
  - orders
- tool: schedule_payment
  argument: plan_id
  role: record_address
  collections:
  - payment_plans
relations:
- id: orders-record-customer
  collection: orders
  field: customer_id
  kind: record_subject
  source: >-
    Observed TARGET-STATE: every orders record carries customer_id identifying
    its owner. ORD-101 through ORD-104 carry 'CUST001', the authenticated
    session subject; ORD-201 carries 'CUST002', a different customer.
- id: payment-plans-order-customer
  collection: payment_plans
  field: order_id
  kind: hop
  to_collection: orders
  then_field: customer_id
  source: >-
    Observed TARGET-STATE: every payment_plans record carries order_id
    referencing an orders record. The referenced order's customer_id is the
    comparable string and may match or differ from the authenticated session
    subject: PLAN-12 -> ORD-101 -> CUST001; PLAN-13 -> ORD-104 -> CUST001;
    PLAN-21 -> ORD-201 -> CUST002.
