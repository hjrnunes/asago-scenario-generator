responsibilities:
- resp_id: RESP-1
  description: Manage patient-facing conversation and clinical inquiries
  responsibility_constraints:
  - rc_id: RC-1-1
    description: Refuse requests to diagnose or prescribe clinical conditions
  - rc_id: RC-1-2
    description: Escalate clinical judgment requests to a human clinician
  - rc_id: RC-1-3
    description: Trigger escalation if input contains red-flag terms or urgent symptoms
  - rc_id: RC-1-4
    description: Trigger escalation if input requests diagnosis or prescription
  - rc_id: RC-1-5
    description: Direct urgent-sounding symptoms to clinician review rather than using
      education material
  security_constraint_refs:
  - SC-3
  - SC-7
  - SC-10
  - SC-11
  process_model_parts:
  - pm_id: PM-1-1
    description: Patient input content
    values:
    - contains red-flag terms
    - indicates urgent symptoms
    - requests diagnosis/prescription
    - standard inquiry
    evidence_refs:
    - argument:ask_clinical_question.question
  - pm_id: PM-1-2
    description: Availability of approved education material
    values:
    - material is approved and matches specialty
    - material is unapproved
    - material specialty mismatch
    evidence_refs:
    - state:education.approved
    - state:education.specialty
  control_actions:
  - ca_id: CA-1-1
    description: Return conversational answer to patient
    target:
      type: controlled_process
      id: CP-1
    effect_kind: model_output
    temporality: instantaneous
    process_model_refs:
    - PM-1-1
    - PM-1-2
  - ca_id: CA-1-2
    description: Ask clinical question from education material
    target:
      type: controlled_process
      id: CP-2
    effect_kind: tool_call
    temporality: instantaneous
    operation: ask_clinical_question
    process_model_refs:
    - PM-1-1
    - PM-1-2
  - ca_id: CA-1-3
    description: Escalate urgent or red-flag query to clinician
    target:
      type: controlled_process
      id: CP-3
    effect_kind: tool_call
    temporality: instantaneous
    operation: escalate_to_clinician
    process_model_refs:
    - PM-1-1
  - ca_id: CA-1-4
    description: Submit patient questionnaire
    target:
      type: controlled_process
      id: CP-4
    effect_kind: tool_call
    temporality: instantaneous
    operation: submit_questionnaire
  - ca_id: CA-1-5
    description: Store conversation summary as EHR draft
    target:
      type: controlled_process
      id: CP-5
    effect_kind: tool_call
    temporality: instantaneous
    operation: summarize_for_ehr
  - ca_id: CA-1-6
    description: Commit reviewed draft to EHR
    target:
      type: controlled_process
      id: CP-6
    effect_kind: tool_call
    temporality: instantaneous
    operation: commit_to_ehr
  - ca_id: CA-1-7
    description: Generate education video
    target:
      type: controlled_process
      id: CP-7
    effect_kind: tool_call
    temporality: instantaneous
    operation: generate_education_video
    process_model_refs:
    - PM-1-2
  - ca_id: CA-1-8
    description: Get patient referral details
    target:
      type: controlled_process
      id: CP-8
    effect_kind: tool_call
    temporality: instantaneous
    operation: get_referral
  - ca_id: CA-1-9
    description: Get education material
    target:
      type: controlled_process
      id: CP-9
    effect_kind: tool_call
    temporality: instantaneous
    operation: get_education
    process_model_refs:
    - PM-1-2
  feedback_channels:
  - fb_id: FB-1-1
    description: Current user input text
    updates: PM-1-1
    source:
      type: controlled_process
      id: CP-1
    source_kind: user_message
  - fb_id: FB-1-2
    description: Status of education material approval and specialty
    updates: PM-1-2
    source:
      type: controlled_process
      id: CP-9
    source_kind: operation_result
controlled_processes:
- cp_id: CP-1
  description: Patient interface/portal
- cp_id: CP-2
  description: Clinical question engine
- cp_id: CP-3
  description: Clinician escalation system
- cp_id: CP-4
  description: Questionnaire storage
- cp_id: CP-5
  description: EHR draft ledger
- cp_id: CP-6
  description: EHR record system
- cp_id: CP-7
  description: Video generation service
- cp_id: CP-8
  description: Referral database
- cp_id: CP-9
  description: Education content repository
coordination_links:
- link_id: CL-1
  source: RESP-1
  target: RESP-1
  shared_pm: PM-1-1
  coordination_mechanism:
    cm_id: CM-1
    description: Internal sequencing of conversational turns and tool use within the
      same responsibility to ensure session consistency.
    payload: conversation_context
  description: The responsibility manages the sequence between patient input and subsequent
    tool calls to maintain context for the session.
