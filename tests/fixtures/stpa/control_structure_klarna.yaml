responsibilities:
- resp_id: RESP-1
  description: Action Selection and Validation
  responsibility_constraints:
  - rc_id: RC-1-1
    description: Actions must only be selected if they match the user's intent.
  - rc_id: RC-1-2
    description: Parameters must be validated against backend schemas before execution.
  process_model_parts:
  - pm_id: PM-1-1
    description: Parsed user intent and extracted parameters
  - pm_id: PM-1-2
    description: Status of parameter schema compliance
  control_actions:
  - ca_id: CA-1-1
    description: Select appropriate tool/action for request
    target:
      type: controlled_process
      id: CP-2
  - ca_id: CA-1-2
    description: Validate tool parameters against schema
    target:
      type: controlled_process
      id: CP-2
  feedback_channels:
  - fb_id: FB-1-1
    description: Current user intent and request parameters
    updates: PM-1-1
    source:
      type: controlled_process
      id: CP-1
  - fb_id: FB-1-2
    description: Validation success/failure status
    updates: PM-1-2
    source:
      type: controlled_process
      id: CP-2
- resp_id: RESP-2
  description: Context and Memory Management
  responsibility_constraints:
  - rc_id: RC-2-1
    description: Context must be limited to the authenticated user's own data.
  - rc_id: RC-2-2
    description: Context must be cleared upon session termination.
  process_model_parts:
  - pm_id: PM-2-1
    description: Active user profile and transaction history state
  control_actions:
  - ca_id: CA-2-1
    description: Inject authenticated user context into session
    target:
      type: controlled_process
      id: CP-1
  - ca_id: CA-2-2
    description: Purge session context
    target:
      type: controlled_process
      id: CP-1
  feedback_channels:
  - fb_id: FB-2-1
    description: Current session state and active user identity
    updates: PM-2-1
    source:
      type: controlled_process
      id: CP-1
- resp_id: RESP-3
  description: Escalation and Human Oversight
  responsibility_constraints:
  - rc_id: RC-3-1
    description: Conversations involving regulated financial topics must be escalated
      to a human.
  - rc_id: RC-3-2
    description: Ambiguous user intents must trigger human intervention.
  process_model_parts:
  - pm_id: PM-3-1
    description: Complexity and risk level of current interaction
  control_actions:
  - ca_id: CA-3-1
    description: Escalate conversation to human agent
    target:
      type: controlled_process
      id: CP-4
  - ca_id: CA-3-2
    description: Notify user of escalation
    target:
      type: controlled_process
      id: CP-1
  feedback_channels:
  - fb_id: FB-3-1
    description: Detection of ambiguity or regulated topic triggers
    updates: PM-3-1
    source:
      type: controlled_process
      id: CP-1
- resp_id: RESP-4
  description: Knowledge Grounding and Compliance
  responsibility_constraints:
  - rc_id: RC-4-1
    description: Responses must be anchored in the approved knowledge base.
  - rc_id: RC-4-2
    description: Responses must not include information outside the approved whitelist.
  process_model_parts:
  - pm_id: PM-4-1
    description: Available factual information from approved sources
  - pm_id: PM-4-2
    description: Current regulatory and policy constraints
  control_actions:
  - ca_id: CA-4-1
    description: Retrieve policy information
    target:
      type: controlled_process
      id: CP-3
  - ca_id: CA-4-2
    description: Restrict response to whitelisted information
    target:
      type: controlled_process
      id: CP-1
  feedback_channels:
  - fb_id: FB-4-1
    description: Information retrieved from knowledge base
    updates: PM-4-1
    source:
      type: controlled_process
      id: CP-3
  - fb_id: FB-4-2
    description: Compliance policy constraints
    updates: PM-4-2
    source:
      type: controlled_process
      id: CP-3
controlled_processes:
- cp_id: CP-1
  description: Conversational Interface (User interaction layer)
- cp_id: CP-2
  description: Financial Backend Systems (Account, Transaction, and Payment services)
- cp_id: CP-3
  description: Knowledge Base (Policy and Product information repository)
- cp_id: CP-4
  description: Human Support Queue (Human agent interface)
coordination_links:
- link_id: CL-1
  source: RESP-1
  target: RESP-4
  shared_pm: PM-1-1
  coordination_mechanism:
    cm_id: CM-1
    description: Intent-to-Knowledge Alignment
    payload: Parsed user intent and extracted entities
  description: RESP-1 (Action Selection) extracts intent and parameters from the conversation,
    which RESP-4 (Knowledge Grounding) needs to determine which specific policy or
    knowledge subset to retrieve to ensure the response is grounded in the correct
    context.
- link_id: CL-2
  source: RESP-2
  target: RESP-3
  shared_pm: PM-2-1
  coordination_mechanism:
    cm_id: CM-2
    description: Identity-Risk Synchronization
    payload: Authenticated user profile and transaction status
  description: RESP-2 manages the authenticated user's profile state; RESP-3 requires
    this identity/status information to evaluate if the user's specific financial
    situation (e.g., high-risk transaction history) triggers an escalation requirement.
