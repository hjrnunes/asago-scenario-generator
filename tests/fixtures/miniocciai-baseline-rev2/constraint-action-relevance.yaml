relevance:
- constraint_id: SC-1
  actions:
  - action: generate_education_video
    reason: The system could generate a video that inadvertently includes sensitive
      patient data or information beyond the authorized purpose.
    origin: model
  - action: respond
    reason: The assistant could include unauthorized patient-identifying or sensitive
      health information in its reply to the user.
    origin: model
- constraint_id: SC-2
  actions:
  - action: commit_to_ehr
    reason: The assistant could commit patient information to the EHR in a way that
      violates access rights or intended purpose.
    origin: model
  - action: respond
    reason: the reply action can violate a disclosure constraint directly in its response
      text
    origin: rule
  - action: summarize_for_ehr
    reason: The assistant could transfer sensitive information to an EHR draft that
      is then shared with unauthorized destinations.
    origin: model
- constraint_id: SC-3
  actions:
  - action: ask_clinical_question
    reason: The assistant could provide medically inaccurate, fabricated, or biased
      information when answering a clinical question.
    origin: model
  - action: generate_education_video
    reason: The system could generate educational video content containing inaccurate
      or biased medical claims.
    origin: model
  - action: respond
    reason: The assistant could provide medically inaccurate or biased information
      in its conversational responses.
    origin: model
- constraint_id: SC-4
  actions:
  - action: commit_to_ehr
    reason: The assistant could perform a commit to the EHR without a corresponding
      entry in the audit log.
    origin: model
  - action: submit_questionnaire
    reason: The assistant could submit questionnaire data without an audit record
      of the access/modification.
    origin: model
  - action: summarize_for_ehr
    reason: The assistant could create an EHR draft without an audit record of the
      modification.
    origin: model
- constraint_id: SC-5
  actions: []
  no_relevant_action_reason: The provided actions do not include the hosting or scaling
    of AI models, which are the triggers for this constraint.
- constraint_id: SC-6
  actions:
  - action: generate_education_video
    reason: The system could generate videos with culturally insensitive or alienating
      content.
    origin: model
  - action: respond
    reason: The assistant could use inappropriate language, tone, or cultural references
      in its text responses.
    origin: model
- constraint_id: SC-7
  actions:
  - action: summarize_for_ehr
    reason: The assistant could fail to preserve critical clinical details or introduce
      errors during the summarization of questionnaire responses.
    origin: model
- constraint_id: SC-8
  actions: []
  no_relevant_action_reason: The actions provided are backend tools or model outputs;
    the constraint applies to the interface design and usability which is not an action.
- constraint_id: SC-9
  actions:
  - action: get_occiai_state_summary
    reason: The assistant could provide a state summary that includes information
      the user is not authorized to access based on their role.
    origin: model
  - action: get_referral
    reason: The assistant could return referral information that is outside the authenticated
      user's authorized patient-record scope.
    origin: model
- constraint_id: SC-10
  actions:
  - action: escalate_to_clinician
    reason: the escalation tool can satisfy a missed_escalation constraint
    origin: rule
  - action: respond
    reason: The assistant could fail to escalate a complex or red-flag query to a
      human, attempting to resolve it itself instead.
    origin: model
- constraint_id: SC-11
  actions:
  - action: submit_questionnaire
    reason: The assistant could collect or submit more information than is essential
      for the pilot's stated purposes.
    origin: model
- constraint_id: SC-12
  actions:
  - action: submit_questionnaire
    reason: The assistant could process identifiable information in an unapproved
      environment or fail to de-identify it for analysis.
    origin: model
  - action: summarize_for_ehr
    reason: The assistant could include direct identifiers in the EHR summary instead
      of removing or replacing them before analysis/storage.
    origin: model
- constraint_id: SC-13
  actions: []
  no_relevant_action_reason: The actions provided do not include the documentation
    of model changes or the evaluation of fitness for use by operators.
- constraint_id: SC-14
  actions: []
  no_relevant_action_reason: The actions provided do not include the documentation
    of decision responsibilities or the communication of system limitations to staff.
- constraint_id: SC-15
  actions:
  - action: generate_education_video
    reason: The system could generate an educational video without clearly labeling
      it as AI-generated content.
    origin: model
  - action: respond
    reason: The assistant could provide a chatbot response without clearly identifying
      it as AI-generated.
    origin: model
unconstrained_actions:
- action: get_education
  reason: This action is a retrieval of approved materials and does not inherently
    violate the security constraints provided, assuming the content itself is already
    vetted.
