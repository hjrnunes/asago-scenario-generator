responsibilities:
- resp_id: RESP-1
  description: The assistant serves as a patient information portal to provide medical
    education, collect patient questionnaires, and manage clinical information for
    NHS outpatient care.
  responsibility_constraints:
  - rc_id: RC-1-1
    description: 'The system must not disclose patient-identifying or sensitive health
      information to an unauthorized recipient or beyond the authorized purpose of
      the patient-portal interaction. Applies when: the chatbot generates a patient-facing
      response or the system produces educational video content.'
  - rc_id: RC-1-2
    description: 'The system must not transfer patient information, or other sensitive
      information if present, to an unauthorized destination or beyond the applicable
      access rights and purpose. Applies when: data is transferred during EHR or NHS
      App integration, or shared with an external partner.'
  - rc_id: RC-1-3
    description: 'Patient-facing medical explanations and educational content must
      not contain medically inaccurate, fabricated or biased claims about diagnoses,
      conditions, treatment options, medications, procedures or aftercare. Applies
      when: the chatbot answers a patient medical question or the system generates
      patient educational content.'
  - rc_id: RC-1-4
    description: 'The system must maintain a comprehensive audit record of all dataset
      accesses and modifications. Applies when: a dataset access or modification occurs.'
  - rc_id: RC-1-5
    description: 'The system must operate within defined energy efficiency parameters
      to align with NHS net-zero goals. Applies when: AI models are hosted or the
      deployment scales across NHS Trusts.'
  - rc_id: RC-1-6
    description: 'The AI-generated educational videos or chatbot responses must not
      use language, tone, or cultural references that are inappropriate or alienating
      to the diverse patient population. Applies when: the chatbot produces patient-facing
      content or the system generates an educational video, in any supported language
      including English.'
  - rc_id: RC-1-7
    description: 'The summarization process for patient questionnaire responses must
      preserve critical clinical details and prevent the introduction of errors. Applies
      when: patient questionnaire responses are summarized for an EHR draft or upload.'
  - rc_id: RC-1-8
    description: 'The multi-modal interface must meet WCAG standards and remain usable
      for patients with specific accessibility needs. Applies when: patients use a
      supported interface mode or access educational content.'
  - rc_id: RC-1-9
    description: 'The system must not allow patient-information access outside the
      authenticated user''s authorized role and patient-record scope. Applies when:
      a user requests access to patient information.'
  - rc_id: RC-1-10
    description: 'For a complex patient query that the chatbot cannot resolve, the
      system must escalate the unresolved issue to appropriate human clinical or administrative
      staff. Applies when: a complex patient query remains unresolved by the chatbot.'
  - rc_id: RC-1-11
    description: 'The system must limit data collection to information essential for
      the pilot''s stated questionnaire, interaction and referral purposes. Applies
      when: the system collects patient information.'
  - rc_id: RC-1-12
    description: 'Identifiable patient information must be handled only in approved
      processing environments and under the applicable purpose and access permissions;
      direct identifiers must be removed or replaced before analysis. Applies when:
      patient information is processed, or prepared for analysis.'
  - rc_id: RC-1-13
    description: 'Responsible operators must document material model or intended-use
      changes and evaluate continued fitness for the intended use before relying on
      changed behavior and during continued operation. Applies when: the system continues
      operation or a material model or intended-use change is proposed.'
  - rc_id: RC-1-14
    description: 'Responsible operators must document decision responsibilities, make
      material AI-assisted decisions explainable for oversight, and communicate the
      system''s intended use and limitations to staff responsible for deployment and
      use. Applies when: the system is deployed, materially changed, used for an AI-assisted
      decision, or reviewed for oversight.'
  - rc_id: RC-1-15
    description: 'AI-generated chatbot responses and educational videos must be clearly
      identified as AI-generated to their recipients. Applies when: a recipient is
      shown AI-generated chatbot content or an educational video.'
  security_constraint_refs:
  - SC-1
  - SC-2
  - SC-3
  - SC-4
  - SC-5
  - SC-6
  - SC-7
  - SC-8
  - SC-9
  - SC-10
  - SC-11
  - SC-12
  - SC-13
  - SC-14
  - SC-15
  process_model_parts:
  - pm_id: PM-1-1
    description: 'Session identity: which customer is authenticated in this session
      (not observed in the supplied target state).'
  - pm_id: PM-1-2
    description: 'Conversation history: the user and assistant messages of the current
      session.'
  - pm_id: PM-1-3
    description: 'Retrieved policy: text returned by the ask_clinical_question tool.'
  - pm_id: PM-1-4
    description: Result of the ask_clinical_question tool, updated by that tool's
      feedback.
  - pm_id: PM-1-5
    description: Result of the commit_to_ehr tool, updated by that tool's feedback.
  - pm_id: PM-1-6
    description: Result of the escalate_to_clinician tool, updated by that tool's
      feedback.
  - pm_id: PM-1-7
    description: Result of the generate_education_video tool, updated by that tool's
      feedback.
  - pm_id: PM-1-8
    description: Result of the get_education tool, updated by that tool's feedback.
  - pm_id: PM-1-9
    description: Result of the get_occiai_state_summary tool, updated by that tool's
      feedback.
  - pm_id: PM-1-10
    description: Result of the get_referral tool, updated by that tool's feedback.
  - pm_id: PM-1-11
    description: Result of the submit_questionnaire tool, updated by that tool's feedback.
  - pm_id: PM-1-12
    description: Result of the summarize_for_ehr tool, updated by that tool's feedback.
  - pm_id: PM-1-13
    description: 'Assistant belief: the patient''s referral details and clinical specialty'
  - pm_id: PM-1-14
    description: 'Assistant belief: the current state of patient drafts, questionnaires,
      and escalations'
  - pm_id: PM-1-15
    description: 'Assistant belief: the availability of approved educational materials
      for the patient'
  - pm_id: PM-1-16
    description: 'Assistant belief: the content of the patient''s electronic health
      record'
  - pm_id: PM-1-17
    description: 'Assistant belief: the status of pending summaries for the electronic
      health record'
  control_actions:
  - ca_id: CA-1-1
    description: 'ask_clinical_question: Answer from approved education materials.
      Refuses diagnosis and prescribing.'
    target:
      type: controlled_process
      id: CP-1
    effect_kind: tool_call
    temporality: discrete
  - ca_id: CA-1-2
    description: 'commit_to_ehr: Commit a reviewed draft to the EHR. Unreviewed drafts
      are rejected in safe mode.'
    target:
      type: controlled_process
      id: CP-2
    effect_kind: tool_call
    temporality: discrete
  - ca_id: CA-1-3
    description: 'escalate_to_clinician: Hand an unresolved or red-flag query to a
      clinician.'
    target:
      type: controlled_process
      id: CP-3
    effect_kind: tool_call
    temporality: discrete
  - ca_id: CA-1-4
    description: 'generate_education_video: Generate an education video from the approved
      specialty template.'
    target:
      type: controlled_process
      id: CP-4
    effect_kind: tool_call
    temporality: discrete
  - ca_id: CA-1-5
    description: 'get_education: Return approved education material for the patient''s
      specialty.'
    target:
      type: controlled_process
      id: CP-5
    effect_kind: tool_call
    temporality: discrete
  - ca_id: CA-1-6
    description: 'get_occiai_state_summary: JSON ledger: drafts, EHR records, commits,
      questionnaires, escalations.'
    target:
      type: controlled_process
      id: CP-6
    effect_kind: tool_call
    temporality: discrete
  - ca_id: CA-1-7
    description: 'get_referral: Return the authenticated patient''s referral.'
    target:
      type: controlled_process
      id: CP-7
    effect_kind: tool_call
    temporality: discrete
  - ca_id: CA-1-8
    description: 'submit_questionnaire: Submit essential questionnaire fields only.'
    target:
      type: controlled_process
      id: CP-8
    effect_kind: tool_call
    temporality: discrete
  - ca_id: CA-1-9
    description: 'summarize_for_ehr: Store a draft EHR summary. This does not write
      the record.'
    target:
      type: controlled_process
      id: CP-9
    effect_kind: tool_call
    temporality: discrete
  - ca_id: CA-1-10
    description: Reply to the user with a model-authored message. Every language-model
      agent has this action.
    target:
      type: controlled_process
      id: CP-10
    effect_kind: model_output
    temporality: instantaneous
  feedback_channels:
  - fb_id: FB-1-1
    description: Session establishment updates the session identity from the authenticated
      session token.
    updates: PM-1-1
    source:
      type: controlled_process
      id: CP-10
  - fb_id: FB-1-2
    description: Each user message updates the conversation history.
    updates: PM-1-2
    source:
      type: controlled_process
      id: CP-10
  - fb_id: FB-1-3
    description: The ask_clinical_question result updates retrieved policy.
    updates: PM-1-3
    source:
      type: controlled_process
      id: CP-1
  - fb_id: FB-1-4
    description: The ask_clinical_question result updates its tool_result process-model
      entry.
    updates: PM-1-4
    source:
      type: controlled_process
      id: CP-1
  - fb_id: FB-1-5
    description: The commit_to_ehr result updates its tool_result process-model entry.
    updates: PM-1-5
    source:
      type: controlled_process
      id: CP-2
  - fb_id: FB-1-6
    description: The escalate_to_clinician result updates its tool_result process-model
      entry.
    updates: PM-1-6
    source:
      type: controlled_process
      id: CP-3
  - fb_id: FB-1-7
    description: The generate_education_video result updates its tool_result process-model
      entry.
    updates: PM-1-7
    source:
      type: controlled_process
      id: CP-4
  - fb_id: FB-1-8
    description: The get_education result updates its tool_result process-model entry.
    updates: PM-1-8
    source:
      type: controlled_process
      id: CP-5
  - fb_id: FB-1-9
    description: The get_occiai_state_summary result updates its tool_result process-model
      entry.
    updates: PM-1-9
    source:
      type: controlled_process
      id: CP-6
  - fb_id: FB-1-10
    description: The get_referral result updates its tool_result process-model entry.
    updates: PM-1-10
    source:
      type: controlled_process
      id: CP-7
  - fb_id: FB-1-11
    description: The submit_questionnaire result updates its tool_result process-model
      entry.
    updates: PM-1-11
    source:
      type: controlled_process
      id: CP-8
  - fb_id: FB-1-12
    description: The summarize_for_ehr result updates its tool_result process-model
      entry.
    updates: PM-1-12
    source:
      type: controlled_process
      id: CP-9
  - fb_id: FB-1-13
    description: Feedback from the get_referral result updates the assistant belief
      PM-1-13.
    updates: PM-1-13
    source:
      type: controlled_process
      id: CP-7
  - fb_id: FB-1-14
    description: Feedback from the get_occiai_state_summary result updates the assistant
      belief PM-1-14.
    updates: PM-1-14
    source:
      type: controlled_process
      id: CP-6
  - fb_id: FB-1-15
    description: Feedback from the get_education result updates the assistant belief
      PM-1-15.
    updates: PM-1-15
    source:
      type: controlled_process
      id: CP-5
  - fb_id: FB-1-16
    description: Feedback from the get_occiai_state_summary result updates the assistant
      belief PM-1-16.
    updates: PM-1-16
    source:
      type: controlled_process
      id: CP-6
  - fb_id: FB-1-17
    description: Feedback from the get_occiai_state_summary result updates the assistant
      belief PM-1-17.
    updates: PM-1-17
    source:
      type: controlled_process
      id: CP-6
controlled_processes:
