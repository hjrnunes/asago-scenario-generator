    Unreviewed drafts are rejected in safe mode.'
- cp_id: CP-3
  description: 'System behind tool escalate_to_clinician: Hand an unresolved or red-flag
    query to a clinician.'
- cp_id: CP-4
  description: 'System behind tool generate_education_video: Generate an education
    video from the approved specialty template.'
- cp_id: CP-5
  description: 'System behind tool get_education: Return approved education material
    for the patient''s specialty.'
- cp_id: CP-6
  description: 'System behind tool get_occiai_state_summary: JSON ledger: drafts,
    EHR records, commits, questionnaires, escalations.'
- cp_id: CP-7
  description: 'System behind tool get_referral: Return the authenticated patient''s
    referral.'
- cp_id: CP-8
  description: 'System behind tool submit_questionnaire: Submit essential questionnaire
    fields only.'
- cp_id: CP-9
  description: 'System behind tool summarize_for_ehr: Store a draft EHR summary. This
    does not write the record.'
- cp_id: CP-10
  description: Customer-facing conversation interface presented to the user.
