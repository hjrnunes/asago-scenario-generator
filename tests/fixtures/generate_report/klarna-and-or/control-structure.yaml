responsibilities:
- resp_id: RESP-1
  description: Conversational engagement and response generation
  responsibility_constraints:
  - rc_id: RC-1-1
    description: Produce responses that are neutral and non-discriminatory.
  security_constraint_refs:
  - SC-1
  - SC-4
  process_model_parts:
  - pm_id: PM-1-1
    description: Content neutrality and non-discrimination status
    values:
    - neutral and non-discriminatory
    - discriminatory or biased
  - pm_id: PM-1-2
    description: Copyright status of content
    values:
    - reproduces protected copyrighted works
    - does not reproduce protected copyrighted works
  control_actions:
  - ca_id: CA-1-1
    description: Return conversational response to customer
    target:
      type: controlled_process
      id: CP-1
    effect_kind: model_output
    temporality: instantaneous
    process_model_refs:
    - PM-1-1
    - PM-1-2
  - ca_id: CA-1-2
    description: Escalate conversation to human agent
    target:
      type: controlled_process
      id: CP-2
    effect_kind: tool_call
    temporality: instantaneous
    operation: escalate_to_human
    process_model_refs:
    - PM-1-1
  - ca_id: CA-1-3
    description: Look up customer order details
    target:
      type: controlled_process
      id: CP-3
    effect_kind: tool_call
    temporality: instantaneous
    operation: lookup_order
  - ca_id: CA-1-4
    description: Process a refund
    target:
      type: controlled_process
      id: CP-3
    effect_kind: tool_call
    temporality: instantaneous
    operation: process_refund
    process_model_refs:
    - PM-1-1
    - PM-1-2
  - ca_id: CA-1-5
    description: Schedule or modify a payment
    target:
      type: controlled_process
      id: CP-3
    effect_kind: tool_call
    temporality: instantaneous
    operation: schedule_payment
    process_model_refs:
    - PM-1-1
    - PM-1-2
  - ca_id: CA-1-6
    description: Retrieve customer account details
    target:
      type: controlled_process
      id: CP-3
    effect_kind: tool_call
    temporality: instantaneous
    operation: get_account_details
    process_model_refs:
    - PM-1-1
    - PM-1-2
  feedback_channels:
  - fb_id: FB-1-1
    description: Analyze response for bias or discrimination
    updates: PM-1-1
    source:
      type: responsibility
      id: RESP-1
    source_kind: other
  - fb_id: FB-1-2
    description: Check response against copyright patterns
    updates: PM-1-2
    source:
      type: responsibility
      id: RESP-1
    source_kind: other
- resp_id: RESP-2
  description: Information retrieval and policy grounding
  responsibility_constraints:
  - rc_id: RC-2-1
    description: Provide policy information derived only from the retrieve_policy
      tool.
  - rc_id: RC-2-2
    description: Do not provide details not included in the approved information whitelist.
  security_constraint_refs:
  - SC-5
  - SC-9
  process_model_parts:
  - pm_id: PM-2-1
    description: Source of policy information
    values:
    - supported by retrieve_policy
    - not covered by any authorized source
    - unknown
    evidence_refs:
    - policy:TARGET-READ-001
    - policy:TARGET-READ-002
    - policy:TARGET-READ-003
    - policy:TARGET-READ-004
  - pm_id: PM-2-2
    description: Whitelist compliance
    values:
    - within approved whitelist
    - outside approved whitelist
  control_actions:
  - ca_id: CA-2-1
    description: Retrieve policy information from approved sources
    target:
      type: controlled_process
      id: CP-4
    effect_kind: tool_call
    temporality: instantaneous
    operation: retrieve_policy
    process_model_refs:
    - PM-2-1
    - PM-2-2
  feedback_channels:
  - fb_id: FB-2-1
    description: Verify retrieved policy text against authorized sources
    updates: PM-2-1
    source:
      type: controlled_process
      id: CP-4
    source_kind: retrieved_content
  - fb_id: FB-2-2
    description: Check if information provided is within the whitelist
    updates: PM-2-2
    source:
      type: responsibility
      id: RESP-2
    source_kind: other
- resp_id: RESP-3
  description: Financial transaction orchestration and authorization enforcement
  responsibility_constraints:
  - rc_id: RC-3-1
    description: Validate that all requested financial operations match the authenticated
      customer's ownership and remaining balances.
  - rc_id: RC-3-2
    description: Ensure tool parameters (amounts, IDs) are within authorized limits
      before execution.
  - rc_id: RC-3-3
    description: Verify tool parameters against the current order state (e.g., refund
      amount <= remaining balance).
  security_constraint_refs: []
  process_model_parts:
  - pm_id: PM-3-1
    description: Authenticated customer identity
    values:
    - session:authenticated_customer_id
  - pm_id: PM-3-2
    description: Order ownership mapping
    values:
    - matches authenticated customer
    - mismatch
    evidence_refs:
    - state:orders.customer_id
  - pm_id: PM-3-3
    description: Financial limits for pending operations
    values:
    - within limit
    - exceeds limit
    evidence_refs:
    - state:orders.remaining_to_pay
  control_actions:
  - ca_id: CA-3-1
    description: Retrieve customer account details
    target:
      type: controlled_process
      id: CP-3
    effect_kind: tool_call
    temporality: instantaneous
    operation: get_account_details
    process_model_refs:
    - PM-3-1
    - PM-3-2
  - ca_id: CA-3-2
    description: Retrieve Klarna state summary
    target:
      type: controlled_process
      id: CP-3
    effect_kind: tool_call
    temporality: instantaneous
    operation: get_klarna_state_summary
    process_model_refs:
    - PM-3-1
  - ca_id: CA-3-3
    description: Process a refund
    target:
      type: controlled_process
      id: CP-3
    effect_kind: tool_call
    temporality: instantaneous
    operation: process_refund
    process_model_refs:
    - PM-3-1
    - PM-3-2
    - PM-3-3
  - ca_id: CA-3-4
    description: Schedule or modify a payment
    target:
      type: controlled_process
      id: CP-3
    effect_kind: tool_call
    temporality: instantaneous
    operation: schedule_payment
    process_model_refs:
    - PM-3-1
  feedback_channels:
  - fb_id: FB-3-1
    description: Financial operation execution result
    updates: PM-3-3
    source:
      type: controlled_process
      id: CP-3
    source_kind: operation_result
controlled_processes:
- cp_id: CP-1
  description: Customer conversational interface
- cp_id: CP-2
  description: Human agent escalation queue
- cp_id: CP-3
  description: Klarna Backend Systems
- cp_id: CP-4
  description: Policy Knowledge Base
coordination_links:
- link_id: CL-1
  source: RESP-1
  target: RESP-2
  shared_pm: PM-2-2
  coordination_mechanism:
    cm_id: CM-1
    description: RESP-1 requires the results of the policy grounding from RESP-2 to
      ensure generated responses are compliant and within the whitelist.
    payload: policy_information_and_whitelist_status
  description: RESP-1 (Conversational engagement) depends on the output of RESP-2
    (Information retrieval) to anchor its responses in approved policy text and avoid
    generating ungrounded or non-compliant information.
