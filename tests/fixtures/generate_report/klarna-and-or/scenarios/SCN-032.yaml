kind: functional
hypothesis_framing: Test hypothesis — a proposed account of how this use case can
  fail, not an observed execution result. The producer makes no execution claim.
narrative: An ungrounded or non-whitelisted policy response is provided to a customer.
  The assistant provides policy information via a reply before the retrieve_policy
  operation is executed because it incorrectly believes it can provide policy-related
  information before the tool grounds the response. This flawed belief arises when
  the controller provides information in an assistant message before the retrieve_policy
  tool is invoked. The assistant provides incorrect, ungrounded, or non-whitelisted
  information, leading to regulatory violations, legal penalties, or fines.
