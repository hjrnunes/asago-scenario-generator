    coordination_links:
    - coordination_mechanism:
        cm_id: CM-1
        description: Ensure the conversational response (RESP-1) is contextually aligned
          with the identity of the authenticated customer (RESP-2) to prevent cross-user
          data leakage.
        payload: authenticated_customer_id
      description: RESP-1 depends on the identity established by RESP-2 to ensure
        conversational context is restricted to the correct user.
      link_id: CL-1
      shared_pm: PM-2-1
      source: RESP-1
      target: RESP-2
    - coordination_mechanism:
        cm_id: CM-2
        description: Validate that the account or order details retrieved (RESP-2)
          authorize the specific refund or payment action (RESP-4).
        payload: order_id, customer_id
      description: RESP-4 requires order/account ownership information maintained
        or retrieved by RESP-2 to prevent unauthorized financial transactions.
      link_id: CL-2
      shared_pm: PM-4-1
      source: RESP-2
      target: RESP-4
    - coordination_mechanism:
        cm_id: CM-3
        description: If RAG retrieval (RESP-3) fails to find a policy match, trigger
          escalation (RESP-5).
        payload: policy_match_status
      description: RESP-5 relies on the outcome of RESP-3's knowledge retrieval to
        identify when a topic is ungrounded and requires human intervention.
      link_id: CL-3
      shared_pm: PM-5-1
      source: RESP-3
      target: RESP-5
    - coordination_mechanism:
        cm_id: CM-4
        description: Ensure that tool execution parameters for financial actions (RESP-4)
          are validated by the tool manager (RESP-6).
        payload: tool_parameters
      description: RESP-6 controls the execution of the tool calls initiated by RESP-4.
      link_id: CL-4
      shared_pm: PM-6-1
      source: RESP-6
      target: RESP-4
    - coordination_mechanism:
        cm_id: CM-5
        description: Ensure data retrieval tools (RESP-2) are invoked with valid parameters
          managed by RESP-6.
        payload: parameter_validation_result
      description: RESP-6 governs the execution of the retrieval tools used by RESP-2.
      link_id: CL-5
      shared_pm: PM-6-1
      source: RESP-6
      target: RESP-2
