rows:
- risk_id: credo-risk-026
  protects: the system's integrity against fraudulent manipulation
  against: fraudulent, destructive, or inappropriate system usage
  covering_constraints: []
  coverage: none
  missing_protection: No constraints address the prevention of social engineering
    or the generation of deepfakes to facilitate fraud.
  evidence:
  - source_ref: credo-risk-026
    quote: Fraud, scams, and targeted manipulation
    meaning: Exact supplied risk-card name for credo-risk-026.
  rationale: While the hazard H-3 touches on deceptive content, no specific constraint
    prevents the use of the AI to facilitate external scams or social engineering
    attacks as described in the risk card.
- risk_id: atlas-hallucination
  protects: the accuracy of information provided to customers
  against: hallucinations and lack of groundedness
  covering_constraints: []
  coverage: partial
  missing_protection: Constraints address policy and financial terms but do not broadly
    prevent all forms of factual fabrication in general conversation.
  evidence:
  - source_ref: atlas-hallucination
    quote: Hallucination
    meaning: Exact supplied risk-card name for atlas-hallucination.
  rationale: The risk of hallucination is addressed by constraints ensuring information
    is grounded in policy or merchant context, but not all hallucinations are covered
    by these specific rules.
- risk_id: credo-risk-021
  protects: the truthfulness of information provided to customers
  against: unintentional generation of false or misleading information
  covering_constraints: []
  coverage: partial
  missing_protection: Constraints address policy and financial terms specifically,
    rather than all general misinformation.
  evidence:
  - source_ref: credo-risk-021
    quote: False or misleading information
    meaning: Exact supplied risk-card name for credo-risk-021.
  rationale: SC-2 and SC-9 provide targeted protection against incorrect policy/financial
    info, which covers the core of this risk in a fintech context.
- risk_id: credo-risk-016
  protects: the integrity of decision-making processes
  against: inappropriate reliance or failure to trust the system
  covering_constraints: []
  coverage: not_applicable_confirmed
  missing_protection: null
  evidence:
  - source_ref: credo-risk-016
    quote: Over or under-reliance and unsafe use (Slattery et al., 2024; IBM, 2024;
      AI, 2023)
    meaning: Exact supplied risk-card name for credo-risk-016.
  rationale: As stated in the disposition, this describes user behavior patterns rather
    than a direct system-level loss within the analyzed boundary.
- risk_id: mit-ai-risk-subdomain-5.1
  protects: customer decision-making and material interests
  against: overreliance and emotional/material dependence
  covering_constraints: []
  coverage: none
  missing_protection: No constraints manage the user's level of trust or psychological
    dependence on the AI.
  evidence:
  - source_ref: mit-ai-risk-subdomain-5.1
    quote: Overreliance and unsafe use
    meaning: Exact supplied risk-card name for mit-ai-risk-subdomain-5.1.
  rationale: While the consequences of overreliance (like erroneous information) are
    covered, the specific risk of human overreliance/dependence is not.
- risk_id: atlas-copyright-infringement
  protects: intellectual property rights
  against: unauthorized reproduction of protected works
  covering_constraints: []
  coverage: not_applicable_confirmed
  missing_protection: null
  evidence:
  - source_ref: atlas-copyright-infringement
    quote: Copyright infringement
    meaning: Exact supplied risk-card name for atlas-copyright-infringement.
  rationale: The system's scope is customer service support, and copyright infringement
    is not a primary risk for this interaction model.
- risk_id: credo-risk-024
  protects: the organization from legal consequences
  against: civil lawsuits (defamation, negligence, privacy)
  covering_constraints: []
  coverage: partial
  missing_protection: Constraints do not cover legal liability resulting from defamation
    or negligence outside of financial/PII rules.
  evidence:
  - source_ref: credo-risk-024
    quote: Civil liability
    meaning: Exact supplied risk-card name for credo-risk-024.
  rationale: Constraints address financial and PII compliance, which are drivers of
    liability, but don't address the broad category of civil liability.
- risk_id: mit-ai-risk-subdomain-3.1
  protects: the organization from regulatory and legal fallout
  against: implementation of fraudulent or unethical business decisions based on misinformation
  covering_constraints: []
  coverage: partial
  missing_protection: Constraints target accuracy of policy and financial info, but
    don't cover all forms of misleading information.
  evidence:
  - source_ref: mit-ai-risk-subdomain-3.1
    quote: False or misleading information
    meaning: Exact supplied risk-card name for mit-ai-risk-subdomain-3.1.
  rationale: SC-2 and SC-9 prevent many instances of incorrect financial/policy information
    that lead to this risk.
- risk_id: mit-ai-risk-subdomain-4.3
  protects: financial assets and company policy integrity
  against: fraud, scams, and manipulation for personal advantage
  covering_constraints: []
  coverage: partial
  missing_protection: Constraints prevent incorrect financial execution but do not
    prevent the use of AI for scams or manipulation.
  evidence:
  - source_ref: mit-ai-risk-subdomain-4.3
    quote: Fraud, scams, and targeted manipulation
    meaning: Exact supplied risk-card name for mit-ai-risk-subdomain-4.3.
  rationale: SC-3 and SC-8 prevent incorrect financial transactions, which mitigates
    some fraudulent outcomes.
- risk_id: credo-risk-023
  protects: the organization's regulatory standing
  against: failure to comply with financial regulations and standards
  covering_constraints: []
  coverage: partial
  missing_protection: Constraints protect against specific financial and policy errors,
    but do not cover all aspects of regulatory compliance.
  evidence:
  - source_ref: credo-risk-023
    quote: Regulatory compliance
    meaning: Exact supplied risk-card name for credo-risk-023.
  rationale: The constraints on financial amounts and policy grounding directly support
    compliance with financial regulations.
- risk_id: atlas-non-disclosure
  protects: transparency of AI usage
  against: failure to disclose AI-generated content
  covering_constraints: []
  coverage: not_applicable_confirmed
  missing_protection: null
  evidence:
  - source_ref: atlas-non-disclosure
    quote: Non-disclosure
    meaning: Exact supplied risk-card name for atlas-non-disclosure.
  rationale: The risk of failing to disclose AI generation is not explicitly linked
    to a customer loss in this context.
- risk_id: atlas-dangerous-use
  protects: financial transactions and customer accounts
  against: fraudulent or destructive manipulation of transactions
  covering_constraints: []
  coverage: partial
  missing_protection: Constraints prevent incorrect transaction parameters but do
    not prevent malicious intent in system usage.
  evidence:
  - source_ref: atlas-dangerous-use
    quote: Dangerous use
    meaning: Exact supplied risk-card name for atlas-dangerous-use.
  rationale: SC-3 and SC-8 mitigate the risk of incorrect financial processing which
    is a component of dangerous use.
- risk_id: mit-ai-risk-subdomain-7.3
  protects: the reliability of service and regulatory standing
  against: failure to perform reliably or effectively in critical areas
  covering_constraints: []
  coverage: partial
  missing_protection: Constraints protect against specific inaccuracies (policy/finance)
    but not all forms of reliability failure.
  evidence:
  - source_ref: mit-ai-risk-subdomain-7.3
    quote: Lack of capability or robustness
    meaning: Exact supplied risk-card name for mit-ai-risk-subdomain-7.3.
  rationale: SC-2, SC-5, and SC-9 protect against the specific types of erroneous
    outputs (policy/financial) mentioned in the risk card.
- risk_id: atlas-over-or-under-reliance
  protects: the integrity of user decisions
  against: inaccurate decision-making due to misplaced trust
  covering_constraints: []
  coverage: partial
  missing_protection: Constraints address the quality of the information but not the
    human's psychological reliance on it.
  evidence:
  - source_ref: atlas-over-or-under-reliance
    quote: Over- or under-reliance
    meaning: Exact supplied risk-card name for atlas-over-or-under-reliance.
  rationale: By ensuring information accuracy (SC-2, SC-9), the system mitigates the
    impact of a user making a decision based on incorrect information.
