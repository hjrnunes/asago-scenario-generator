  \ history/content (PM-1-1) from the conversational interface (RESP-1) to ensure\
  \ grounding.\n- Governing constraint (source: SC-6; authority: supplied structural\
  \ evidence): The assistant must produce conversation summaries that are grounded\
  \ in the actual conversation content.\n- Hazard (source: H-3; authority: supplied\
  \ structural evidence; reaches losses L-1): The assistant generates factually inaccurate\
  \ or non-grounded clinical summaries via summarize_for_ehr that do not reflect the\
