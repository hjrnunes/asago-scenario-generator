# Reviewed semantic decisions for non-obvious canonical linkage.
#
# Each entry records the reviewed observation kind, binding slot, and concise
# independent rationale for a linkage decision that is not self-evident from
# the postcondition description alone. tests/test_attack_pattern_linkage.py
# validates the canonical YAML against these decisions. A step_id of "_chain"
# marks a chain-scope resource link (the observation field then holds the link
# role).
#
# Categories:
#   ingress_delivery   request/prompt delivered to agent -> model_context/ingress
#   tool_outcome       tool performs or exposes the outcome -> tool_invocation/tool
#   state_persist      persisted state in an integration -> persistent_state/integration
#   rendered_output    outcome visible in agent rendered response -> rendered_output/output_surface
#   endpoint_receipt   data delivery/receipt at external endpoint -> endpoint_receipt/integration
#   agent_state        agent-internal assembled state -> agent_state/agent_internal
#   source_influence   typed upstream source crosses a directed boundary into ingress
#
# Rationale cites the postcondition description, produced reference, and
# causal mechanism, not action kind/name, slot cardinality, or taxonomy mapping.
- pattern_id: AP-T3-02
  step_id: deliver_request
  postcondition_id: post.deliver.request
  observation: model_context
  binding_slot_id: ingress
  category: ingress_delivery
  rationale: 'Postcondition: ''Obfuscated cross-boundary request delivered to the agent as
    a direct prompt.'' The request enters the agent''s context through the ingress entry point
    — this is context admission, not persistent state in the connected_service integration.'
- pattern_id: AP-T4-03
  step_id: deliver_request
  postcondition_id: post.deliver.request
  observation: model_context
  binding_slot_id: ingress
  category: ingress_delivery
  rationale: 'Postcondition: ''The crafted request submitted to the agent.'' The step carries
    the ingress activation link; the request enters the agent''s context through the entry
    point — this is context admission, not persistent state in the external_api integration.'
- pattern_id: AP-T2-02
  step_id: exfiltrate_data
  postcondition_id: post.exfiltrate.data
  observation: tool_invocation
  binding_slot_id: delivery_tool
  category: tool_outcome
  rationale: 'Postcondition: ''The transmission tool sends the collected data to the attacker-chosen
    destination.'' The delivery_tool performs the outbound transmission — the outcome is exposed
    through the tool, not through the ingress entry point.'
- pattern_id: AP-T17-03
  step_id: exfiltration
  postcondition_id: post.exfiltration.transmitted
  observation: tool_invocation
  binding_slot_id: adopter_agent
  category: tool_outcome
  rationale: 'Postcondition: ''Each invocation silently transmits the operation''s data to
    the attacker through the covert side-channel.'' The adopter_agent tool performs the transmission
    — the outcome is exposed through the tool.'
- pattern_id: AP-T17-03
  step_id: impact
  postcondition_id: post.impact.continuous_leak
  observation: tool_invocation
  binding_slot_id: adopter_agent
  category: tool_outcome
  rationale: 'Postcondition: ''An adopter''s invocation of the namesquatted tool exfiltrates
    data through the covert side-channel.'' The adopter_agent tool performs the exfiltration
    — the outcome is exposed through the tool.'
- pattern_id: AP-T17-04
  step_id: exfiltration
  postcondition_id: post.exfiltration.transmitted
  observation: tool_invocation
  binding_slot_id: adopter_agent
  category: tool_outcome
  rationale: 'Postcondition: ''Each invocation of the poisoned version silently transmits
    the operation''s data to the attacker.'' The adopter_agent tool performs the transmission
    — the outcome is exposed through the tool.'
- pattern_id: AP-T17-04
  step_id: impact
  postcondition_id: post.impact.rug_pull_complete
  observation: tool_invocation
  binding_slot_id: adopter_agent
  category: tool_outcome
  rationale: 'Postcondition: ''An adopter''s routine upgrade has pulled the malicious version
    and its invocation exfiltrates data on every use.'' The adopter_agent tool performs the
    exfiltration — the outcome is exposed through the tool.'
- pattern_id: AP-T4-01
  step_id: submit_expensive_input
  postcondition_id: post.submit.expensive.input
  observation: model_context
  binding_slot_id: ingress
  category: ingress_delivery
  rationale: 'Postcondition: ''The crafted input submitted to the agent.'' The step carries
    the ingress activation link; the input enters the agent''s context through the entry point
    — this is context admission, not persistent state in the compute_surface integration.'
- pattern_id: AP-T2-01
  step_id: impact
  postcondition_id: post.impact
  observation: tool_invocation
  binding_slot_id: target_tool
  category: tool_outcome
  rationale: 'Postcondition: ''The tool executes with the polluted parameters and produces
    the out-of-bounds outcome.'' The target_tool performs the outcome — the result is exposed
    through the tool, not through the ingress entry point.'
- pattern_id: AP-T9-01
  step_id: attribution_recorded_for_user
  postcondition_id: post.attribution_recorded_for_user
  observation: tool_invocation
  binding_slot_id: delegated_capability
  category: tool_outcome
  rationale: 'Postcondition: ''The agent''s action is recorded as originating from the legitimate
    user.'' The action was performed through the delegated_capability tool; the forged attribution
    is a consequence of the tool''s execution — the outcome is exposed through the tool.'
- pattern_id: AP-T6-07
  step_id: _chain
  postcondition_id: _chain
  observation: source_influence
  binding_slot_id: agent_config
  trust_boundary_slot_id: boundary
  target_ingress_slot_id: ingress
  category: source_influence
  rationale: AP-T6-07 activates when the poisoned agent_config is loaded into a future system
    prompt. The source_influence link therefore crosses the explicitly directed configuration/memory-to-reasoning
    boundary into the typed configuration-load ingress; host execution remains an independently
    proven precondition rather than the ingress.
- pattern_id: AP-T2-02
  step_id: collect_data
  postcondition_id: post.collect.data
  observation: tool_invocation
  binding_slot_id: retrieval_tool
  category: tool_outcome
  rationale: 'Postcondition: ''The retrieval tool returns the sensitive records as an apparently
    normal intermediate result.'' The retrieval_tool performs the data collection — not the
    delivery_tool, which is the subsequent transmission tool. Both the tool_fixture resource
    link and the tool_invocation outcome link must reference the retrieval_tool.'
- pattern_id: AP-T1-06
  step_id: data_collection
  postcondition_id: post.data_collection.assembled
  observation: agent_state
  binding_slot_id: agent_internal_state
  category: agent_state
  rationale: 'Postcondition: ''The assistant has gathered the sensitive data available to
    it under the injected instruction.'' The data is assembled in the agent''s internal working
    context before any endpoint delivery — this is agent-internal state, not an entry-point
    ingress, tool, integration, or output surface. The agent_state observation kind and agent_internal
    slot kind truthfully represent this surface. Candidate-v2 resolves it as the intrinsic
    singleton working state of a profile with an active reasoning zone, without fabricating
    a tool or integration identity.'
- pattern_id: AP-T5-02
  step_id: exfiltrate_via_endpoints
  postcondition_id: post.exfiltrate_via_endpoints
  observation: endpoint_receipt
  binding_slot_id: attacker_endpoint
  category: endpoint_receipt
  rationale: 'Postcondition: ''The agent emits a call to the fabricated attacker-controlled
    endpoint carrying operational-context data in URL parameters or request body: the first
    observable exfiltration.'' The outcome is the emitted call reaching the attacker endpoint
    — this is endpoint receipt/transmission, not persisted state. The produced reference is
    an effect (context_data_exfiltrated), not a state, confirming no storage is established.'
- pattern_id: AP-T16-02
  step_id: context_hijacking_impact
  postcondition_id: post.context_hijacking_impact
  observation: tool_invocation
  binding_slot_id: receiving_agent
  category: tool_outcome
  rationale: 'Postcondition: ''The receiving agent has executed an unintended operation under
    the injected context — data exfiltration or unauthorized tool invocations: the first observable
    hijack outcome.'' The effect is produced by the receiving_agent tool — the outcome is
    exposed through the receiving agent, not through the protocol_endpoint integration which
    is the poisoned-content source.'
- pattern_id: AP-T1-06
  step_id: rendered_output_exfiltration
  postcondition_id: post.rendered_output_exfiltration.encoded
  observation: rendered_output
  binding_slot_id: rendered_output
  category: rendered_output
  rationale: 'Postcondition: ''The sensitive data is encoded in a rendered output element
    the client will automatically fetch from the attacker endpoint.'' The outcome is the agent''s
    rendered response containing the encoded data — this is visible on the agent''s output
    surface, not through the input ingress or any tool or integration. A new output_surface
    slot kind and rendered_output observation kind represent this truthfully; the profile
    binds it to an output-direction EntryPoint.'
- pattern_id: AP-T1-06
  step_id: impact
  postcondition_id: post.impact.exfiltration_complete
  observation: endpoint_receipt
  binding_slot_id: exfil_endpoint
  category: endpoint_receipt
  rationale: 'Postcondition: ''The client''s automatic fetch delivers the encoded sensitive
    data to the attacker-controlled endpoint.'' The outcome is delivery/receipt at the external
    endpoint, not persisted state. A new endpoint_receipt observation kind distinguishes arrival
    from storage; the exfil_endpoint integration slot is the destination the data arrives
    at.'
- pattern_id: AP-T6-03
  step_id: redirect_agent_goal
  postcondition_id: post.redirect_agent_goal
  observation: agent_state
  binding_slot_id: agent_goal
  category: agent_state
  rationale: 'Postcondition: the injected instruction redirects the agent''s operational objective.
    The affected surface is the agent''s own active goal state, not durable state in an external
    integration. The agent_state observation therefore binds to the intrinsic agent_internal
    goal resource.'
- pattern_id: AP-T6-03
  step_id: execute_unintended_actions
  postcondition_id: post.execute_unintended_actions
  observation: agent_state
  binding_slot_id: agent_goal
  category: agent_state
  rationale: 'Postcondition: the agent adopts the injected objective and first acts under
    it. This remains an observable change in the agent''s active goal state; it does not establish
    persistence in a tool, memory store, or external integration.'
