[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asago-scenario-generator"
version = "0.1.0"
description = "LLM-driven red-teaming scenario generator for LLM and agentic AI systems"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "jsonschema>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
asago-scenario-generator = "asago_scenario_generator.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.164.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[tool.uv]
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel.force-include]
"data" = "asago_scenario_generator/data/bundled"

[tool.pytest.ini_options]
# Bare `pytest` runs the unit suite only. The acceptance suite is generated
# from Gherkin IR and is run explicitly (`pytest build/acceptance/generated/`) so
# that a generation step is never mistaken for a unit-test regression.
testpaths = ["tests"]
# Resolve the package from the rootdir-relative src tree so pytest runs inside
# isolated mutation-worker copies import the copy being mutated rather than an
# editable-installed absolute path to the live workspace.
pythonpath = ["src"]
# Without this, collection walks scratch and worktree directories and picks
# up stray `test_*.py` files that are not part of any suite.
# This setting REPLACES pytest's defaults rather than extending them, so the
# default patterns are repeated here; dropping them un-ignores .venv, .git
# and .hypothesis.
norecursedirs = [
    # pytest defaults
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    # project-specific scratch
    "tmp",
    "output",
    "data",
    "*.egg-info",
]
markers = [
    "acceptance: generated Gherkin acceptance test (run via build/acceptance/generated/)",
]
