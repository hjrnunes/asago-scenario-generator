[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asago-scenario-generator"
version = "0.1.0"
description = "LLM-driven red-teaming scenario generator for LLM and agentic AI systems"
requires-python = ">=3.12"
dependencies = [
    # ``stpa/scenario_prod/handoff.py`` reads the handoff contract, the installed spec
    # set and the envelope writer from the shared core, so the app names it directly
    # instead of relying on another dependency's resolution.
    "asago-contracts-core>=0.1,<0.2",
    "asago-handoff>=0.1,<0.2",
    "asago-report-kit>=0.1,<0.2",
    "jinja2>=3.1",
    "jsonschema>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
# The scanner is the workspace member packages/asago-target-discovery; the
# extra keeps installing it together with the MCP SDK its transport imports.
target-discovery = [
    "asago-target-discovery>=0.1,<0.2",
    "mcp>=1.9.0,<2",
]

[project.scripts]
asago-scenario-generator = "asago_scenario_generator.cli:app"

[dependency-groups]
dev = [
    "asago-target-discovery>=0.1,<0.2",
    "hypothesis>=6.164.0",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
# The contracts core: the shared handoff validator, canonical JSON, the installed spec
# reader and the envelope. The app reads it.
asago-contracts-core = { workspace = true }
asago-handoff = { workspace = true }
# The report kit's workspace member: the HTML helpers, stylesheet, script and
# stage-summary schema every report writer renders with.
asago-report-kit = { workspace = true }
# The scanner's workspace member: the app lists it in its target-discovery extra
# and in its dev group, and the member depends back on the app for the STPA
# models it reads.
asago-target-discovery = { workspace = true }

# Keep bulky non-package directories out of mutate4py's workspace
# discovery and per-worker tree copies (the tool skips excluded dirs in
# both).
[tool.uv.workspace]
members = ["packages/*"]
exclude = [
    "output",
    "tmp",
    "dist",
    ".worktrees",
    ".hypothesis",
    "ai",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Cleanup C2 (asago-5h8j.3.2) names F401 (unused import) and F841 (unused
# local) explicitly, so the requirement lives in config instead of in ruff's
# defaults. extend-select keeps every default rule (E4, E7, E9, F) in the
# blocking scripts/quality.sh gate; a plain `select` would replace the
# defaults and narrow the gate, so do not use one here.
extend-select = ["F401", "F841"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "asago_scenario_generator/data/bundled"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolve the package from the rootdir-relative src tree so pytest runs inside
# isolated mutation-worker copies import the copy being mutated rather than an
# editable-installed absolute path to the live workspace.
# The replay gate is development tooling in scripts/, outside the package.
pythonpath = ["src", "scripts"]
# Without this, collection walks scratch and worktree directories and picks
# up stray `test_*.py` files that are not part of any suite.
# This setting REPLACES pytest's defaults rather than extending them, so the
# default patterns are repeated here; dropping them un-ignores .venv, .git
# and .hypothesis.
norecursedirs = [
    # pytest defaults
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    # project-specific scratch
    "tmp",
    "output",
    "data",
    "*.egg-info",
]
