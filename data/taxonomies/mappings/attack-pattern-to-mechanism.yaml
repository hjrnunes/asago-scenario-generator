# Reviewed control-loop mechanisms per attack pattern.
#
# A link says the pattern's attack realizes the listed mechanisms (defined in
# taxonomies/mechanisms/mechanism-library.yaml) on a system with the surface
# the pattern needs. The relation is many to many: one pattern can realize
# several mechanisms and one mechanism can serve many patterns. A pattern
# without a link realizes no known mechanism, which is not a claim that it
# realizes none; stale_feedback and forged_completion have no clear pattern
# yet, so no link names them.
#
# pattern_semantic_digest pins the pattern's canonical_chain.semantic_digest
# at review time; a revised pattern fails the reference test until its link is
# reviewed again. semantic_digest covers every other field of this file under
# the domain asago-scenario-generator:pattern-mechanism-relation:v1, and
# loading rejects a file whose content does not match it.
