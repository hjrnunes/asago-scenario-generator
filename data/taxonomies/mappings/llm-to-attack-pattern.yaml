# Reviewed OWASP LLM Top 10 (2025) categories per attack pattern.
#
# The obligation planner pairs a risk with a pattern through the risk's OWASP
# LLM row and the category listed here. A category belongs to a pattern when
# the pattern's attack realizes that category's failure on a system with the
# surface the pattern needs. The pattern's own threat_id still records the
# agentic threat; this table never changes threat gating.
#
# `llm` lists category IDs. An empty list means the pattern has no OWASP LLM
# counterpart, so no risk row pairs with it. Every attack pattern in the
# bundled catalog has one entry; a catalog change adds its entry here.
