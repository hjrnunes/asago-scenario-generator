      poisoned version and every subsequent invocation leaks data. This
      record owns the post-adoption trust-abuse mechanism with the
      clean-release-then-malicious-update timing; registry identity capture
      with the capability present from initial publication belongs to
      AP-T17-03. Exact ATLAS chain identity: AML.T0109 — publishing a
      legitimate AI component, gaining adoption, then pushing a malicious
      update is AML.T0109's exact defined operation (AI supply chain rug
      pull), verbatim the mechanism of this pattern; evidence AML.CS0053
      S03-S04, plus pinned technique definition AML.T0109.

