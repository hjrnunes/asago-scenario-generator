    description: >
      Through an exposed AI agent control interface, an attacker submits
      arbitrary prompts that exploit the agent's instruction-following
      behavior to invoke privileged tools, achieving root execution inside
      the agent's own container via its bash skill. This record owns the
      prompt-driven privileged-tool compromise mechanism; any impact beyond
      the container (host-level escape) is inferred, not demonstrated. The
      system-prompt disclosure observed at AML.CS0048 S04 is incidental
      reconnaissance, not a causal step of this mechanism. Exact ATLAS
      chain identity: AML.T0051.000 — submitting arbitrary
