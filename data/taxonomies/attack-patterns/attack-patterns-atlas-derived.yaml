# Abstract attack patterns derived from MITRE ATLAS case studies.
#
# Canonical-chain contract v1 (authoring wave, bead asago-scenario-generator-422o.2.3).
# Authority: data/taxonomies/attack-patterns/catalog-lineage.yaml (final
# lineage artifact). Five historical source records (AP-T1-06, AP-T11-05,
# AP-T17-03, AP-T3-04, AP-T6-06) migrate to nine resulting records:
# AP-T1-06, AP-T11-05, AP-T17-03, AP-T17-04, AP-T3-04, AP-T3-05, AP-T3-06,
# AP-T6-06, AP-T6-07. AP-T17-03 splits two ways (namesquat vs rug-pull
# timing) reconciled against the nine AML.CS0053 steps S00-S08; AP-T3-04
# splits three ways against AML.CS0048 S00-S09; AP-T6-06 splits two ways
# against AML.CS0051 S00-S17 (its 15-step legacy chain, correcting the
# stale "8 steps" header wording of the legacy record). Legacy kill_chain
# and evidence fields are removed from every converted record.
#
# ATLAS is the sole authoritative external taxonomy (LAAF absent, unpinned).
# The companion SSSOM file carries skos:relatedMatch candidates only;
# candidate provenance never confers ExactMapping authority. Every exact
# mapping below restates its operational identity and evidence: chain-scope
# in the record description (the v1 model has no chain-scope rationale
# field), step-scope in the step provenance. Deliberate definition-level
# divergences from the pinned case-study relationships are marked
# "retag"; supports-by-analogy evidence is marked "analogue"; steps
# abstracted from a demonstrated step are tiered "variant" and steps with
# no demonstration are tiered "inferred".
#
# Modeling rule: a step carrying a lineage-approved exact mapping is
# attacker-controlled (ATLAS techniques denote adversary operations);
# victim/system-side mechanics without a promoted technique are system
# steps with not_applicable mappings. Cross-step linkage is explicit via
# consumed/produced typed references.

source:
  name: "asago-scenario-generator abstract attack patterns (ATLAS-derived)"
  version: "1.0.0"
  derived_from:
    - "MITRE ATLAS 2026.05 Case Studies (pinned)"
    - "catalog-lineage.yaml v1 final dispositions"

patterns:
  # ═══════════════════════════════════════════════════════════════════
  # AP-T1-06 — retain (lineage). Composite of AML.CS0024 (poisoning /
  # activation, adapted) with AML.CS0021 and AML.CS0029 (rendered-output
  # exfiltration, explicit). Collection stays inferred. 7-step chain.
  # ═══════════════════════════════════════════════════════════════════

  AP-T1-06:
    id: "AP-T1-06"
    threat_id: "T1"
    name: "Zero-click RAG poisoning with rendered-output exfiltration"
    description: >
      An attacker delivers content disguised as legitimate material into a
      data corpus feeding an AI assistant's retrieval pipeline. When a later
      query retrieves the poisoned content, hidden instructions activate
      without any user interaction with the malicious content (zero-click)
      and direct the assistant to encode sensitive data into rendered output
      elements (such as markdown image URLs) that the client application
      automatically fetches, exfiltrating the data to an attacker-controlled
      endpoint. Exact ATLAS chain identity: AML.T0070 — planting the
      disguised content in a RAG-indexed corpus so a future retrieval
      activates it is AML.T0070's exact defined operation (RAG poisoning);
      evidence AML.CS0024 S02-S03 analogue and AML.CS0029 S03-S04 analogue
      (the pinned relationships there employ AML.T0053/AML.T0051.002 and
      AML.T0093/AML.T0051.001 respectively, not AML.T0070, so corpus
      planting is supported by analogy), plus pinned technique definition
      AML.T0070. AML.T0077 — encoding sensitive data into rendered output
      that the client automatically fetches is AML.T0077's exact defined
      operation (private information hidden in rendered LLM responses is
      exfiltrated via automatic requests); evidence AML.CS0021 S04 and
      AML.CS0029 S05, plus pinned technique definition AML.T0077.

    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "memory"]
      kc_requires:
        all: ["KCX-VSTORE"]
        any: ["KC4.3", "KC4.4", "KC4.5", "KC4.6"]

    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"

    canonical_chain:
      schema_version: "v1"
      pattern_id: "AP-T1-06"
      chain_id: "chain.ap-t1-06"
      semantic_revision: 1
      semantic_digest: "a24f3324f135d9213ee2dc7dea6ae060313b746424fc585b5d74b9853c2d7556"
      taxonomy_context:
        atlas:
          release: "2026.05"
          digest: "defd9014c6d5f5954460ef438faea583fcb1830ff81e85709628efb43037cc3a"
        mapping_set_digest: "15680b8778f51f30b1daf3ca2551437caebc3b8293c4b5e2ecf4d1b90756bfdc"
      mappings:
        - decision: "exact"
          taxonomy: "ATLAS"
          ids: ["AML.T0070", "AML.T0077"]
      steps:
        - step_id: "craft_payload"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "outside"
          action_kind: "prepare"
          consumed: []
          produced:
            - kind: "artifact"
              ref_id: "artifact.disguised_payload"
              value_type: "object"
            - kind: "state"
              ref_id: "state.exfil_endpoint_staged"
              value_type: "boolean"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.craft_payload.ready"
              description: "The disguised injection payload and the attacker-controlled exfiltration endpoint are ready."
              security_relevant: false
              terminal: false
          resource_links: []
          observable_outcome_links: []
          order: 1
          attacker_controlled: true
          provenance:
            tier: "variant"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0021 S00"
              - reference_type: "catalog"
                reference_id: "AML.CS0029 S00"
              - reference_type: "design_record"
                reference_id: "catalog-lineage:AP-T1-06"
            confidence: 75
            adaptation_rationale: >
              Payload development adapted from the explicit prompt-development
              steps AML.CS0021 S00 and AML.CS0029 S00; RAG-targeting adapted
              against AML.CS0024's poisoning line. Staging the exfiltration
              endpoint is pattern-level preparation attested across the
              composite sources.
          mappings:
            - decision: "unmapped"
              taxonomy: "ATLAS"
              rationale: >
                Generic prompt crafting and endpoint staging (legacy
                AML.T0065/AML.T0066/AML.T0079; SSSOM candidate AML.T0093)
                are not promoted: the lineage approves no step-level exact
                identity for preparation. The pattern's exact identities
                live at chain scope (AML.T0070, AML.T0077) and on the
                activation and exfiltration steps.
        - step_id: "deliver_content"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "crossing"
          action_kind: "deliver"
          consumed:
            - kind: "artifact"
              ref_id: "artifact.disguised_payload"
              value_type: "object"
          produced:
            - kind: "state"
              ref_id: "state.content_delivered"
              value_type: "boolean"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.deliver_content.channel"
              description: "The disguised content sits in a channel that feeds the assistant's data corpus."
              security_relevant: false
              terminal: false
          resource_links:
          - slot_id: ingress
            role: ingress
            trust_boundary_slot_id: null
            target_ingress_slot_id: null
          observable_outcome_links:
          - postcondition_id: post.deliver_content.channel
            observation: persistent_state
            binding_slot_id: rag_corpus
          order: 2
          attacker_controlled: true
          provenance:
            tier: "variant"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0029 S03"
              - reference_type: "catalog"
                reference_id: "AML.CS0024 S02"
              - reference_type: "design_record"
                reference_id: "catalog-lineage:AP-T1-06"
            confidence: 75
            adaptation_rationale: >
              Delivery adapted from AML.CS0029 S03 (a shared document
              exploiting the assistant's document access) and AML.CS0024 S02
              (a malicious email delivered to the RAG-backed system),
              abstracted to any corpus-feeding channel.
          mappings:
            - decision: "unmapped"
              taxonomy: "ATLAS"
              rationale: >
                AML.T0093 (prompt infiltration via a public-facing
                application) remains an SSSOM skos:relatedMatch candidate
                only; candidate provenance never confers exact-mapping
                authority, and the lineage promotes no delivery-step
                identity for this pattern.
        - step_id: "rag_ingestion"
          requirement: "required"
          condition: null
          executor_role: "system"
          boundary_position: "inside"
          action_kind: "persist"
          consumed:
            - kind: "state"
              ref_id: "state.content_delivered"
              value_type: "boolean"
          produced:
            - kind: "state"
              ref_id: "state.poisoned_corpus_entry"
              value_type: "object"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.rag_ingestion.dormant"
              description: "The poisoned content is indexed in the retrieval corpus; the injection lies dormant."
              security_relevant: false
              terminal: false
          resource_links: []
          observable_outcome_links:
          - postcondition_id: post.rag_ingestion.dormant
            observation: persistent_state
            binding_slot_id: rag_corpus
          order: 3
          attacker_controlled: false
          provenance:
            tier: "variant"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0024 S02"
              - reference_type: "design_record"
                reference_id: "catalog-lineage:AP-T1-06"
            confidence: 70
            adaptation_rationale: >
              Automatic indexing adapted from AML.CS0024 S02 (the email is
              stored in the database used for retrieval augmented
              generation), generalized to corpus ingestion.
          mappings:
            - decision: "not_applicable"
              taxonomy: "ATLAS"
        - step_id: "zero_click_activation"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "inside"
          action_kind: "invoke"
          consumed:
            - kind: "state"
              ref_id: "state.poisoned_corpus_entry"
              value_type: "object"
          produced:
            - kind: "effect"
              ref_id: "effect.injection_activated"
              value_type: "boolean"
            - kind: "state"
              ref_id: "state.injected_directive_active"
              value_type: "boolean"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.zero_click_activation.fired"
              description: "A benign query retrieves the poisoned entry and the hidden instructions execute with no user interaction with the malicious content."
              security_relevant: true
              terminal: false
          resource_links: []
          observable_outcome_links:
          - postcondition_id: post.zero_click_activation.fired
            observation: persistent_state
            binding_slot_id: rag_corpus
          order: 4
          attacker_controlled: true
          provenance:
            tier: "observed"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0021 S03"
              - reference_type: "catalog"
                reference_id: "AML.CS0029 S04"
              - reference_type: "design_record"
                reference_id: "catalog-lineage:AP-T1-06"
            confidence: 90
            adaptation_rationale: >
              Activation on retrieval without user interaction is explicit
              in AML.CS0021 S03 and AML.CS0029 S04 (both pin AML.T0051.001);
              the composite also adapts AML.CS0024 S03's triggered retrieval
              activation. Activation through the ingested data channel is
              AML.T0051.001's exact defined indirect-injection operation
              (pinned technique definition).
          mappings:
            - decision: "exact"
              taxonomy: "ATLAS"
              ids: ["AML.T0051.001"]
        - step_id: "data_collection"
          requirement: "required"
          condition: null
          executor_role: "system"
          boundary_position: "inside"
          action_kind: "observe"
          consumed:
            - kind: "state"
              ref_id: "state.injected_directive_active"
              value_type: "boolean"
          produced:
            - kind: "state"
              ref_id: "state.sensitive_data_assembled"
              value_type: "object"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.data_collection.assembled"
              description: "The assistant has gathered the sensitive data available to it under the injected instruction."
              security_relevant: false
              terminal: false
          resource_links: []
          observable_outcome_links:
          - postcondition_id: post.data_collection.assembled
            observation: agent_state
            binding_slot_id: agent_internal_state
          order: 5
          attacker_controlled: false
          provenance:
            tier: "inferred"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0024 S05"
              - reference_type: "design_record"
                reference_id: "catalog-lineage:AP-T1-06"
            confidence: 45
            adaptation_rationale: >
              Collection stays inferred: AML.CS0021 and AML.CS0029
              exfiltrate the already-available conversation history rather
              than actively searching (catalog-lineage:AP-T1-06). The
              closest demonstrated analogue is AML.CS0024 S05's
              instruction-driven leak of sensitive data.
          mappings:
            - decision: "not_applicable"
              taxonomy: "ATLAS"
        - step_id: "rendered_output_exfiltration"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "crossing"
          action_kind: "deliver"
          consumed:
            - kind: "state"
              ref_id: "state.sensitive_data_assembled"
              value_type: "object"
            - kind: "state"
              ref_id: "state.exfil_endpoint_staged"
              value_type: "boolean"
          produced:
            - kind: "state"
              ref_id: "state.trojanized_rendered_output"
              value_type: "object"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.rendered_output_exfiltration.encoded"
              description: "The sensitive data is encoded in a rendered output element the client will automatically fetch from the attacker endpoint."
              security_relevant: true
              terminal: false
          resource_links: []
          observable_outcome_links:
          - postcondition_id: post.rendered_output_exfiltration.encoded
            observation: rendered_output
            binding_slot_id: rendered_output
          order: 6
          attacker_controlled: true
          provenance:
            tier: "observed"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0021 S04"
              - reference_type: "catalog"
                reference_id: "AML.CS0029 S05"
              - reference_type: "design_record"
                reference_id: "catalog-lineage:AP-T1-06"
            confidence: 90
            adaptation_rationale: >
              Encoding the collected data into client-rendered output whose
              automatic request reaches the attacker endpoint is explicit in
              AML.CS0021 S04 and AML.CS0029 S05 (both pin AML.T0077) and is
              AML.T0077's exact defined operation (pinned technique
              definition).
          mappings:
            - decision: "exact"
              taxonomy: "ATLAS"
              ids: ["AML.T0077"]
        - step_id: "impact"
          requirement: "required"
          condition: null
          executor_role: "system"
          boundary_position: "crossing"
          action_kind: "impact"
          consumed:
            - kind: "state"
              ref_id: "state.trojanized_rendered_output"
              value_type: "object"
          produced:
            - kind: "effect"
              ref_id: "effect.sensitive_data_exfiltrated"
              value_type: "boolean"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.impact.exfiltration_complete"
              description: "The client's automatic fetch delivers the encoded sensitive data to the attacker-controlled endpoint: the first observable exfiltration completes and user confidentiality is violated."
              security_relevant: true
              terminal: true
          resource_links: []
          observable_outcome_links:
          - postcondition_id: post.impact.exfiltration_complete
            observation: endpoint_receipt
            binding_slot_id: exfil_endpoint
          order: 7
          attacker_controlled: false
          provenance:
            tier: "observed"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0021 S06"
              - reference_type: "catalog"
                reference_id: "AML.CS0029 S06"
              - reference_type: "design_record"
                reference_id: "catalog-lineage:AP-T1-06"
            confidence: 85
            adaptation_rationale: >
              Impact explicit against AML.CS0021 S03-S05 and AML.CS0029
              S04-S05 per the lineage; the privacy-violation consequence is
              AML.CS0021 S06 and AML.CS0029 S06.
          mappings:
