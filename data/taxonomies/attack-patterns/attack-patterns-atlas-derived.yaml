  # ═══════════════════════════════════════════════════════════════════
  # AP-T3-05 — split-derived (lineage), resulting record 2 of 3 from
  # AP-T3-04: credential harvest from configuration/environment surfaces
  # with connected-service pivot. Explicit against AML.CS0048 S02 and S05;
  # pivot variant against S08. 3-step chain.
  # ═══════════════════════════════════════════════════════════════════

  AP-T3-05:
    id: "AP-T3-05"
    threat_id: "T3"
    name: "Agent credential harvesting and connected-service pivot"
    description: >
      Through an exposed AI agent control interface, an attacker harvests
      plaintext credentials for connected services from configuration files
      and environment surfaces, then reuses them to pivot across the agent's
      connected service ecosystem. This record owns the credential-harvest
      and pivot mechanism; the exposure/access primitive belongs to
      AP-T3-04 and prompt-driven compromise belongs to AP-T3-06. Exact
      ATLAS chain identity: AML.T0083 — extracting connected-service
      credentials (API keys, tokens, connection strings) from the agent's
      configuration files is AML.T0083's exact defined operation
      (credentials from AI agent configuration); evidence AML.CS0048 S02
      (clawdbot.json), plus pinned technique definition AML.T0083.

    prerequisite_capabilities:
      min_zones: ["input", "tool_execution"]
      kc_requires:
        any: ["KC6.1.1", "KC6.1.2", "KC6.2.1", "KC6.2.2", "KC6.4", "KC6.5"]

    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"

    canonical_chain:
      schema_version: "v1"
      pattern_id: "AP-T3-05"
