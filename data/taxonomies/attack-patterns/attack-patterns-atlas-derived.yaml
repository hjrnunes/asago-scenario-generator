  AP-T17-03:
    id: "AP-T17-03"
    threat_id: "T17"
    name: "Tool supply chain poisoning via registry namesquatting"
    description: >
      An attacker registers the expected package name on a public tool
      registry before the legitimate maintainer claims it, publishes a
      functional tool carrying a covert exfiltration capability from
      initial publication, and has adopters install it believing it
      legitimate so invocations silently leak data. This record owns the
      registry identity-capture mechanism with the malicious capability
      present from initial publication; the clean-release-then-malicious-
      update timing belongs to AP-T17-04. Exact ATLAS chain identity:
      AML.T0073 — claiming the expected package identity in a software
      registry before the legitimate maintainer is impersonation targeting
      an AI DevOps lifecycle resource, AML.T0073's exact operation as
      assigned by AML.CS0053 to the namesquatting step (its definition
      explicitly covers software registries); evidence AML.CS0053 S00,
      plus pinned technique definition AML.T0073. AML.T0104 — publishing
      the functional-but-poisoned tool to the registry is AML.T0104's
      exact defined operation (publish poisoned AI agent tool); evidence
      AML.CS0053 S02, plus pinned technique definition AML.T0104.

