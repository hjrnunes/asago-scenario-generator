          kind: "entry_point"
          purpose: "initial_ingress"
        - slot_id: "rag_corpus"
          kind: "integration"
          purpose: "intermediate"
        - slot_id: "exfil_endpoint"
          kind: "integration"
          purpose: "target"
        - slot_id: "rendered_output"
          kind: "output_surface"
          purpose: "intermediate"
        - slot_id: "agent_internal_state"
          kind: "agent_internal"
          purpose: "intermediate"
        - slot_id: "boundary"
          kind: "trust_boundary"
          purpose: "supporting"
      initial_ingress_slot_id: "ingress"

  # ═══════════════════════════════════════════════════════════════════
  # AP-T3-04 — split (lineage), resulting record 1 of 3: the exposure /
  # access primitive. Explicit against AML.CS0048 S00-S01. Downstream
  # mechanisms: credential harvest and pivot (AP-T3-05), prompt-driven
  # privileged-tool compromise (AP-T3-06). 2-step chain.
  # ═══════════════════════════════════════════════════════════════════

  AP-T3-04:
    id: "AP-T3-04"
    threat_id: "T3"
    name: "Exposed agent control interface exploitation"
    description: >
      An attacker discovers internet-exposed AI agent management or control
      interfaces with weak or absent authentication and accesses their
      administrative functionality as an unauthorized access primitive.
      This record owns the exposure/access mechanism only: downstream
      credential harvesting and pivot belong to AP-T3-05, and prompt-driven
      privileged-tool compromise belongs to AP-T3-06. Exact ATLAS chain
      identity: AML.T0049 — accessing an internet-facing agent control
      application whose missing authentication is a design weakness, using
      crafted requests to cause unintended behavior, is AML.T0049's exact
      defined operation (exploit public-facing application); evidence
      AML.CS0048 S01, plus pinned technique definition AML.T0049.

    prerequisite_capabilities:
      min_zones: ["input", "tool_execution"]
      kc_requires:
        any: ["KC6.1.1", "KC6.1.2", "KC6.2.1", "KC6.2.2", "KC6.4", "KC6.5"]

    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"

    canonical_chain:
      schema_version: "v1"
      pattern_id: "AP-T3-04"
      chain_id: "chain.ap-t3-04"
      semantic_revision: 1
      semantic_digest: "146434b32ed88ecfbaab52cd83bcdf7ff7468614acf9673328d28daf0395eede"
      taxonomy_context:
        atlas:
          release: "2026.05"
          digest: "defd9014c6d5f5954460ef438faea583fcb1830ff81e85709628efb43037cc3a"
        mapping_set_digest: "15680b8778f51f30b1daf3ca2551437caebc3b8293c4b5e2ecf4d1b90756bfdc"
      mappings:
        - decision: "exact"
          taxonomy: "ATLAS"
          ids: ["AML.T0049"]
      steps:
        - step_id: "reconnaissance"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "outside"
          action_kind: "observe"
          consumed: []
          produced:
            - kind: "state"
              ref_id: "state.exposed_interface_identified"
              value_type: "boolean"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.reconnaissance.candidates"
              description: "Candidate internet-exposed agent control interfaces are identified."
              security_relevant: false
              terminal: false
          resource_links: []
          observable_outcome_links: []
          order: 1
          attacker_controlled: true
          provenance:
            tier: "observed"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0048 S00"
              - reference_type: "design_record"
                reference_id: "catalog-lineage:AP-T3-04"
            confidence: 85
            adaptation_rationale: >
              Explicit against AML.CS0048 S00 (the Shodan title-tag search
              for exposed control interfaces). Mapping retag: the pinned
              relationship assigns AML.T0000 (search open technical
              databases) to the Shodan search; it is retagged at definition
              level to AML.T0006 because sweeping the internet for live
              exposed AI agent services is active scanning, not a database
              lookup — AML.T0006's definition explicitly covers scanning
              for public AI chat agents and AI DevOps tools (pinned
              technique definition).
          mappings:
            - decision: "exact"
              taxonomy: "ATLAS"
              ids: ["AML.T0006"]
        - step_id: "initial_access"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "crossing"
          action_kind: "invoke"
          consumed:
            - kind: "state"
              ref_id: "state.exposed_interface_identified"
              value_type: "boolean"
          produced:
            - kind: "effect"
              ref_id: "effect.unauthorized_interface_access"
              value_type: "boolean"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.initial_access.unauthorized"
              description: "The exposed administrative interface answers the attacker's crafted requests without authentication: the first observable unauthorized access to the agent control plane."
              security_relevant: true
              terminal: true
          resource_links:
          - slot_id: ingress
            role: ingress
            trust_boundary_slot_id: null
            target_ingress_slot_id: null
          observable_outcome_links:
          - postcondition_id: post.initial_access.unauthorized
            observation: persistent_state
            binding_slot_id: control_interface
          order: 2
          attacker_controlled: true
          provenance:
            tier: "observed"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0048 S01"
              - reference_type: "design_record"
                reference_id: "catalog-lineage:AP-T3-04"
            confidence: 90
            adaptation_rationale: >
              Explicit against AML.CS0048 S01 (crafted requests to the
              exposed control interface; authentication absent or bypassed
              via the proxy misconfiguration). The access primitive is the
              whole mechanism: credential harvesting (AP-T3-05) and
              prompt-driven compromise (AP-T3-06) are separate resulting
              patterns per the lineage three-way split.
          mappings:
            - decision: "exact"
              taxonomy: "ATLAS"
              ids: ["AML.T0049"]
      earliest_attacker_controlled_step_id: "reconnaissance"
      resource_slots:
        - slot_id: "ingress"
          kind: "entry_point"
          purpose: "initial_ingress"
        - slot_id: "control_interface"
          kind: "integration"
          purpose: "target"
        - slot_id: "boundary"
