# Canonical attack patterns for asago-scenario-generator (Batch C: T12/T15/T17), v1.
#
# Migrated under bead asago-scenario-generator-422o.2.8 from the legacy kill-chain
# catalog into the authoritative canonical-chain contract
# (asago_scenario_generator.models.attack_pattern.AttackPattern) per the merged
# catalog-lineage.yaml dispositions for this file's nine historical sources:
#   retain: AP-T15-01, AP-T17-01
#   narrow: AP-T12-01, AP-T12-03, AP-T15-02
#   defer:  AP-T12-02, AP-T12-04, AP-T12-05 (not live; re-entry conditions in
#           catalog-lineage.yaml)
#   retire: AP-T17-02 (no successor; not reconstructed)
# AP-T15-02 carries the approved CS0055 directionality correction
# (agent-as-victim, not agent-as-social-engineer; grounded in AML.CS0020
# S02-S03-S04; no CS0055 evidence after preparation) and AP-T17-01 preserves
# the evidence-backed persistence step (AML.CS0041 S04), with its terminal as
# the first emission of the backdoored artifact (no adopter-use claim).
# AP-T12-03 deliberately departs from catalog-lineage.yaml in one place,
# fail-closed: the lineage atlas_step_mappings entry proposing exact
# AML.T0051.002 for trigger_false_incorporation is a false exact identity
# (retrieval of false data is not a triggered prompt injection) and requires
# a lineage amendment; the chain-scope AML.T0070 identity is retained.
#
# ATLAS is the sole v1 taxonomy authority. Every chain embeds
# the production taxonomy pins and a semantic digest computed with
# compute_chain_semantic_digest; each record is one pure branch-free
# total-order chain (all steps required, no conditions). SSSOM
# skos:relatedMatch rows remain unqualified migration provenance and never
# confer exact mappings.

source:
  name: asago-scenario-generator canonical attack patterns
  version: 1.0.0
  derived_from:
  - catalog-lineage.yaml (final authoritative dispositions, release 1.0.0)
  - MITRE ATLAS 2026.05 (pinned; sole v1 authority)
  - OWASP Agentic AI Threats & Mitigations v1.1 (legacy catalog origin)
patterns:
  AP-T12-01:
    id: AP-T12-01
    threat_id: T12
    name: Collaborative decision manipulation via inter-agent message injection
    description: An attacker injects crafted messages into inter-agent communication channels, introducing misleading data
      that gradually shifts the collective decision-making of a multi-agent system. Because each agent treats incoming peer
      messages as trusted input, the injected content compounds through successive reasoning steps, steering the group toward
      attacker-chosen objectives without triggering anomaly detection on any single message.
    nist_classification:
      attacker_goal: integrity
      attacker_knowledge: gray_box
      learning_stage: deployment
      attack_class: poisoning.backdoor_poisoning
    prerequisite_capabilities:
      min_zones:
      - input
      - reasoning
      - inter_agent
      kc_requires:
        all:
        - KCX-MAGENT
        any:
        - KC2.3
    canonical_chain:
      schema_version: v1
      pattern_id: AP-T12-01
      chain_id: chain.ap-t12-01.1
      semantic_revision: 1
      taxonomy_context:
        atlas:
          release: '2026.05'
          digest: defd9014c6d5f5954460ef438faea583fcb1830ff81e85709628efb43037cc3a
        mapping_set_digest: 29ff3a15a86a194812e029ba407a97a757c98a2d887fb922ea4f0e0a8fd40ea6
      mappings:
      - decision: exact
        taxonomy: ATLAS
        ids:
        - AML.T0051.001
      steps:
      - step_id: access_shared_channel
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: outside
        action_kind: prepare
        consumed: []
        produced:
        - kind: state
          ref_id: state.channel_access
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.channel_accessible
          description: The attacker can reach the shared inter-agent communication channel (shared RAG, message bus, knowledge
            store) whose messages peer agents treat as trusted input.
          security_relevant: true
          terminal: false
        resource_links: []
        observable_outcome_links: []
        order: 1
        attacker_controlled: true
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0024 S00
          confidence: 70
          adaptation_rationale: Adapted from AML.CS0024 S00 (researcher access to the GenAI model API behind a single-agent
            RAG email system) to attacker access of a shared multi-agent channel; the multi-agent framing is an adaptation,
            not a direct demonstration.
        mappings:
        - decision: unmapped
          taxonomy: ATLAS
          rationale: Legacy AML.T0040/AML.T0047 technique tags were SSSOM skos:relatedMatch candidates only; catalog-lineage.yaml
            proposes no exact ATLAS identity for channel/store access, and relatedMatch never confers exact.
      - step_id: craft_injection_payload
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: outside
        action_kind: prepare
        consumed: []
        produced:
        - kind: artifact
          ref_id: artifact.injection_payload
          value_type: string
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.payload_ready
          description: Messages carrying prompt injections designed to shift recipients' reasoning are ready for delivery
            into the inter-agent channel.
          security_relevant: true
          terminal: false
        resource_links: []
        observable_outcome_links: []
        order: 2
        attacker_controlled: true
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0024 S01
          - reference_type: catalog
            reference_id: AML.T0066
          confidence: 75
          adaptation_rationale: Writing messages designed to be consumed by peer agents and influence them is AML.T0066's
            exact operation; AML.CS0024 S01 (testing prompts on public model APIs) is the adapted case analogue for the crafting
            activity.
        mappings:
        - decision: exact
          taxonomy: ATLAS
          ids:
          - AML.T0066
      - step_id: inject_messages
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: crossing
        action_kind: deliver
        consumed:
        - kind: state
          ref_id: state.channel_access
          value_type: object
        - kind: artifact
          ref_id: artifact.injection_payload
          value_type: string
        produced:
        - kind: state
          ref_id: state.poisoned_channel
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.messages_resident
          description: The crafted messages reside in the shared inter-agent channel where peer agents consume channel content
            as trusted input.
          security_relevant: true
          terminal: false
        resource_links:
        - slot_id: ingress
          role: ingress
          trust_boundary_slot_id: null
          target_ingress_slot_id: null
        observable_outcome_links:
        - postcondition_id: post.messages_resident
          observation: persistent_state
          binding_slot_id: message_channel
        order: 3
        attacker_controlled: true
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0024 S02
          confidence: 75
          adaptation_rationale: AML.CS0024 S02 (the worm email sent to the target system and stored in its RAG database) is
            the adapted analogue for injecting crafted messages into a shared channel consumed by multiple agents.
        mappings:
        - decision: unmapped
          taxonomy: ATLAS
          rationale: The indirect-injection identity of this delivery is asserted once at chain scope (AML.T0051.001) per
            catalog-lineage.yaml; no separate step-level exact mapping is proposed.
      - step_id: persist_in_shared_store
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: crossing
        action_kind: persist
        consumed:
        - kind: state
          ref_id: state.poisoned_channel
          value_type: object
        produced:
        - kind: state
          ref_id: state.persisted_injection
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.injection_persistent
          description: The injected prompts persist in the shared data structure and remain available to future peer-agent
            queries and reasoning.
          security_relevant: true
          terminal: false
        resource_links: []
        observable_outcome_links:
        - postcondition_id: post.injection_persistent
          observation: persistent_state
          binding_slot_id: message_channel
        order: 4
        attacker_controlled: true
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0024 S02
          - reference_type: catalog
            reference_id: AML.T0093
          confidence: 70
          adaptation_rationale: Introducing the prompts into the shared store so they are ingested by agents later is AML.T0093's
            defined prompt-infiltration operation; AML.CS0024 S02-S03 is the adapted analogue (a single-agent RAG store generalized
            to a shared multi-agent store).
        mappings:
        - decision: exact
          taxonomy: ATLAS
          ids:
          - AML.T0093
      - step_id: activate_in_peer_agents
        requirement: required
        condition: null
        executor_role: system
        boundary_position: inside
        action_kind: invoke
        consumed:
        - kind: state
          ref_id: state.persisted_injection
          value_type: object
        produced:
        - kind: state
          ref_id: state.peer_reasoning_influence
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.injection_active
          description: Peer agents consume the persisted messages and the injected instructions influence their reasoning
            processes.
          security_relevant: true
          terminal: false
        resource_links: []
        observable_outcome_links:
        - postcondition_id: post.injection_active
          observation: persistent_state
          binding_slot_id: peer_agents
        order: 5
        attacker_controlled: false
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0024 S03
          confidence: 70
          adaptation_rationale: AML.CS0024 S03 (retrieval-triggered injection changing the assistant's behavior) is the adapted
            analogue; consumption by many peer agents rather than one email assistant is an adaptation, not a direct demonstration.
        mappings:
        - decision: not_applicable
          taxonomy: ATLAS
      - step_id: collective_decision_shift
        requirement: required
        condition: null
        executor_role: system
        boundary_position: inside
        action_kind: impact
        consumed:
        - kind: state
          ref_id: state.peer_reasoning_influence
          value_type: object
        produced:
        - kind: effect
          ref_id: effect.steered_collective_decision
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.steered_decision
          description: 'The collective decision-making of the multi-agent system observably shifts toward attacker-chosen
            objectives: the first observable steered decision.'
          security_relevant: true
          terminal: true
        resource_links: []
        observable_outcome_links:
        - postcondition_id: post.steered_decision
          observation: persistent_state
          binding_slot_id: peer_agents
        order: 6
        attacker_controlled: false
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0024 S04
          - reference_type: design_record
            reference_id: review-t10-t15-t12-t13-t16.md
          confidence: 55
          adaptation_rationale: 'Multi-agent collective effects are adapted, not explicit, per catalog-lineage.yaml: AML.CS0024
            S04 demonstrates compounding propagation in a single-agent system only; no exfiltration phase is claimed.'
        mappings:
        - decision: not_applicable
          taxonomy: ATLAS
      earliest_attacker_controlled_step_id: access_shared_channel
      resource_slots:
      - slot_id: ingress
        kind: entry_point
        purpose: initial_ingress
      - slot_id: message_channel
        kind: integration
        purpose: intermediate
      - slot_id: peer_agents
        kind: integration
        purpose: target
      - slot_id: boundary
        kind: trust_boundary
        purpose: supporting
      initial_ingress_slot_id: ingress
      semantic_digest: 5ddb645c06bb49afd7ad0bee36cb6c73b599085c886cab8fe7e15e97cdbfb4a7
  AP-T12-03:
    id: AP-T12-03
    threat_id: T12
    name: Misinformation cascade via shared knowledge poisoning
    description: An attacker plants false data into a shared knowledge store or message channel used by multiple agents. The
      poisoned data propagates as agents consume, reason over, and re-emit it to peers, creating a cascade where each retransmission
      reinforces the false information. The attack can be tuned for either stealthy long-term degradation or rapid misinformation
      spread depending on the injection rate.
    nist_classification:
      attacker_goal: integrity
      attacker_knowledge: gray_box
      learning_stage: deployment
      attack_class: poisoning.backdoor_poisoning
    prerequisite_capabilities:
      min_zones:
      - input
      - reasoning
      - inter_agent
      kc_requires:
        all:
        - KCX-MAGENT
        any:
        - KC2.3
    canonical_chain:
      schema_version: v1
      pattern_id: AP-T12-03
      chain_id: chain.ap-t12-03.1
      semantic_revision: 1
      taxonomy_context:
        atlas:
          release: '2026.05'
          digest: defd9014c6d5f5954460ef438faea583fcb1830ff81e85709628efb43037cc3a
        mapping_set_digest: 29ff3a15a86a194812e029ba407a97a757c98a2d887fb922ea4f0e0a8fd40ea6
      mappings:
      - decision: exact
        taxonomy: ATLAS
        ids:
        - AML.T0070
      steps:
      - step_id: access_knowledge_store
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: outside
        action_kind: prepare
        consumed: []
        produced:
        - kind: state
          ref_id: state.store_access
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.store_accessible
          description: The attacker can reach the shared knowledge store or retrieval system consumed by multiple agents.
          security_relevant: true
          terminal: false
        resource_links: []
        observable_outcome_links: []
        order: 1
        attacker_controlled: true
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0024 S00
          confidence: 70
          adaptation_rationale: Adapted from AML.CS0024 S00 (researcher access to the GenAI model API behind a single-agent
            RAG email system) to attacker access of a shared knowledge store consumed by many agents.
        mappings:
        - decision: unmapped
          taxonomy: ATLAS
          rationale: Legacy AML.T0040/AML.T0047 technique tags were SSSOM skos:relatedMatch candidates only; catalog-lineage.yaml
            proposes no exact ATLAS identity for channel/store access, and relatedMatch never confers exact.
      - step_id: craft_false_data
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: outside
        action_kind: prepare
        consumed: []
        produced:
        - kind: artifact
          ref_id: artifact.false_data
          value_type: string
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.false_data_ready
          description: False data designed to be consumed, reasoned over, and re-emitted by agents is ready for planting.
          security_relevant: true
          terminal: false
        resource_links: []
        observable_outcome_links: []
        order: 2
        attacker_controlled: true
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.T0066
          - reference_type: catalog
            reference_id: AML.CS0025 S02
          confidence: 70
          adaptation_rationale: Writing the false data as content designed to be retrieved and influence consumers is AML.T0066's
            exact operation; AML.CS0025 S02 (creating poisoned replacement data) is a partial analogue for the crafting activity.
        mappings:
        - decision: exact
          taxonomy: ATLAS
          ids:
          - AML.T0066
      - step_id: plant_poisoned_data
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: crossing
        action_kind: deliver
        consumed:
        - kind: state
          ref_id: state.store_access
          value_type: object
        - kind: artifact
          ref_id: artifact.false_data
          value_type: string
        produced:
        - kind: state
          ref_id: state.poisoned_store
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.data_planted
          description: The false data is planted into the shared knowledge store (RAG database, vector store, shared memory)
            indexed for agent retrieval.
          security_relevant: true
          terminal: false
        resource_links:
        - slot_id: ingress
          role: ingress
          trust_boundary_slot_id: null
          target_ingress_slot_id: null
        observable_outcome_links:
        - postcondition_id: post.data_planted
          observation: persistent_state
          binding_slot_id: knowledge_store
        order: 3
        attacker_controlled: true
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0024 S02
          confidence: 75
          adaptation_rationale: AML.CS0024 S02 (adversarial content delivered and stored in the RAG database) is the adapted
            analogue for planting false data into a shared store consumed by many agents.
        mappings:
        - decision: unmapped
          taxonomy: ATLAS
          rationale: The RAG-poisoning identity of this planting is asserted once at chain scope (AML.T0070) per catalog-lineage.yaml;
            no separate step-level exact mapping is proposed.
      - step_id: persist_in_retrieval
        requirement: required
        condition: null
        executor_role: system
        boundary_position: inside
        action_kind: persist
        consumed:
        - kind: state
          ref_id: state.poisoned_store
          value_type: object
        produced:
        - kind: state
          ref_id: state.retrievable_poison
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.poison_persistent
          description: The false data persists in the retrieval system and surfaces when agents query relevant topics.
          security_relevant: true
          terminal: false
        resource_links: []
        observable_outcome_links:
        - postcondition_id: post.poison_persistent
          observation: persistent_state
          binding_slot_id: knowledge_store
        order: 4
        attacker_controlled: false
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0024 S02
          confidence: 70
          adaptation_rationale: Persistence of adversarial content in the retrieval store is demonstrated for a single-agent
            system in AML.CS0024 S02-S03 and adapted here to a shared multi-agent store.
        mappings:
        - decision: not_applicable
          taxonomy: ATLAS
      - step_id: trigger_false_incorporation
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: inside
        action_kind: invoke
        consumed:
        - kind: state
          ref_id: state.retrievable_poison
          value_type: object
        produced:
        - kind: state
          ref_id: state.false_incorporation
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.incorporation_triggered
          description: An agent retrieval surfaces the planted false data and the agent incorporates the false information
            into its reasoning as trusted knowledge.
          security_relevant: true
          terminal: false
        resource_links: []
        observable_outcome_links:
        - postcondition_id: post.incorporation_triggered
          observation: persistent_state
          binding_slot_id: peer_agents
        order: 5
        attacker_controlled: true
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0024 S03
          confidence: 60
          adaptation_rationale: AML.CS0024 S03 demonstrates retrieval-triggered incorporation, but there the retrieved content
            is an injected instruction (AML.T0051.002); in this record the planted content is false data, not an instruction,
            so retrieval-triggered incorporation is not AML.T0051.002's triggered prompt-injection operation and the analogue
            is partial only.
        mappings:
        - decision: unmapped
          taxonomy: ATLAS
          rationale: 'catalog-lineage.yaml''s atlas_step_mappings entry proposing AML.T0051.002 for this step is a false exact
            identity: retrieval of false data is not a triggered prompt injection (no injected instruction fires), so exact
            is removed fail-closed rather than retained for lineage equality; the lineage entry requires amendment (remove/downgrade
            trigger_false_incorporation -> AML.T0051.002). The chain-scope AML.T0070 identity is unaffected.'
      - step_id: cascade_propagation
        requirement: required
        condition: null
        executor_role: system
        boundary_position: inside
        action_kind: persist
        consumed:
        - kind: state
          ref_id: state.false_incorporation
          value_type: object
        produced:
        - kind: state
          ref_id: state.first_peer_reemission
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.first_reemission
          description: 'An agent that incorporated the false data re-emits it to a first peer through normal outputs: the
            first re-emission event, not yet a multi-peer cascade.'
          security_relevant: true
          terminal: false
        resource_links: []
        observable_outcome_links:
        - postcondition_id: post.first_reemission
          observation: persistent_state
          binding_slot_id: peer_agents
        order: 6
        attacker_controlled: false
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0024 S04
          - reference_type: design_record
            reference_id: review-t10-t15-t12-t13-t16.md
          confidence: 55
          adaptation_rationale: AML.CS0024 S04 demonstrates self-replication of a prompt, not a multi-agent content re-emission
            cascade; the cascade is adapted per catalog-lineage.yaml (the OG-02 content cascade, distinct from AP-T13-04 executable
            replication).
        mappings:
        - decision: not_applicable
          taxonomy: ATLAS
      - step_id: misinformation_impact
        requirement: required
        condition: null
        executor_role: system
        boundary_position: inside
        action_kind: impact
        consumed:
        - kind: state
          ref_id: state.first_peer_reemission
          value_type: object
        produced:
        - kind: effect
          ref_id: effect.misinformation_degradation
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.cascade_observable
          description: 'The re-emitted false information is taken up by additional peers, each retransmission reinforcing
            it, and observably propagates across the agent network, degrading collective decision-making quality: the first
            observable multi-peer cascade.'
          security_relevant: true
          terminal: true
        resource_links: []
        observable_outcome_links:
        - postcondition_id: post.cascade_observable
          observation: persistent_state
          binding_slot_id: peer_agents
        order: 7
        attacker_controlled: false
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0025 S05
          confidence: 50
          adaptation_rationale: Network-wide multi-peer misinformation degradation is adapted, not explicit, per catalog-lineage.yaml;
            AML.CS0025 S05 (integrity erosion from poisoned data at scale) is a partial analogue for degradation outcomes.
        mappings:
        - decision: not_applicable
          taxonomy: ATLAS
      earliest_attacker_controlled_step_id: access_knowledge_store
      resource_slots:
      - slot_id: ingress
        kind: entry_point
        purpose: initial_ingress
      - slot_id: knowledge_store
        kind: integration
        purpose: intermediate
      - slot_id: peer_agents
        kind: integration
        purpose: target
      - slot_id: boundary
        kind: trust_boundary
        purpose: supporting
      initial_ingress_slot_id: ingress
      semantic_digest: 7020c5432e414f85bc8d544a8c62018e4ffaffde680ac19c942c5b8df68aca13
  AP-T15-01:
    id: AP-T15-01
    threat_id: T15
    name: Trust-exploiting content substitution for fraudulent action
    description: An attacker uses indirect prompt injection to manipulate an AI assistant into substituting legitimate operational
      data (such as payment details or contact information) with attacker-controlled values. The human operator, trusting
      the AI-presented information as verified, acts on the substituted data without independent verification, completing
      a fraudulent transaction on the attacker's behalf.
    nist_classification:
      attacker_goal: abuse
      attacker_knowledge: gray_box
      learning_stage: deployment
      attack_class: genai.indirect_prompt_injection.privacy_compromises
    prerequisite_capabilities:
      min_zones:
      - input
      - reasoning
      - tool_execution
      kc_requires:
        any:
        - KC6.1.1
        - KC6.1.2
        - KC6.2.1
        - KC6.2.2
        - KC6.3.1
        - KC6.3.2
        - KC6.4
        - KC6.5
        - KC6.6
        - KC6.7
    canonical_chain:
      schema_version: v1
      pattern_id: AP-T15-01
      chain_id: chain.ap-t15-01.1
      semantic_revision: 1
      taxonomy_context:
        atlas:
          release: '2026.05'
          digest: defd9014c6d5f5954460ef438faea583fcb1830ff81e85709628efb43037cc3a
        mapping_set_digest: 29ff3a15a86a194812e029ba407a97a757c98a2d887fb922ea4f0e0a8fd40ea6
      mappings:
      - decision: exact
        taxonomy: ATLAS
        ids:
        - AML.T0051.001
      steps:
      - step_id: setup
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: outside
        action_kind: prepare
        consumed: []
        produced:
        - kind: artifact
          ref_id: artifact.substitution_content
          value_type: string
