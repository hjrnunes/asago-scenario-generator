  AP-T1-02:
    id: AP-T1-02
    threat_id: T1
    name: Context window saturation for privilege escalation
    description: 'Fragment a privilege-escalation attempt across multiple turns within a session so each
      fragment stays below detection thresholds and the agent cumulatively loses track of prior authorization
      state, granting access it should deny. Strictly ephemeral: no cross-session persistence (that is
      AP-T1-01''s mechanism).'
