              security_relevant: false
              terminal: false
          resource_links: []
          observable_outcome_links: []
          order: 2
          attacker_controlled: true
          provenance:
            tier: "observed"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0026"
              - reference_type: "design_record"
                reference_id: "staging/tactic-sequences-t3-t9.md"
            confidence: 90
            adaptation_rationale: >
              Explicit in AML.CS0026 (S04-S05: targeted content and
