    id: "AP-T9-07"
    threat_id: "T9"
    name: "Agent data destruction via stolen identity"
    description: >
      An attacker, operating under an agent's stolen service identity,
      destroys the agent's data (chats) through its own mutative
      capabilities as an independent post-compromise operation. Split
      from AP-T9-02 per catalog-lineage OG-07: disruption is not a
      consequence of impersonation but a distinct mechanism. Narrowed to
