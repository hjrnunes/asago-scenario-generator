        - step_id: "deliver_payload"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "crossing"
          action_kind: "deliver"
          consumed:
            - kind: "artifact"
              ref_id: "payload.attribution_hijack"
              value_type: "object"
          produced:
            - kind: "state"
              ref_id: "channel.payload_delivered"
              value_type: "boolean"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.deliver_payload"
              description: >
                The crafted content reaches a data channel the agent
                consumes (email, document, message).
              security_relevant: false
              terminal: false
          resource_links:
          - slot_id: ingress
            role: ingress
            trust_boundary_slot_id: null
            target_ingress_slot_id: null
          observable_outcome_links:
          - postcondition_id: post.deliver_payload
            observation: model_context
            binding_slot_id: ingress
          order: 3
          attacker_controlled: true
          provenance:
            tier: "observed"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0026"
              - reference_type: "design_record"
                reference_id: "staging/review-t3-t9.md"
            confidence: 90
            adaptation_rationale: >
              Explicit in AML.CS0026 (S06 delivery of the crafted email);
              the lineage records delivery as explicit in the corrected
              confidence split.
          mappings:
            - decision: "unmapped"
              taxonomy: "ATLAS"
              rationale: >
                Channel delivery has no approved exact mapping for this
                record; the legacy AML.T0093 candidate remains provenance
                only.
        - step_id: "inject_instructions"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "crossing"
          action_kind: "invoke"
          consumed:
            - kind: "state"
              ref_id: "channel.payload_delivered"
              value_type: "boolean"
          produced:
            - kind: "state"
              ref_id: "agent.injected_instructions"
              value_type: "object"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.inject_instructions"
              description: >
                The injected instructions are ingested by the agent and
