            binding_slot_id: delegated_capability
          order: 5
          attacker_controlled: false
          provenance:
            tier: "variant"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0026"
              - reference_type: "design_record"
                reference_id: "staging/review-t3-t9.md"
            confidence: 75
            adaptation_rationale: >
              Adapted from AML.CS0026 (S10-S11: the injection executes and
