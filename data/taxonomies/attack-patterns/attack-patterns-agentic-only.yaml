  AP-T9-02:
    id: "AP-T9-02"
    threat_id: "T9"
    name: "Agent identity spoofing via compromised service credentials"
    description: >
      An attacker compromises the host running an AI agent, extracts the
      agent's service credentials (authentication tokens) from process
      memory, and immediately uses them to operate as the legitimate agent:
      authenticating to its backend, accessing its conversations, and
      injecting prompts while the activity appears to originate from the
      agent. Owns the credential-impersonation mechanism within
      catalog-lineage OG-07: immediate stolen-credential use, not durable
      cross-session identity control (AP-T9-06) and not availability
      disruption through data deletion or rate-limit exhaustion (AP-T9-07,
      split from this source).
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]
    canonical_chain:
      schema_version: "v1"
      pattern_id: "AP-T9-02"
      chain_id: "chain.AP-T9-02"
      semantic_revision: 1
      semantic_digest: "70579c2f0f903b12bb8335ff35c66f75f72f0de335ecc1bd487e2e0d56bb9c7e"
      taxonomy_context:
        atlas:
          release: "2026.05"
          digest: "defd9014c6d5f5954460ef438faea583fcb1830ff81e85709628efb43037cc3a"
        mapping_set_digest: "29ff3a15a86a194812e029ba407a97a757c98a2d887fb922ea4f0e0a8fd40ea6"
      mappings:
        - decision: "exact"
          taxonomy: "ATLAS"
          ids: [AML.T0091.000]
      earliest_attacker_controlled_step_id: "initial_access"
      initial_ingress_slot_id: "ingress"
