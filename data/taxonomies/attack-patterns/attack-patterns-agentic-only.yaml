# Canonical attack patterns for asago-scenario-generator (agentic-only threats: T8/T9/T10/T14/T16).
# Migrated to the authoritative canonical-chain v1 contract per
# catalog-lineage.yaml v1.0.0 (final authoritative dispositions).
#
# Dispositions implemented (19 historical sources -> 9 resulting records):
#   retain: AP-T10-01, AP-T9-01
#   narrow: AP-T8-01, AP-T9-05, AP-T9-06, AP-T16-02, AP-T16-03
#   split:  AP-T9-02 -> AP-T9-02 (credential impersonation) + AP-T9-07
#           (availability disruption)
#   defer (removed from the live catalog; re-entry only via the lineage
#          reentry_conditions): AP-T8-02, AP-T8-03, AP-T9-03, AP-T9-04,
#          AP-T10-02, AP-T10-03, AP-T14-01, AP-T14-02, AP-T14-03, AP-T14-04,
#          AP-T16-01
#
# Authority: MITRE ATLAS 2026.05 is the sole v1 mapping authority (LAAF
# absent). SSSOM skos:relatedMatch rows in
# attack-patterns-agentic-only.sssom.tsv are candidate-only migration
# provenance and never confer exact-mapping authority. Each record carries
# one pure branch-free total-order canonical chain with typed
# conditions/actions/resources and role-sensitive ATLAS mapping decisions
# (exact identities only where the lineage approved them; otherwise honest
# unmapped rationale). The legacy kill_chain field is removed.

source:
  name: "asago-scenario-generator abstract attack patterns (agentic-only)"
  version: "1.0.0"
  derived_from:
    - "OWASP Agentic AI Threats & Mitigations v1.1"
    - "NIST AI 100-2e2023"
    - "MITRE ATLAS 2026.05 (sole v1 mapping authority)"
  lineage: "catalog-lineage.yaml v1.0.0"

patterns:
  # ═══════════════════════════════════════════════════════════════════
  # T8 — Repudiation & Untraceability (1 of 3 sources survives)
  # OG-08: owns selective manipulation of the agent-visible
  # conversation/action record (AML.T0092 identity). AP-T8-02 and AP-T8-03
  # are deferred (no defensible exact ATLAS chain); the broader
  # logging-infrastructure mechanism is explicitly out of scope for v1.
  # ═══════════════════════════════════════════════════════════════════

  AP-T8-01:
    id: "AP-T8-01"
    threat_id: "T8"
    name: "Audit record manipulation via selective action-record alteration"
    description: >
      An attacker obtains the victim's authentication tokens for an AI
      agent's agent-visible conversation/action record and edits, deletes,
      or fabricates entries so that unauthorized actions are absent from
      the record reviewers rely on. The attack exploits the update/access
      gaps of that record, creating a divergence between what the agent
      did and what the record reflects. Narrowed scope per catalog-lineage
      OG-08: the agent-visible action record, not general logging
      infrastructure; record access is acquired through credential theft
      only.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        all: [KCX-AUDIT]
        any: [KC1.1, KC1.2, KC1.3, KC1.4]
    canonical_chain:
      schema_version: "v1"
      pattern_id: "AP-T8-01"
      chain_id: "chain.AP-T8-01"
      semantic_revision: 1
      semantic_digest: "315810ce74dafff6c4269b0322ab45d2359465000de7e0505c934bb2aeca5d68"
      taxonomy_context:
        atlas:
          release: "2026.05"
          digest: "defd9014c6d5f5954460ef438faea583fcb1830ff81e85709628efb43037cc3a"
        mapping_set_digest: "29ff3a15a86a194812e029ba407a97a757c98a2d887fb922ea4f0e0a8fd40ea6"
      mappings:
        - decision: "exact"
          taxonomy: "ATLAS"
          ids: [AML.T0092]
      earliest_attacker_controlled_step_id: "obtain_record_access"
      initial_ingress_slot_id: "ingress"
      resource_slots:
        - slot_id: "ingress"
          kind: "entry_point"
          purpose: "initial_ingress"
        - slot_id: "action_record"
          kind: "integration"
          purpose: "target"
        - slot_id: "boundary"
          kind: "trust_boundary"
          purpose: "supporting"
      steps:
        - step_id: "obtain_record_access"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "crossing"
          action_kind: "invoke"
          consumed: []
          produced:
            - kind: "state"
              ref_id: "access.record_surface"
              value_type: "boolean"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.obtain_record_access"
              description: >
                The attacker holds the victim's authentication tokens
                permitting alteration of the agent's conversation/action
                record.
              security_relevant: false
              terminal: false
          resource_links:
          - slot_id: ingress
            role: ingress
            trust_boundary_slot_id: null
            target_ingress_slot_id: null
          observable_outcome_links:
          - postcondition_id: post.obtain_record_access
            observation: persistent_state
            binding_slot_id: action_record
          order: 1
          attacker_controlled: true
          provenance:
            tier: "designed"
            references:
              - reference_type: "catalog"
                reference_id: "ATLAS-2026.05:AML.T0055"
              - reference_type: "catalog"
                reference_id: "ATLAS-2026.05:AML.T0092"
              - reference_type: "catalog"
                reference_id: "AML.CS0036"
              - reference_type: "design_record"
                reference_id: "catalog-lineage.yaml:AP-T8-01"
            confidence: 65
            adaptation_rationale: >
              Designed from the pinned AML.T0092 precondition (record
              alteration requires the victim's authentication tokens)
              paired with AML.T0055's exact credential-obtaining operation;
              record access is acquired through credential acquisition
              only — no direct-interface alternative is claimed for this
              record. AML.CS0036 is a partial enabling analogy for
              credential access only, not evidence of audit manipulation;
              no legacy chain existed for this record.
          mappings:
            - decision: "exact"
              taxonomy: "ATLAS"
              ids: [AML.T0055]
        - step_id: "enumerate_record_entries"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "inside"
          action_kind: "observe"
          consumed:
            - kind: "state"
              ref_id: "access.record_surface"
              value_type: "boolean"
          produced:
            - kind: "artifact"
              ref_id: "recon.target_record_entries"
              value_type: "object"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.enumerate_record_entries"
              description: >
                The record entries that evidence the unauthorized actions
                are located within the agent's action record.
              security_relevant: false
              terminal: false
          resource_links: []
          observable_outcome_links:
          - postcondition_id: post.enumerate_record_entries
            observation: persistent_state
            binding_slot_id: action_record
          order: 2
          attacker_controlled: true
          provenance:
            tier: "designed"
            references:
              - reference_type: "catalog"
                reference_id: "ATLAS-2026.05:AML.T0092"
              - reference_type: "design_record"
                reference_id: "catalog-lineage.yaml:AP-T8-01"
            confidence: 55
            adaptation_rationale: >
              Designed enumeration of the record surface implied by the
              pinned AML.T0092 operation (the adversary must locate the
              incriminating messages or threads before altering them); no
              case-study evidence exists for this step.
          mappings:
            - decision: "unmapped"
              taxonomy: "ATLAS"
              rationale: >
                No pinned technique defines locating track-evidencing
                entries within an agent's conversation/action record;
                AML.T0092 covers the alteration operation itself (chain-level
                identity), so this designed step stays honestly unmapped.
        - step_id: "manipulate_action_record"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "inside"
          action_kind: "transform"
          consumed:
            - kind: "artifact"
              ref_id: "recon.target_record_entries"
              value_type: "object"
          produced:
            - kind: "state"
              ref_id: "record.selectively_altered"
              value_type: "boolean"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.manipulate_action_record"
              description: >
                Targeted entries in the agent's action record are edited,
                deleted, or fabricated so the unauthorized actions are no
                longer represented.
              security_relevant: true
              terminal: false
          resource_links: []
          observable_outcome_links:
          - postcondition_id: post.manipulate_action_record
            observation: persistent_state
            binding_slot_id: action_record
          order: 3
          attacker_controlled: true
          provenance:
            tier: "designed"
            references:
              - reference_type: "catalog"
                reference_id: "ATLAS-2026.05:AML.T0092"
              - reference_type: "design_record"
                reference_id: "catalog-lineage.yaml:AP-T8-01"
            confidence: 65
            adaptation_rationale: >
              Designed from the pinned AML.T0092 definition (delete or edit
              existing messages or create new threads to cover tracks),
              narrowed to the agent-visible action record per lineage OG-08;
              no case demonstrates this operation against general logging
              infrastructure.
          mappings:
            - decision: "unmapped"
              taxonomy: "ATLAS"
              rationale: >
                The selective edit/delete/fabricate operation is the
                chain-level AML.T0092 identity (manipulate user LLM chat
                history to cover tracks); the exact identity is recorded at
                chain scope per catalog-lineage AP-T8-01 and not duplicated
                at step scope.
        - step_id: "record_divergence_outcome"
          requirement: "required"
          condition: null
          executor_role: "system"
          boundary_position: "inside"
          action_kind: "impact"
          consumed:
            - kind: "state"
              ref_id: "record.selectively_altered"
              value_type: "boolean"
          produced:
            - kind: "effect"
              ref_id: "impact.audit_record_divergence"
              value_type: "boolean"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.record_divergence_outcome"
              description: >
                The action record served to reviewers no longer reflects the
                unauthorized action: the first observable divergence between
                performed and recorded behavior.
              security_relevant: true
              terminal: true
          resource_links: []
          observable_outcome_links:
          - postcondition_id: post.record_divergence_outcome
            observation: persistent_state
            binding_slot_id: action_record
          order: 4
          attacker_controlled: false
          provenance:
            tier: "inferred"
            references:
              - reference_type: "catalog"
                reference_id: "ATLAS-2026.05:AML.T0092"
              - reference_type: "design_record"
                reference_id: "catalog-lineage.yaml:AP-T8-01"
            confidence: 55
            adaptation_rationale: >
              Inferred terminal outcome of the designed AML.T0092 mechanism:
              the cover-tracks effect defined by the technique, restated as
              the observable record/reality divergence the lineage terminal
              semantics require.
          mappings:
            - decision: "not_applicable"
              taxonomy: "ATLAS"

  # ═══════════════════════════════════════════════════════════════════
  # T9 — Identity Spoofing & Impersonation (6 of 6 sources resolved:
  # 5 surviving records including the AP-T9-02 split child AP-T9-07;
  # AP-T9-03 and AP-T9-04 deferred)
  # ═══════════════════════════════════════════════════════════════════

  AP-T9-01:
    id: "AP-T9-01"
    threat_id: "T9"
    name: "User impersonation via agent action attribution hijacking"
    description: >
      An attacker injects instructions into an agent that has delegated
      action capabilities (such as sending messages or initiating
      transactions), causing it to perform actions attributed to a
      legitimate user. The attack hijacks an existing user-to-agent
      delegation path, exploiting the attribution layer rather than
      defeating identity proofing; the proofing-layer mechanism is AP-T9-05
      (catalog-lineage OG-06).
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        any: [KC2.2, KC2.3, KC6.1.2]
    canonical_chain:
      schema_version: "v1"
      pattern_id: "AP-T9-01"
      chain_id: "chain.AP-T9-01"
      semantic_revision: 1
      semantic_digest: "d12ea09f44848d4092356f4574ab6d8d1e031e116101cf1e73112aa04869e28b"
      taxonomy_context:
        atlas:
          release: "2026.05"
          digest: "defd9014c6d5f5954460ef438faea583fcb1830ff81e85709628efb43037cc3a"
        mapping_set_digest: "29ff3a15a86a194812e029ba407a97a757c98a2d887fb922ea4f0e0a8fd40ea6"
      mappings:
        - decision: "exact"
          taxonomy: "ATLAS"
          ids: [AML.T0053]
      earliest_attacker_controlled_step_id: "discover_capabilities"
      initial_ingress_slot_id: "ingress"
      resource_slots:
        - slot_id: "ingress"
          kind: "entry_point"
          purpose: "initial_ingress"
        - slot_id: "delegated_capability"
          kind: "tool"
          purpose: "target"
        - slot_id: "boundary"
          kind: "trust_boundary"
          purpose: "supporting"
      steps:
        - step_id: "discover_capabilities"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "outside"
          action_kind: "observe"
          consumed: []
          produced:
            - kind: "artifact"
              ref_id: "recon.capability_attribution_model"
              value_type: "object"
          preconditions: []
          observable_postconditions:
            - postcondition_id: "post.discover_capabilities"
              description: >
                The agent's delegated action capabilities (messaging,
                transactions) and its action attribution model are known to
                the attacker.
              security_relevant: false
              terminal: false
          resource_links: []
          observable_outcome_links: []
          order: 1
          attacker_controlled: true
          provenance:
            tier: "variant"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0026"
              - reference_type: "design_record"
                reference_id: "staging/review-t3-t9.md"
            confidence: 75
            adaptation_rationale: >
              Adapted from AML.CS0026's discovery behavior (S02-S03):
              reframed from enterprise-plugin enumeration to discovery of the
              delegation/attribution model, per the corrected confidence
              split in review-t3-t9.md.
          mappings:
            - decision: "unmapped"
              taxonomy: "ATLAS"
              rationale: >
                Discovery of a delegation/attribution surface has no
                approved exact technique identity for this record; the
                legacy AML.T0084-family candidates remain SSSOM relatedMatch
                provenance only and are not weakly mapped.
        - step_id: "craft_attribution_hijack"
          requirement: "required"
          condition: null
          executor_role: "attacker"
          boundary_position: "outside"
          action_kind: "prepare"
          consumed:
            - kind: "artifact"
              ref_id: "recon.capability_attribution_model"
              value_type: "object"
          produced:
