              security_relevant: true
              terminal: false
          resource_links: []
          observable_outcome_links:
          - postcondition_id: post.inject_instructions
            observation: model_context
            binding_slot_id: ingress
          order: 4
          attacker_controlled: true
          provenance:
            tier: "observed"
            references:
              - reference_type: "catalog"
                reference_id: "AML.CS0026"
              - reference_type: "design_record"
                reference_id: "catalog-lineage.yaml:AP-T9-01"
            confidence: 90
            adaptation_rationale: >
              The hijack instructions arrive through content the agent
              ingests (AML.CS0026's poisoned retrieval, S05-S09 analogue):
