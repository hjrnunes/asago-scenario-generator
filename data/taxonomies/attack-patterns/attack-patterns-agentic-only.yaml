  AP-T16-02:
    id: "AP-T16-02"
    threat_id: "T16"
    name: "Context hijacking via crafted protocol response injection"
    description: >
      An attacker crafts a server-side response within an inter-agent
      protocol implementation, injecting malicious context or tool metadata
      into the response payload served to the receiving agent. The
      receiving agent interprets the injected content as trusted protocol
      context and executes unintended operations, because the protocol's
      trust model does not validate the semantic integrity of response
      content beyond structural conformance. Owns the crafted semantic
      response-payload mechanism only; transport-level interception is an
      alternative delivery path outside this record (AP-T12-04's boundary)
      and registry-metadata deception is AP-T16-03 (catalog-lineage).
