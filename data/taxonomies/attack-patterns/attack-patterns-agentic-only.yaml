  AP-T16-03:
    id: "AP-T16-03"
    threat_id: "T16"
    name: "Tool capability misrepresentation via registry description poisoning"
    description: >
      An attacker embeds misleading or adversarially crafted tool
      descriptions in a shared tool registry or protocol metadata store.
      When a consuming agent selects and invokes the tool based on its
      description, it operates under false assumptions about the tool's
      scope and behavior, inadvertently leaking sensitive data or triggering
      privileged operations it would not have authorized with accurate
      metadata. Owns deceptive capability metadata only: the mechanism is
      the altered description changing selection and authorization — no
      hidden code, tool installation, or prompt injection is modeled.
      Hidden malicious code without deceptive metadata is supply-chain
      poisoning (AP-T17-03 boundary, catalog-lineage).
