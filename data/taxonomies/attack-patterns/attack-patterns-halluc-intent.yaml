    name: Progressive misinformation accumulation in persistent memory
    description: Inject subtly false factual information that the agent stores in long-term memory and subsequently treats
      as authoritative source material, so successive interactions compound the distortion. Owns the recursive factual-misinformation
      effect within OG-01; operational-rule override belongs to AP-T1-01. Autonomous hallucination without adversarial seeding
      is excluded.
    nist_classification:
      attacker_goal: integrity
      attacker_knowledge: black_box
      learning_stage: deployment
      attack_class: genai.indirect_prompt_injection.integrity_violations
    prerequisite_capabilities:
