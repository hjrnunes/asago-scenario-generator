# Canonical attack patterns (Batch B: T5/T6/T11/T13) - migrated to the
# authoritative canonical-chain contract (asago_scenario_generator.models.attack_pattern).
#
# This file implements the final catalog-lineage dispositions for its sixteen
# historical source records (data/taxonomies/attack-patterns/catalog-lineage.yaml):
# 5 retain, 7 narrow, 4 defer.  Deferred records (AP-T5-03, AP-T13-01, AP-T13-02,
# AP-T13-03) produce no live catalog record and are removed.  Each remaining
# pattern carries one branch-free, total-order canonical chain with honest typed
# semantics, capability preconditions, resource slots, explicit step linkage,
# per-step provenance tiers, and ATLAS-only mapping decisions with the lineage's
# exact operational identities.  Legacy kill_chain/evidence fields are removed.
#
# Authority: ATLAS is the sole v1 taxonomy authority (LAAF absent: laaf pin is
# null and any LAAF decision would fail closed).  SSSOM skos:relatedMatch rows
# in attack-patterns-halluc-intent.sssom.tsv remain migration candidate
# provenance only and confer no mapping authority.

