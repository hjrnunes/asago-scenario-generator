      consuming those outputs replicate the backdoor into their own reasoning. Owns the self-replicating executable-logic
      mechanism within OG-09 up to first peer replication; network-wide persistence is a downstream consequence, not this
      record's mechanism. Crafted message content that semantically influences peer agents' decisions belongs to AP-T12-01.
