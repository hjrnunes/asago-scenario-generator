      kind: entry_point
      purpose: initial_ingress
    - slot_id: memory_store
      kind: integration
      purpose: target
    - slot_id: boundary
      kind: trust_boundary
      purpose: supporting
    provenance_plan: Adapt the 7-step legacy chain with all steps explicit against AML.CS0040
      S00-S06 (verified by qa-audit-t1-t5.md); keep the obfuscation step as its own defense-evasion
      step per the review-t1-t5.md wording correction; impact remains inferred.
    atlas_chain_mappings:
    - id: AML.T0080.000
      operational_identity_rationale: Injecting the fabricated rule into the agent's persistent
        memory so it steers future sessions is AML.T0080.000's exact defined operation (manipulate
        LLM memory to persist changes to future chat sessions, including memories with malicious
        instructions).
      evidence: AML.CS0040 S04; pinned technique definition AML.T0080.000.
    - id: AML.T0051.001
      operational_identity_rationale: 'The rule is delivered through content the agent ingests
        rather than typed by the adversary: AML.T0051.001''s defined indirect injection operation.'
      evidence: AML.CS0040 S02-S03; pinned technique definition AML.T0051.001.
    atlas_step_mappings:
    - step: conceal_injection
      id: AML.T0068
      operational_identity_rationale: Hiding the injected rule inside innocuous-looking content
        is AML.T0068's prompt-obfuscation operation.
      evidence: AML.CS0040 S01; pinned technique definition AML.T0068.
    - step: persist_in_memory
      id: AML.T0080.000
      operational_identity_rationale: Writing the false rule into persistent memory is the
        memory-manipulation operation itself.
      evidence: AML.CS0040 S04.
