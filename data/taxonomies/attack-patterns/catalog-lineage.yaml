disposition_vocabulary:
  retain: 'The source record is operationally sound as authored: one mechanism, defensible
    exact ATLAS chain and attacker-step mappings, and evidence honest enough to carry into
    the authoring wave with only documented wording/tier corrections.'
  narrow: 'The source record is retained with an explicitly narrowed mechanism boundary: some
    originally claimed scope, delivery alternation, or evidence confidence is removed so exactly
    one mechanism with defensible exact mappings remains.'
  split: The source record contains two or more materially distinct mechanisms that cannot
    share one branch-free total-order chain; it is replaced by two or more resulting records,
    each owning one mechanism. The first resulting record (causal mechanism order) continues
    the source id; subsequent records take the lowest unused NN in the source threat family.
  supersede: The source record is replaced by one or more differently identified resulting
    records because its own framing is not salvageable; the explicit mapping from the retired
    source id to its successors is recorded in resulting_patterns.
  retire: 'The source record is permanently removed from the authoritative v1 line: no attacker-controlled
    start exists in its described mechanism, or no defensible exact ATLAS chain and attacker-step
    mapping exists and none is expected under the current taxonomy. No resulting record is
    created.'
  defer: The source record describes a plausible attack mechanism but repository evidence
    cannot currently support a qualifying resulting record (no defensible exact ATLAS chain
    and attacker-step mapping). It may re-enter only when the stated re-entry conditions are
    met; never weakly map.
overlap_groups:
- group_id: OG-01
  members:
  - AP-T1-01
  - AP-T5-01
  - AP-T5-04
  resolution: 'Memory-vs-hallucination cluster resolved by effect ownership: AP-T1-01 owns
    injected operational rules that override validation/authorization logic; AP-T5-01 owns
    attacker-planted factual misinformation that compounds through long-term memory reuse;
    AP-T5-04 owns attacker-injected quantitative reference values biasing downstream computation.
    All three require an attacker-seeded injection; autonomous hallucination without adversarial
    seeding is excluded from every member.'
- group_id: OG-02
  members:
  - AP-T1-04
  - AP-T12-03
  resolution: 'Shared-state poisoning cluster resolved by substrate vs content: AP-T1-04 owns
    corruption of the shared memory/retrieval substrate itself so consuming agents inherit
    the poisoned state; AP-T12-03 owns the content-level misinformation cascade in which agents
    consume, reason over, and re-emit the planted false data to peers.'
- group_id: OG-03
  members:
  - AP-T2-05
  - AP-T6-03
  resolution: 'Poisoned-retrieval cluster resolved by cataloged core effect: AP-T2-05 owns
    retrieved adversarial content causing unsafe or unauthorized tool invocation; AP-T6-03
    owns goal redirection/data-instruction confusion in which the poisoned output is adopted
    as the agent''s operational objective.'
- group_id: OG-04
  members:
  - AP-T2-06
  - AP-T6-02
  resolution: 'Direct-injection hijack cluster resolved on one axis: AP-T6-02 owns the instruction-authority
    override mechanism (discard original directives, adopt the attacker-specified sequence);
    AP-T2-06 owns the tool-execution hijack (which tool runs what attacker-chosen command),
    narrowed to the direct-delivery vector. Both draw on AML.CS0016 for distinct phases.'
- group_id: OG-05
  members:
  - AP-T4-02
  - AP-T13-03
  - AP-T14-03
  resolution: 'Flooding cluster resolved by flood source and objective; all three members
    are deferred with the boundary preserved for re-entry: AP-T4-02 would own externally triggered
    fan-out of benign agents into concurrent expensive work; AP-T13-03 would own colluding
    compromised agents flooding shared scheduling/compute; AP-T14-03 would own saturation
    of security-function agents to open a detection blind window.'
- group_id: OG-06
  members:
  - AP-T9-01
  - AP-T9-05
  resolution: 'Attribution cluster resolved by layer: AP-T9-01 owns hijacking an existing
    user-to-agent delegation path so actions are attributed to the legitimate user, without
    defeating identity proofing; AP-T9-05 owns the proofing-layer mechanism (weak identity
    proofing defeated with spoofed/proxied identity material) whose defining outcome is the
    false attribution trail.'
- group_id: OG-07
  members:
  - AP-T9-02
  - AP-T9-06
  resolution: 'Stolen-identity cluster resolved by durability: AP-T9-02 owns immediate use
    of the agent''s stolen service credentials to operate as the agent; AP-T9-06 owns durable
    takeover via long-lived credential validity plus explicit cross-session persistence through
    session context and memory stores.'
- group_id: OG-08
  members:
  - AP-T8-01
  - AP-T8-02
  - AP-T8-03
  resolution: 'T8 internal trio resolved by audit-surface operation: AP-T8-01 owns selective
    manipulation of the agent''s conversation/action record (edit/delete/fabricate entries
    to cover tracks), the only member with an exact technique identity (AML.T0092); AP-T8-02
    would own prospective minimal-trace interaction crafting and AP-T8-03 systematic audit-integrity
    degradation - both deferred, with the boundary preserved for re-entry.'
- group_id: OG-09
  members:
  - AP-T12-01
  - AP-T13-04
  resolution: 'Inter-agent injection cluster resolved by payload nature: AP-T12-01 owns crafted
    message content that semantically influences peer agents'' decisions; AP-T13-04 owns self-replicating
    executable/backdoor logic carried in agent outputs that peers replicate into their own
    reasoning.'
- group_id: OG-10
  members:
  - AP-T12-02
  - AP-T14-01
  - AP-T14-04
  resolution: 'Trust/endorsement cluster resolved by failure locus; all three members are
    deferred with the boundary preserved for re-entry: AP-T12-02 would own forged consensus/validation
    messages accepted as peer endorsements; AP-T14-01 would own compromise of the inter-agent
    identity/authentication/endorsement chain; AP-T14-04 would own compositional validation
    failure (locally valid partial checks combining into an unauthorized approval).'
- group_id: OG-11
  members:
  - AP-T13-02
  - AP-T14-02
  resolution: 'Orchestration-authorization cluster resolved by structure; both members are
    deferred with the boundary preserved for re-entry: AP-T13-02 would own static request
    fragmentation across low-privilege approvers assembled into an unauthorized whole; AP-T14-02
    would own the cyclic delegation feedback loop that incrementally accumulates implicit
    trust.'
