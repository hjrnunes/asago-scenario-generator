  - pattern_id: AP-T1-01
    source_file: attack-patterns-memory-tool.yaml
    mechanism_boundary: Repeatedly reinforce a false operational rule in the agent's persistent
      memory until the agent treats it as established fact, so the fabricated rule overrides
      legitimate validation logic and authorizes actions that violate actual constraints.
      Owns the operational-rule/authorization-override effect within OG-01; factual-content
      compounding belongs to AP-T5-01.
    start_semantics: 'Attacker crafts and conceals the rule-injection payload: the earliest
      causally necessary attacker-controlled action (CS0040 S00).'
    terminal_semantics: 'The agent acts on the entrenched false rule and authorizes an action
      violating its real constraints: the first observable authorization-override outcome.'
