          - reference_type: design_record
            reference_id: owasp-llm-top10-2025:LLM02
          - reference_type: catalog
            reference_id: AML.T0057
          confidence: 60
          adaptation_rationale: 'Constructed step: the disclosure is the first observable effect in the system''s response;
            the chain stops there because exfiltration channels belong to other records.'
        mappings:
        - decision: not_applicable
          taxonomy: ATLAS
      earliest_attacker_controlled_step_id: craft_elicitation_prompt
      resource_slots:
