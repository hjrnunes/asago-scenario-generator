            reference_id: AML.T0057
          - reference_type: design_record
            reference_id: owasp-llm-top10-2025:LLM02
          confidence: 65
          adaptation_rationale: 'Constructed step: submitting the crafted prompt through the conversational entry point is
            the operation AML.T0057 defines (prompts that induce the model to leak sensitive information); pinned technique
            definition AML.T0057.'
        mappings:
        - decision: exact
          taxonomy: ATLAS
          ids:
          - AML.T0057
      - step_id: disclose_sensitive_data
        requirement: required
        condition: null
        executor_role: system
        boundary_position: crossing
