# Single-session conversational attack patterns.
#
# Each record covers an attack that needs only a language model reachable
# through a direct conversational entry point: no tools, retrieval, or
# persistent memory. They fill OWASP LLM categories that no other catalog
# record realizes without those capabilities: sensitive-information
# disclosure (LLM02), system prompt leakage (LLM07), jailbreak for
# prohibited content (LLM01), and misinformation through fabricated
# references (LLM09). The reviewed category pairing for each record lives in
# data/taxonomies/mappings/llm-to-attack-pattern.yaml.
#
# These records have no legacy source and no entry in catalog-lineage.yaml.
# Chains are branch-free and carry designed-tier provenance: each chain's
# exact ATLAS identity is the operation that the pinned technique definition
# describes. ATLAS is the sole taxonomy authority (LAAF absent), and the
# SSSOM mapping set carries no row for these records.

source:
  name: asago-scenario-generator single-session conversational attack patterns
  version: 1.0.0
  derived_from:
  - MITRE ATLAS 2026.05 (sole v1 taxonomy authority)
  - OWASP Top 10 for LLM Applications 2025
patterns:
  AP-T6-08:
    id: AP-T6-08
    threat_id: T6
    name: Conversational sensitive-data elicitation
    description: 'Ask the system questions designed to make the model reveal sensitive information that it holds or can reach,
      such as another user''s records, credentials, personal data, or proprietary content, by claiming authority, asserting
      a pretext, or splitting the request into innocuous parts. The attack stays inside one conversation and needs no tool,
      retrieval source, or memory beyond what the model already sees; it ends at the first response that contains the sensitive
      information. Exact ATLAS chain identity: AML.T0057 - crafting prompts that induce the model to leak private user data
      or proprietary information is AML.T0057''s exact defined operation (LLM Data Leakage); evidence: pinned technique definition
      AML.T0057. Exfiltration through tool chains belongs to AP-T2-02 and exfiltration through rendered output belongs to
      AP-T1-06.'
    nist_classification:
      attacker_goal: privacy
      attacker_knowledge: black_box
      learning_stage: deployment
      attack_class: genai.direct_prompt_injection.privacy_compromises
    prerequisite_capabilities:
      min_zones:
      - input
      - reasoning
      kc_requires:
        any:
        - KC1.1
        - KC1.2
        - KC1.3
        - KC1.4
    canonical_chain:
      schema_version: v1
      pattern_id: AP-T6-08
      chain_id: AP-T6-08.chain.1
      semantic_revision: 1
      semantic_digest: ba37cfefbbb3ca6680ba383879dc3d29f5fd31de1684a9c44e7f5086517dd401
      taxonomy_context:
        atlas:
          release: '2026.05'
          digest: defd9014c6d5f5954460ef438faea583fcb1830ff81e85709628efb43037cc3a
        laaf: null
        mapping_set_digest: 15680b8778f51f30b1daf3ca2551437caebc3b8293c4b5e2ecf4d1b90756bfdc
      mappings:
      - decision: exact
        taxonomy: ATLAS
        ids:
        - AML.T0057
      steps:
      - step_id: craft_elicitation_prompt
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: outside
        action_kind: prepare
        consumed: []
        produced:
        - kind: artifact
          ref_id: elicitation_prompt
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.craft_elicitation_prompt
          description: A conversational pretext aimed at information the system holds or can reach is ready.
          security_relevant: false
          terminal: false
        resource_links: []
        observable_outcome_links: []
        order: 1
        attacker_controlled: true
        provenance:
          tier: designed
          references:
