            reference_id: owasp-llm-top10-2025:LLM02
          - reference_type: catalog
            reference_id: AML.T0057
          confidence: 50
          adaptation_rationale: 'Constructed step: the attacker chooses an authority claim, a claimed need, or a request split
            into innocuous parts, aimed at data the deployment holds.'
        mappings:
        - decision: unmapped
          taxonomy: ATLAS
          rationale: 'No exact ATLAS identity asserted: preparing the prompt is design work inside the attacker''s control;
            the pattern''s exact identity is the delivery step (AML.T0057).'
      - step_id: deliver_elicitation_prompt
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: crossing
        action_kind: deliver
        consumed:
        - kind: artifact
          ref_id: elicitation_prompt
          value_type: object
        produced:
