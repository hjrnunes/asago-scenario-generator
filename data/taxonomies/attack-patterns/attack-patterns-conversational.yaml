          ref_id: sensitive_data_disclosed
          value_type: boolean
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.disclose_sensitive_data
          description: 'The response states sensitive information that the requester is not entitled to receive: the first
            observable disclosure and the privacy violation.'
          security_relevant: true
          terminal: true
        resource_links: []
        observable_outcome_links:
        - postcondition_id: post.disclose_sensitive_data
          observation: rendered_output
          binding_slot_id: response_surface
