  AP-T6-10:
    id: AP-T6-10
    threat_id: T6
    name: Single-session jailbreak for prohibited content
    description: 'Use adversarial prompting such as role play, fictional framing, hypothetical framing, or obfuscation to
      make the model ignore its safety policy and produce content that the deployment is meant to withhold. The effect lasts
      only for the session and needs no persistent memory, tool, or retrieval source; the chain ends at the first response
      that supplies prohibited content. Exact ATLAS chain identity: AML.T0054 - inducing the model to circumvent its guardrails
      through adversarial prompting is AML.T0054''s exact defined operation (LLM Jailbreak); evidence: pinned technique definition
      AML.T0054. Overriding directives to drive tool execution belongs to AP-T6-02 and a jailbreak that persists through memory
      belongs to AP-T6-06.'
    nist_classification:
      attacker_goal: abuse
      attacker_knowledge: black_box
      learning_stage: deployment
      attack_class: genai.direct_prompt_injection.jailbreak
