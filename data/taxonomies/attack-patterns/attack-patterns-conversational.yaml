  AP-T5-05:
    id: AP-T5-05
    threat_id: T5
    name: Hallucinated-reference elicitation
    description: 'Ask the system for specific references in a domain where legitimate sources are sparse, such as package
      names, URLs, citations, organization names, or contact addresses, so that the model fabricates a reference with no real-world
      source and presents it as fact. The attack stays inside one conversation and needs no persistent memory, tool, or retrieval
      source; the chain ends at the first response that presents a fabricated reference. Exact ATLAS chain identity: AML.T0062
      - prompting the model and identifying hallucinated entities is AML.T0062''s exact defined operation (Discover LLM Hallucinations);
      evidence: pinned technique definition AML.T0062. A fabricated reference is the hallucinated entity that AML.T0060 (Publish
      Hallucinated Entities) lets an adversary register; this record stops at the fabricated reference and does not cover
      that registration. Spontaneous hallucination without an attacker''s probing is a failure, not an attack.'
    nist_classification:
      attacker_goal: integrity
      attacker_knowledge: black_box
      learning_stage: deployment
      attack_class: genai.direct_prompt_injection.integrity_violations
    prerequisite_capabilities:
