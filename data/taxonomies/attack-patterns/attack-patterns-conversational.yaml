          ref_id: elicitation_delivered
          value_type: boolean
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.deliver_elicitation_prompt
          description: The elicitation prompt reaches the model through the conversational entry point.
          security_relevant: false
          terminal: false
        resource_links:
