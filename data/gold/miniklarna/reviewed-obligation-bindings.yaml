# Reviewed obligation-to-action bindings for the miniklarna benchmark
# (owner ruling Q30(c) option iii, 2026-09-10).  Each binding connects a
# reviewed required obligation entry's tool_call realization to the exact
# target action that realizes it; an omission oracle (tool_absent) on the
# cited entry compiles only through one of these records.  Supply with
# `--reviewed-obligation-bindings`; the run validates every entry offline
# against the pinned loss analysis and the derived structure and pins the
# set on the target-derived-structure sidecar.
schema_version: reviewed-obligation-bindings-v1
bindings:
- constraint_id: SC-9
  obligation_id: O1
  action: escalate_to_human
  reviewed_by: owner
  reviewed_on: 2026-09-10
