hazards:
- hazard_id: H-1
  description: The NLP-powered chatbot generates medically inaccurate surgical procedure
    explanations that are subsequently uploaded to the patient's Electronic Health
    Record (EHR) via the summarisation pipeline.
  related_losses:
  - L-3
  - L-7
- hazard_id: H-2
  description: An attacker uses prompt injection to manipulate the chatbot into revealing
    PII/SPI from the patient's referral information or previous interaction transcripts.
  related_losses:
  - L-1
- hazard_id: H-3
  description: The AI-driven avatar video generation component produces culturally
    insensitive or linguistically inaccurate content for non-native English speakers
    due to biased training data.
  related_losses:
  - L-6
- hazard_id: H-4
  description: The integration point between OcciAI and the NHS App is compromised,
    allowing unauthorized access to patient questionnaire responses or chatbot interaction
    data.
  related_losses:
  - L-1
  - L-2
- hazard_id: H-5
  description: The automated questionnaire collection module fails to correctly map
    patient responses to the specific clinical specialty (e.g., Ophthalmology vs.
    Gynaecology), leading to incorrect data in the EHR.
  related_losses:
  - L-7
