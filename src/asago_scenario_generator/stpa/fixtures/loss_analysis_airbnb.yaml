hazards:
- hazard_id: H-1
  description: The CoT IO Handler assembles a prompt containing unmasked PII from
    the current trip information, which is then processed by a third-party LLM via
    the LLM Adapter.
  related_losses:
  - L-3
- hazard_id: H-2
  description: The LLM reasoning engine generates an incorrect tool payload for the
    'modify booking' tool, which is passed to the Tool Manager without being intercepted
    by a Tool Guardrail.
  related_losses:
  - L-2
  - L-12
  - L-13
- hazard_id: H-3
  description: The Content Moderation Guardrails fail to identify a scam attempt in
    the conversation history, allowing the LLM to provide deceptive advice to a Guest.
  related_losses:
  - L-2
  - L-15
- hazard_id: H-4
  description: The LLM Adapter facilitates a model swap that results in the LLM producing
    outputs that violate Airbnb's specific policy grounding due to differences in
    model reasoning capabilities.
  related_losses:
  - L-2
  - L-14
- hazard_id: H-5
  description: An adversary uses prompt injection to manipulate the reasoning traces
    within the Observability layer to hide unauthorized tool calls to the Reservation
    System.
  related_losses:
  - L-8
  - L-13
security_constraints:
- constraint_id: SC-1
  related_hazards:
  - H-1
  rule: The CoT IO Handler must redact or mask all PII/SPI from the trip information
    and conversation history before the prompt is sent to the LLM Adapter.
  applies_when: []
- constraint_id: SC-2
  related_hazards:
  - H-2
  - H-5
  rule: All tool payloads generated by the LLM reasoning engine must be validated
    against deterministic Tool Guardrails before execution by the Tool Manager.
  applies_when: []
- constraint_id: SC-3
  related_hazards:
  - H-3
  rule: Content Moderation Guardrails must successfully flag and block any communication
    content that violates Airbnb's safety policies before the response is delivered
    to the user.
  applies_when: []
- constraint_id: SC-4
  related_hazards:
  - H-4
  rule: The LLM Adapter must enforce strict schema adherence and policy-grounding
    checks to ensure model swaps do not degrade the accuracy of policy-related responses.
  applies_when: []
