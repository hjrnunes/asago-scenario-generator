[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asago-target-discovery"
version = "0.1.0"
description = "The MCP target-discovery scanner: inventory a target's tools and write its profile."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asago-scenario-generator>=0.1,<0.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
asago-target-scan = "asago_target_discovery.cli:app"

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
# The scanner reads the producer's STPA models and calls the app's provider
# client, so this member depends on the workspace root that depends on it.
asago-scenario-generator = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/asago_target_discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "replay_corpus: reads the replay corpus named by ASAGO_REPLAY_CORPUS (default: the workspace replay-corpus folder); CI deselects it because it has no corpus",
]
# The fakes the suite shares, including the CLI runner, the call log and the
# scripted client, live under tests/helpers; the suite reads nothing from the
# app's tests/ tree.
pythonpath = ["tests"]
