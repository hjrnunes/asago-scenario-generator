[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asago-contracts-core"
version = "0.1.0"
description = "The shared Asago contracts core: validation, canonical JSON and conformance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.0"]

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/asago_contracts_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "replay_corpus: reads the replay corpus named by ASAGO_REPLAY_CORPUS (default: the workspace replay-corpus folder); CI deselects it because it has no corpus",
]
